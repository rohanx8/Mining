/* ---------- Value bar ---------- */
const whatIfOn = () => Object.values(state.whatIf).some((v) => v);
// Owner's NPV for a given set of what-ifs (before or after risks), at the current inputs and risk settings.
function valueWith(wi, before = false) {
  const a = depositAsset(state.dep, 'custom', { wi });
  const deck = scaleDeck(baseDeckFor(a), 1 + (wi.price || 0) / 100);
  return runModel(a, { ...ctlFor(a), deck, rate: Math.max(0, state.rateBy.spodumene + (wi.rate || 0) / 100), enabled: before ? new Set() : ALL_DIALS() }).npvAttr;
}
function renderTop() {
  const a = assetById('custom'); const an = ANALYSIS.custom;
  $('#brand-asset').textContent = state.dep.name || 'New deposit';
  const pick = $('#start-from'); if (!pick.options.length) pick.innerHTML = `<option value="">Start from…</option>${PRESETS.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}`;
  pick.value = '';
  if (an.pending || !(a.derived.resMt > 0)) { morph($('#valuebar'), `<div class="wrap c-vb"><span class="muted">Enter the resource to see a value.</span>${state.undo ? `<button type="button" class="btn c-reset" data-undo-load>Undo: back to ${esc(state.undo.dep.name || 'your inputs')}</button>` : ''}</div>`); return; }
  const on = whatIfOn(); const diff = on ? an.risk.npvAttr - valueWith({}) : 0;
  morph($('#valuebar'), `<div class="wrap c-vb">
    <div class="c-kpi c-kpi-main"><span class="k">NPV after risks ${info('i-npv', `<p>Owner’s NPV at ${pct(an.risk.rate, 1)} real, after the risk settings. This is the most you could pay for the project at that rate.</p>`, 'About NPV after risks')}</span><b id="kpi-risk">${money(an.risk.npvAttr)}</b>${on ? `<span class="c-delta ${diff < 0 ? 'neg' : ''}" id="kpi-delta">${money(diff, { plus: true })} vs your inputs</span>` : ''}</div>
    <div class="c-kpi"><span class="k">Before risks</span><b id="kpi-base">${money(an.base.npvAttr)}</b></div>
    <div class="c-kpi"><span class="k">IRR</span><b id="kpi-irr">${irrText(an.risk.irr)}</b></div>
    <div class="c-kpi c-kpi-x"><span class="k">Capex</span><b>US$${num1(a.derived.capexM, 0)}M</b></div>
    <div class="c-kpi c-kpi-x"><span class="k">First production</span><b>${a.derived.firstProd}</b></div>
    ${state.undo ? `<button type="button" class="btn c-reset" id="undo-load" data-undo-load>Undo: back to ${esc(state.undo.dep.name || 'your inputs')}</button>` : on ? '<button type="button" class="btn c-reset" id="reset-wi-top" data-wi-reset>Reset what-ifs</button>' : ''}
  </div>`);
}

/* ---------- Risks: the standard settings ---------- */
function risksHTML(a, an) {
  const lv = state.levels.custom;
  const changed = DIALS.filter((d) => lv[d.id] !== a.dialDefaults[d.id].level).length;
  const rows = DIALS.map((d) => {
    const def = a.dialDefaults[d.id]; const cur = lv[d.id]; const b = an.bridge.find((x) => x.dial.id === d.id);
    const tip = `<p><b>${esc(d.name)}</b>: ${esc(d.question)}</p><p>${LEVELS.map((L) => (L === cur ? `<b>${LEVEL_NAME[L]}: ${esc(d.levels[L].text)}</b>` : `${LEVEL_NAME[L]}: ${esc(d.levels[L].text)}`)).join('<br>')}</p><p>Starts at ${LEVEL_NAME[def.level]}: ${esc(def.reason)}</p>`;
    return `<div class="c-risk"><span class="c-risk-n">${esc(d.short)}${info(`i-risk-${d.id}`, tip, `About ${d.name}`)}</span>
      <span class="c-risk-s"><input type="range" class="lvl ${cur}" id="lvl-${d.id}" min="0" max="2" step="1" value="${LEVELS.indexOf(cur)}" data-role="level-slider" data-dial="${d.id}" aria-label="${esc(d.name)}: low, medium or high" aria-valuetext="${LEVEL_NAME[cur]}"><span class="lvl-scale" aria-hidden="true">${LEVELS.map((L) => `<span class="${L === cur ? `on ${L}` : ''}">${LEVEL_NAME[L]}</span>`).join('')}</span></span>
      <span class="c-risk-v ${b.delta < -0.05e6 ? 'neg' : ''}">${Math.abs(b.delta) < 0.05e6 ? '–' : money(b.delta, { plus: true })}</span></div>`;
  }).join('');
  return `<section class="panel c-panel" aria-labelledby="risks-t"><div class="c-ph"><h2 id="risks-t">Risks ${info('i-risks', '<p>Standard risk settings. Each changes one part of the model: an input, a delay, a chance of stoppage, or the discount rate. The amounts add up to the gap between value before and after risks.</p>', 'About the risks')}</h2>${changed ? `<button type="button" class="link-btn" id="reset-risks" data-reset-all>Reset (${changed})</button>` : ''}</div>${rows}</section>`;
}

/* ---------- What if: move a driver, see the value ---------- */

  { k: 'recovery', label: 'Recovery', min: -10, max: 10, step: 1, fmt: (v) => `${v > 0 ? '+' : ''}${v} pts`, tip: 'Lithia recovery, in percentage points.' },
  { k: 'grade', label: 'Head grade', min: -20, max: 20, step: 5, fmt: (v) => `${v > 0 ? '+' : ''}${v}%`, tip: 'Grade of the ore sent to the plant.' },

];
function whatIfHTML() {
  const rows = WHATIF.map((w) => { const v = state.whatIf[w.k] || 0;
    return `<div class="c-wi"><label for="wi-${w.k}">${w.label}${info(`i-wi-${w.k}`, `<p>${w.tip}</p>`, `About ${w.label}`)}</label>
      <input type="range" class="c-range" id="wi-${w.k}" min="${w.min}" max="${w.max}" step="${w.step}" value="${v}" data-role="wi" data-k="${w.k}" aria-valuetext="${w.fmt(v)}">
      <output class="c-wi-v ${v ? 'on' : ''}" id="wiv-${w.k}" for="wi-${w.k}">${w.fmt(v)}</output></div>`; }).join('');

}

// Value with extra moves on top of the current what-ifs.
function wiValue(extra = {}, before = false) {
  const wi = { ...state.whatIf }; for (const [k, v] of Object.entries(extra)) wi[k] = (wi[k] || 0) + v;
  return valueWith(wi, before);
}

/* ---------- Sensitivities ---------- */
function sensHTML() {
  const views = [['tornado', 'Tornado'], ['grid', 'Price × capex'], ['curve', 'Price curve']];
  const v = views.some((x) => x[0] === state.sens) ? state.sens : 'tornado';
  const tips = { tornado: 'Value after risks when each driver moves on its own. The longest bars matter most.', grid: 'Value after risks as price and capex move together.', curve: 'Value before and after risks as the whole price deck moves.' };
  const seg = views.map(([k, t]) => `<input type="radio" name="sens" id="sens-${k}" value="${k}" data-role="sens" ${k === v ? 'checked' : ''}><label for="sens-${k}">${t}</label>`).join('');
  return `<section class="panel c-panel" aria-labelledby="sens-t"><div class="c-ph"><h2 id="sens-t">Sensitivities ${info('i-sens', `<p>${tips[v]}</p>`, 'About this chart')}</h2></div>
    <fieldset class="seg c-seg"><legend class="sr-only">Which sensitivity</legend>${seg}</fieldset>
    ${v === 'grid' ? gridTableHTML() : `<div class="chart" id="sens-chart" data-view="${v}"></div>`}</section>`;
}
function tornadoData() {
  const base = wiValue({});
  const cases = [['Price ±20%', { price: -20 }, { price: 20 }], ['Capex ±20%', { capex: 20 }, { capex: -20 }], ['Opex ±20%', { opex: 20 }, { opex: -20 }],
    ['Recovery ±5 pts', { recovery: -5 }, { recovery: 5 }], ['Grade ±10%', { grade: -10 }, { grade: 10 }], ['Rate ±2 pts', { rate: 2 }, { rate: -2 }], ['Delay +1 yr', { delay: 1 }, null]]
    .map(([label, lo, hi]) => { const dlo = wiValue(lo) - base; const dhi = hi ? wiValue(hi) - base : null; return { label, dlo, dhi, mag: Math.max(Math.abs(dlo), Math.abs(dhi || 0)) }; });
  cases.sort((x, y) => y.mag - x.mag);
  return { base, cases };
}
function gridTableHTML() {
  const cols = [-30, -15, 0, 15, 30]; const rows = [-20, 0, 20, 50];
  const lbl = (x) => (x === 0 ? 'Now' : `${x > 0 ? '+' : MINUS}${Math.abs(x)}%`);
  const m = (v) => `${v < 0 ? MINUS : ''}${Math.round(Math.abs(v) / 1e6).toLocaleString('en-US')}`;
  const body = rows.map((r) => `<tr><th scope="row">Capex ${lbl(r).toLowerCase()}</th>${cols.map((c) => { const v = wiValue({ price: c, capex: r }); return `<td class="n ${v < 0 ? 'neg' : ''} ${r === 0 && c === 0 ? 'cur' : ''}">${m(v)}</td>`; }).join('')}</tr>`).join('');
  return `<div class="table-wrap"><table class="mv-grid"><caption class="small muted">Value after risks, US$M</caption>
    <thead><tr><th scope="col" rowspan="2"></th><th scope="colgroup" colspan="5">Price</th></tr><tr>${cols.map((c) => `<th scope="col">${lbl(c)}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody></table></div>`;
}
function priceCurve() { return [-50, -37.5, -25, -12.5, 0, 12.5, 25, 37.5, 50].map((x) => ({ p: x, b: wiValue({ price: x }, true), r: wiValue({ price: x }) })); }
function priceCurveSVG(pts, width) {
  const W = Math.max(300, width); const narrow = W < 520; const H = narrow ? 220 : 250;
  const m = { l: narrow ? 50 : 60, r: 16, t: 18, b: 40 };
  const x0 = pts[0].p; const x1 = pts[pts.length - 1].p;
  const vals = pts.flatMap((q) => [q.b, q.r]).concat([0]);
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 5);
  const yMin = Math.min(...vals, ticks[0]); const yMax = Math.max(...vals, ticks[ticks.length - 1]);
  const sx = (v) => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
  const sy = (v) => m.t + (yMax - v) / ((yMax - yMin) || 1) * (H - m.t - m.b);
  let g = '';
  for (const t of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(t)}" y2="${sy(t)}" class="${t === 0 ? 's-axis' : 's-grid'}"/><text x="${m.l - 6}" y="${sy(t) + 4}" text-anchor="end" font-size="11" class="t-muted">${esc(axisMoney(t))}</text>`;
  for (const t of [-50, -25, 0, 25, 50]) g += `<text x="${sx(t)}" y="${H - m.b + 16}" text-anchor="middle" font-size="11" class="t-muted">${t > 0 ? '+' : ''}${t}%</text>`;
  g += `<text x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle" font-size="11" class="t-muted">Price change, whole deck</text>`;
  g += `<line x1="${sx(0)}" x2="${sx(0)}" y1="${m.t}" y2="${H - m.b}" class="s-gold" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${sx(0) + 5}" y="${m.t + 4}" font-size="11" class="t-ink">Now</text>`;
  const path = (k) => pts.map((q, i) => `${i ? 'L' : 'M'}${sx(q.p).toFixed(1)},${sy(q[k]).toFixed(1)}`).join(' ');
  g += `<path d="${path('b')}" fill="none" class="s-before" stroke-width="2"/><path d="${path('r')}" fill="none" class="s-after" stroke-width="2.6"/>`;
  for (const q of pts) g += `<circle cx="${sx(q.p).toFixed(1)}" cy="${sy(q.r).toFixed(1)}" r="2.6" class="f-after"/>`;
  let be = null;
  for (let i = 1; i < pts.length; i++) { const p0 = pts[i - 1]; const p1 = pts[i]; if ((p0.r < 0) !== (p1.r < 0)) { be = p0.p + (0 - p0.r) * (p1.p - p0.p) / (p1.r - p0.r); break; } }
  if (be != null) g += `<circle cx="${sx(be)}" cy="${sy(0)}" r="4.5" class="f-after"/><text x="${sx(be) + 110 > W - m.r ? sx(be) - 8 : sx(be) + 8}" y="${sy(0) + 15}" text-anchor="${sx(be) + 110 > W - m.r ? 'end' : 'start'}" font-size="11" class="t-ink">Breakeven ${be > 0 ? '+' : be < 0 ? MINUS : ''}${Math.abs(Math.round(be))}%</text>`;
  const desc = `Value before and after risks as the price deck moves: ${pts.map((q) => `${q.p}%: ${money(q.b)} before, ${money(q.r)} after`).join('; ')}.`;
  return `<div class="legend"><span><i class="sw sw-before"></i>Before risks</span><span><i class="sw sw-after"></i>After risks</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(desc)}">${g}</svg>`;
}

function cashHTML(a, an) {
  return `<details class="panel c-panel c-cash" data-open-id="sec-cash" ${state.open.has('sec-cash') ? 'open' : ''}><summary id="sum-cash"><h2>Annual cash flow</h2></summary>
    <fieldset class="seg c-seg" aria-label="Which case"><input type="radio" name="tablemode" id="tm-risk" value="risk" data-role="tablemode" ${state.tableMode === 'risk' ? 'checked' : ''}><label for="tm-risk">After risks</label>

/* ---------- Data: the typical values and where they come from ---------- */
function dataHTML() {
  const used = new Set();
  const rows = Object.values(LI_TYPICALS).map((t) => { t.points.forEach((p) => used.add(p[0]));
    return `<tr><th scope="row" class="wrap-cell">${esc(t.label)}</th><td class="n">${num1(t.median, dpFor(t.median))} ${esc(t.unit)}</td><td class="n">${t.n > 1 ? `${num1(t.low)}–${num1(t.high)}` : '–'}</td><td class="n">${t.n}</td><td class="wrap-cell small">${t.points.map((p) => `${p[0]} p${p[2]}`).join(', ')}</td></tr>`; }).join('');
  const keys = [...used].filter((k) => LI_STUDIES[k]).map((k) => `<li><b>${k}</b> ${esc(LI_STUDIES[k].source)}</li>`).join('');
  return `<p class="small muted">Medians of published studies, with costs in 2024 prices. A blank input uses its row; head grade, contingency and the studies’ discount rates are there for comparison.</p>

/* ---------- Kept helpers: value ladder (used by the checks), charts, cash-flow table ---------- */
function valueLadder(asset, an) {
  const b = an.base; const prod = b.years.filter((y) => !y.release && y.ore > 0);
  const K = COMMODITY[commodityOf(asset)]; const pr = asset.processing; const ref = DECKS[commodityOf(asset)].spot.flat;
  const contained = sum(prod, (y) => K.containedRef(y.milled, y.grade));
  const recovered = sum(prod, (y) => K.containedRef(y.milled, y.grade) * y.recovery);
  const payable = sum(prod, (y) => K.refUnits(y.oz, pr));
  const L = {
    ref, contained, recovered, payable,
    inSitu: contained * ref,
    metLoss: -(contained - recovered) * ref,
    payLoss: -(recovered - payable) * ref,
    revenue: sum(b.years, (y) => y.revenue),
    byproduct: sum(b.years, (y) => y.byproduct || 0),
    logistics: -sum(b.years, (y) => y.logistics || 0),
    other: -sum(b.years, (y) => y.other || 0),
    freight: -sum(b.years, (y) => y.freight || 0),
    stream: -sum(b.years, (y) => y.stream),
    royalties: -sum(b.years, (y) => y.royalties),
    site: -sum(b.years, (y) => y.site),
    overhead: -sum(b.years, (y) => y.corporate + y.exploration),
    capex: -sum(b.years, (y) => y.capex),
    closure: -sum(b.years, (y) => y.closure),
    tax: -sum(b.years, (y) => y.tax),
    wc: -sum(b.years, (y) => y.dWC),
    cash: sum(b.years, (y) => y.fcf),
    npv: b.npv, attr: b.npvAttr, risk: an.risk.npvAttr
  };
  const realisation = pr.realisation != null ? pr.realisation : 1;
  L.realLoss = realisation > 0 ? L.revenue - L.revenue / realisation : 0;   // what selling below the benchmark costs
  L.deckGap = L.revenue - L.realLoss - payable * ref;
  L.discount = L.npv - L.cash;
  L.partners = L.attr - L.npv;
  L.dials = L.risk - L.attr;
  return L;
}

function tornadoSVG(T, width) {
  const W = Math.max(300, width); const narrow = W < 520;
  const labelW = narrow ? 118 : 176; const rowH = 30; const barH = 14; const top = 6; const axisH = 22;
  const H = top + T.cases.length * rowH + axisH;
  const max = Math.max(1, ...T.cases.map((c) => c.mag)) * (narrow ? 1.7 : 1.45);
  const x0 = labelW + 6; const x1 = W - 4; const mid = (x0 + x1) / 2;
  const sx = (d) => mid + d / max * (x1 - x0) / 2;
  const short = (s) => narrow ? s.replace('US$', '') : s;
  let g = `<line x1="${mid}" x2="${mid}" y1="${top}" y2="${top + T.cases.length * rowH}" class="s-axis" stroke-width="1.5"/>`;
  g += `<text x="${mid}" y="${H - 6}" text-anchor="middle" font-size="11" class="t-muted">Base ${esc(short(money(T.base)))}</text>`;
  T.cases.forEach((c, i) => {
    const yMid = top + i * rowH + rowH / 2; const yb = yMid - barH / 2;
    g += `<text x="0" y="${yMid + 4}" font-size="12.5" class="t-ink">${esc(c.label)}</text>`;
    for (const d of [c.dlo, c.dhi]) {
      if (d == null) continue;
      const xa = Math.min(sx(0), sx(d)); const w = Math.max(1.5, Math.abs(sx(d) - sx(0)));
      g += `<rect x="${xa}" y="${yb}" width="${w}" height="${barH}" rx="2" class="${d < 0 ? 'f-loss' : 'f-gain'}"/>`;
      g += `<text x="${d < 0 ? xa - 4 : xa + w + 4}" y="${yMid + 4}" text-anchor="${d < 0 ? 'end' : 'start'}" font-size="11.5" class="t-ink">${esc(short(money(d, { plus: true })))}</text>`;
    }
  });
  const desc = 'Change in owner’s NPV from one input at a time: ' + T.cases.map((c) => `${c.label}: ${c.dlo != null ? money(c.dlo, { plus: true }) : ''}${c.dlo != null && c.dhi != null ? ' / ' : ''}${c.dhi != null ? money(c.dhi, { plus: true }) : ''}`).join('; ') + '.';
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(desc)}">${g}</svg>`;
}

function axisMoney(v) {
  if (Math.abs(v) < 1) return '$0';
  const m = v / 1e6; const a = Math.abs(m);
  const s = a >= 1000 ? (a / 1000).toFixed(1) + 'B' : (a >= 10 ? Math.round(a) : a.toFixed(1)) + 'M';
  return (m < 0 ? MINUS : '') + '$' + s;
}

function niceTicks(lo, hi, n) {
  const span = hi - lo; if (!(span > 0)) return [lo];
  const raw = span / n; const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.abs(v) < 1e-9 ? 0 : v);
  return out;
}

function cashTable(a, r) {
  const ys = r.years;
  const cols = ys.map((y) => `<th scope="col">${y.year}${y.release ? '<br><span class="muted">WC release</span>' : ''}</th>`).join('');

  const flow = (k) => (y) => mnum(y[k]);

  return `<div class="table-wrap"><table>

      ${row(`Price (${UN().price}${UN().basis})`, (y) => y.release || !y.ore ? '' : Math.round(y.price).toLocaleString('en-US'))}
      ${row('Revenue', flow('revenue'), 'sep', tot('revenue'))}
      ${a.stream ? row('Stream deliveries', neg('stream'), '', tot('stream', -1)) : ''}
      ${sum(ys, (y) => y.byproduct || 0) ? row('By-product credits', flow('byproduct'), '', tot('byproduct')) : ''}
      ${row('Royalties', neg('royalties'), '', tot('royalties', -1))}

      ${sum(ys, (y) => y.logistics || 0) ? row('Haulage to port', neg('logistics'), '', tot('logistics', -1)) : ''}
      ${sum(ys, (y) => y.freight || 0) ? row('Ocean freight', neg('freight'), '', tot('freight', -1)) : ''}
      ${row('EBITDA', flow('ebitda'), 'strong', tot('ebitda'))}
      ${row('Capex', neg('capex'), '', tot('capex', -1))}
      ${row('Tax depreciation (not cash)', flow('depreciation'), 'muted', tot('depreciation'))}
      ${row('Tax', neg('tax'), '', tot('tax', -1))}
      ${row('Change in working capital', neg('dWC'), '', tot('dWC', -1))}
      ${row('Closure', neg('closure'), '', tot('closure', -1))}
      ${row('Free cash flow (100%)', flow('fcf'), 'strong sep', tot('fcf'))}
      ${row('Owner’s share', (y) => pct(y.ownerShare, 1))}
      ${row(`Discount factor at ${pct(r.rate, 2)}`, (y) => y.df.toFixed(4))}
      ${row('PV of owner’s free cash flow', flow('pvAttr'), 'strong', mnum(r.npvAttr))}
    </tbody></table></div>`;
}

    const low = { ...ctlC, enabled: new Set(), flatPrice: 500 };
    const withFlex = runModel(C, low); const noFlex = runModel(C, { ...low, flex: false });
    add('A mine that loses cash closes rather than mining at a loss', withFlex.npvAttr >= noFlex.npvAttr && !!withFlex.flex,
      `At US$500/t: ${money(withFlex.npvAttr)} with the option to close (${withFlex.flex ? 'closes ' + withFlex.flex.closedFrom : 'no stop'}), ${money(noFlex.npvAttr)} without`);
    add('After risks ≤ before risks', anC.risk.npvAttr <= anC.base.npvAttr + 1, `${money(anC.risk.npvAttr)} ≤ ${money(anC.base.npvAttr)}`);
    const pc = priceCurve(); const mono = pc.every((q, i) => i === 0 || (q.r >= pc[i - 1].r - 1 && q.b >= pc[i - 1].b - 1));
    add('Value rises with the price', mono, `${money(pc[0].r)} at −50% to ${money(pc[pc.length - 1].r)} at +50%`);
    const ds = [0, 1, 2, 3].map((k) => wiValue({ delay: k }));
    add('Each year of delay costs value', ds.every((x, i) => i === 0 || x <= ds[i - 1] + 1), ds.map((x) => money(x)).join(' → '));
    const v0 = wiValue({});
    const dirs = [['capex +20% lowers it', wiValue({ capex: 20 }) < v0], ['operating cost +20% lowers it', wiValue({ opex: 20 }) < v0], ['recovery +5 points raises it', wiValue({ recovery: 5 }) > v0],
      ['grade +10% raises it', wiValue({ grade: 10 }) > v0], ['discount rate +2 points lowers it', wiValue({ rate: 2 }) < v0]];
    add('Each what-if moves value the right way', dirs.every((x) => x[1]), dirs.map(([n, ok]) => `${n}: ${ok ? 'yes' : 'NO'}`).join('; '));
    const C0 = depositAsset(state.dep, 'custom', { wi: { ...state.whatIf, price: 0 } }); const ctl0 = ctlFor(C0);
    const viaTweak = runModel(C0, { ...ctl0, deck: baseDeckFor(C0), rate: curRateFor(C0), enabled: ALL_DIALS(), tweak: { gold: 1.1 } }).npvAttr;
    const viaWhatIf = valueWith({ ...state.whatIf, price: 10 });
    add('The price what-if matches the engine’s price lever', Math.abs(viaTweak - viaWhatIf) < 1, `+10%: ${money(viaWhatIf)} vs ${money(viaTweak)}`);
    const capT = typical('capex_per_annual_t_ore');
    add('Typical capex excludes the existing-plant case and is in 2024 prices', !capT.points.some((p) => p[0] === 'S11n') && capT.points.some((p) => /CPI/.test(p[3])), `Median US$${capT.median.toFixed(1)} per t/yr across ${capT.n} own-plant studies`);
  }
  group = 'Bridge, robustness and screens';
  for (const a of ASSETS) {
    const an = ANALYSIS[a.id]; if (an.pending) continue;
    const s = sum(an.bridge, (x) => x.delta); const d = an.risk.npvAttr - an.base.npvAttr;
    add(`${a.name}: bridge bars sum to risk-adjusted minus base`, Math.abs(s - d) < 0.1e6, `${money(s)} vs ${money(d)} (diff ${(Math.abs(s - d) / 1e6).toFixed(6)}M)`);
  }
  for (const a of ASSETS) {
    const an = ANALYSIS[a.id]; if (an.pending) continue;
    const L = valueLadder(a, an);
    const g1 = L.inSitu + L.metLoss + L.payLoss + L.deckGap + L.realLoss - L.revenue;
    const g2 = L.revenue + L.byproduct + L.stream + L.royalties + L.site + L.overhead + L.logistics + L.freight + L.other + L.capex + L.closure + L.tax + L.wc - L.cash;
    const g3 = L.cash + L.discount + L.partners + L.dials - L.risk;
    const worstL = Math.max(Math.abs(g1), Math.abs(g2), Math.abs(g3));
    add(`${a.name}: value ladder adds up from in-situ value to risk-adjusted value`, worstL < 1e3, `${money(L.inSitu)} in-situ → ${money(L.revenue)} revenue → ${money(L.cash)} cash flow → ${money(L.risk)}; largest gap US$${worstL.toFixed(2)}`);
  }
  // 4. No NaN, no negative production across decks, dial sets and plan options
  let runs = 0; let bad = [];
  for (const a of ASSETS) {
    if (a.dataStatus === 'pending') continue;
    const sets = { defaults: state.levels[a.id], allL: {}, allM: {}, allH: {} };
    for (const d of DIALS) { sets.allL[d.id] = 'L'; sets.allM[d.id] = 'M'; sets.allH[d.id] = 'H'; }
    const exts = a.schedule.kind === 'fixed' ? [0, 1] : [0, 2, a.schedule.extension.maxYears];
    for (const deck of Object.values(PRICE_DECKS)) for (const [nm, lv] of Object.entries(sets)) for (const ext of exts) for (const en of [new Set(), ALL_DIALS()]) {
      const res = runModel(a, { deck, rate: 0.05, levels: lv, enabled: en, ext }); runs++;
      const nums = [res.npv, res.npvAttr, res.prod1, res.lomOz, res.life].concat(res.prod1 > 0 ? [res.aisc1] : []);   // a mine closed before it produces has no AISC
      for (const y of res.years) nums.push(y.oz, y.fcf, y.tax, y.revenue, y.site, y.capex, y.df, y.milled, y.ore);
      if (nums.some((x) => !isFinite(x))) bad.push(`${a.name}/${deck.id}/${nm}/ext${ext}: non-finite value`);
      if (res.years.some((y) => y.oz < 0 || y.ore < 0 || y.milled < 0)) bad.push(`${a.name}/${deck.id}/${nm}/ext${ext}: negative production`);
    }
  }
  add('No NaN and no negative production', bad.length === 0, `${runs} model runs${bad.length ? '; ' + bad.slice(0, 3).join('; ') : ''}`);
  // Live update: a risk or what-if change redraws the value and the charts
  const snap = () => $('#valuebar').textContent + '|' + $('#tinker').textContent;
  renderAll(true); const before = snap();
  const oldLv = state.levels.custom.recovery; state.levels.custom.recovery = oldLv === 'H' ? 'L' : 'H';
  renderAll(true); const afterLv = snap();
  state.levels.custom.recovery = oldLv; renderAll(true);
  add('A risk change updates the value and the sensitivities', before !== afterLv && snap() === before, 'Recovery risk moved and moved back');
  const oldP = state.whatIf.price; state.whatIf.price = oldP + 10; rebuildCustom(); renderAll(true); const afterP = snap();
  state.whatIf.price = oldP; rebuildCustom(); renderAll(true);
  add('A what-if move updates the value and the sensitivities', before !== afterP && snap() === before, 'Price +10% and back');
  const overflow = document.documentElement.scrollWidth - document.documentElement.clientWidth;
  add('No horizontal page scroll at this width', overflow <= 1, `viewport ${window.innerWidth}px, overflow ${overflow}px.${window.innerWidth > 420 ? ' Narrow the window to 375px to test the phone layout.' : ''}`);
  return out;
}

function checksHTML() {
  const res = runChecks(); const pass = res.filter((r) => r.ok).length;
  const log = res.map((r) => `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}  →  ${r.detail}`).join('\n');
  try { console.log('Mining Risk Explorer checks\n' + log); } catch (e) { /* console unavailable */ }
  const groups = [...new Set(res.map((r) => r.group))];
  return `<p><b>${pass} of ${res.length} checks pass.</b> Spreadsheet cases must match to US$0.01M. The brief’s targets allow 1% of the target or half the last digit it is stated to, whichever is larger.</p>
    ${groups.map((g) => `<h3>${esc(g)}</h3><ul class="checks-list">${res.filter((r) => r.group === g).map((r) => `<li><span class="res ${r.ok ? 'res-pass' : 'res-fail'}">${r.ok ? 'PASS' : 'FAIL'}</span><span><b>${esc(r.name)}</b><br><span class="muted">${esc(r.detail)}</span></span></li>`).join('')}</ul>`).join('')}
    <details class="more"><summary>Plain-text log</summary><pre class="log">${esc(log)}</pre></details>`;
}

/* =====================================================================
   7. WIRING
   ===================================================================== */
function renderAll(silent) {
  const active = document.activeElement && document.activeElement.id ? document.activeElement.id : null;
  const a = assetById('custom'); UCTX = 'spodumene';
  ANALYSIS.custom = a.derived.resMt > 0 ? analyse(a, ctlFor(a)) : { pending: true };
  hidePop(); INFO.clear();
  renderTop(); renderInputs(); renderTinker();
  drawCharts();
  if (active && !silent) { const el = document.getElementById(active); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
}

// The "i" popover sits right after the row it explains, so the keyboard reaches its buttons next.
let popBtn = null;
function showPop(btn) {
  const pop = $('#pop'); pop.innerHTML = INFO.get(btn.dataset.info) || '';
  const host = btn.closest('.c-f, .c-risk, .c-wi, .c-kpi, .c-ph') || btn.parentElement;
  host.after(pop); pop.hidden = false;
  const vw = document.documentElement.clientWidth; const w = Math.min(320, vw - 32);
  pop.style.width = w + 'px';
  const r = btn.getBoundingClientRect(); const pr = (pop.offsetParent || document.body).getBoundingClientRect();
  const left = Math.max(16, Math.min(r.left - 8, vw - w - 16));
  pop.style.left = (left - pr.left) + 'px'; pop.style.top = (r.bottom + 6 - pr.top) + 'px';
  if (popBtn) popBtn.setAttribute('aria-expanded', 'false');
  popBtn = btn; btn.setAttribute('aria-expanded', 'true');
}
function hidePop() {
  const pop = $('#pop'); if (!pop) return;
  if (popBtn) popBtn.setAttribute('aria-expanded', 'false');
  popBtn = null; pop.hidden = true;
  if (pop.parentElement !== document.body) document.body.appendChild(pop);   // keep it out of the panels that get redrawn
}

// While a what-if slider moves, update the headline numbers only; the page redraws when it settles.
function quickUpdate() {
  const i = ASSETS.findIndex((x) => x.id === 'custom'); ASSETS[i] = depositAsset(state.dep, 'custom', { wi: state.whatIf });
  const a = ASSETS[i]; if (!(a.derived.resMt > 0)) return;
  const ctl = ctlFor(a);
  const r = runModel(a, { ...ctl, enabled: ALL_DIALS() }); const b = runModel(a, { ...ctl, enabled: new Set() });
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  set('kpi-risk', money(r.npvAttr)); set('kpi-base', money(b.npvAttr)); set('kpi-irr', irrText(r.irr));
}

document.addEventListener('input', (e) => {
  const t = e.target; const ds = t.dataset || {};
  if (ds.role === 'level-slider') {   // the label follows the thumb; the model reruns when it settles
    const L = LEVELS[Number(t.value)];
    t.setAttribute('aria-valuetext', LEVEL_NAME[L]); t.classList.remove('L', 'M', 'H'); t.classList.add(L);
    const sc = t.parentElement.querySelector('.lvl-scale'); if (sc) [...sc.children].forEach((sp, i) => { sp.className = LEVELS[i] === L ? `on ${L}` : ''; });
  } else if (ds.role === 'wi') {
    const w = WHATIF.find((x) => x.k === ds.k); const v = Number(t.value); state.whatIf[ds.k] = v;
    const o = document.getElementById('wiv-' + ds.k); if (o) { o.textContent = w.fmt(v); o.classList.toggle('on', v !== 0); }
    t.setAttribute('aria-valuetext', w.fmt(v)); quickUpdate();
  }
});
document.addEventListener('change', (e) => {
  const t = e.target; const ds = t.dataset || {}; const role = ds.role;
  if (role === 'level-slider') { state.levels.custom[ds.dial] = LEVELS[Number(t.value)]; renderAll(); return; }
  if (role === 'wi') { state.whatIf[ds.k] = Number(t.value); rebuildCustom(); renderAll(); return; }
  if (role === 'sens') { state.sens = t.value; renderAll(); return; }
  if (role === 'tablemode') { state.tableMode = t.value; renderAll(); return; }
  if (role === 'preset') { if (t.value) loadPreset(t.value); return; }
  if (ds.dep) { state.undo = null; onDepInput(t); return; }
  if (ds.depDeck) { state.deckBy.spodumene = t.value; renderAll(); return; }
  if (ds.depRate) { const v = Number(t.value); if (isFinite(v)) { state.rateBy.spodumene = Math.max(0, Math.min(0.2, v / 100)); renderAll(); } return; }
  if (ds.depLt) { const v = t.value === '' ? null : Number(t.value); if (v == null || (isFinite(v) && v > 0)) { state.lt.spodumene = v; renderAll(); } }
});
document.addEventListener('toggle', (e) => {
  const d = e.target; if (!d.dataset || !d.dataset.openId) return;
  if (d.open) state.open.add(d.dataset.openId); else state.open.delete(d.dataset.openId);
}, true);
document.addEventListener('click', (e) => {
  const el = e.target.closest('button, a');
  if (!$('#pop').hidden && !e.target.closest('#pop') && el !== popBtn) hidePop();
  if (!el) return;
  if (el.dataset.info) { if (popBtn === el) hidePop(); else showPop(el); return; }
  if (el.hasAttribute('data-wi-reset')) { for (const k of Object.keys(state.whatIf)) state.whatIf[k] = 0; rebuildCustom(); renderAll(true); return; }
  if (el.hasAttribute('data-undo-load')) { undoLoad(); return; }
  if (el.dataset.depTyp) { state.undo = null; setPath(state.dep, el.dataset.depTyp, null); rebuildCustom(); renderAll(true); return; }
  if (el.dataset.depSrc) { hidePop(); evidenceSheet(el.dataset.depSrc); return; }
  if (el.hasAttribute('data-reset-all')) { const a = assetById('custom'); for (const d of DIALS) state.levels.custom[d.id] = a.dialDefaults[d.id].level; renderAll(true); return; }
  if (el.dataset.open === 'data') { openSheet('Data', dataHTML()); return; }
  if (el.dataset.open === 'checks') { openSheet('Checks', checksHTML()); return; }
  if (el.id === 'sheet-close') closeSheet();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && popBtn) { const b = popBtn; hidePop(); b.focus(); }
});
// A popover opened from the sticky bar would drift as the page scrolls, so it closes.
window.addEventListener('scroll', () => { if (popBtn && popBtn.closest('#topbar')) hidePop(); }, { passive: true });
let resizeTimer = null; let lastWidth = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (window.innerWidth === lastWidth) return; lastWidth = window.innerWidth; hidePop(); drawCharts(); }, 120); });
$('#sheet').addEventListener('click', (e) => { if (e.target === $('#sheet')) closeSheet(); });

(function start() {
  initDeposits();
  renderAll(true);
})();
</script>
</body>
