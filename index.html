  const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${Wp} ${Hp}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,
    `<< /Title ${pdfStr(`${name}: valuation memo`)} /Producer (Mining Risk Explorer) >>`];
  let pdf = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const offs = [];
  objs.forEach((o, i) => { offs.push(pdf.length); pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n${offs.map((o) => `${String(o).padStart(10, '0')} 00000 n \n`).join('')}trailer\n<< /Size ${objs.length + 1} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return Uint8Array.from(pdf, (ch) => ch.charCodeAt(0) & 255);   // every character is one byte by construction
}

// Value against one driver: after risks (bold) and, where given, before risks. pts: [{ x, tick, r, b? }].
function curveSVG(pts, width, o = {}) {
  const W = Math.max(300, width); const narrow = W < 520; const H = narrow ? 220 : 260;
  const m = { l: narrow ? 50 : 60, r: 18, t: 18, b: 40 };
  const hasB = pts.some((q) => q.b != null);
  const x0 = pts[0].x; const x1 = pts[pts.length - 1].x;
  const vals = pts.flatMap((q) => (hasB ? [q.b, q.r] : [q.r])).concat([0]);
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 5);
  const yMin = Math.min(...vals, ticks[0]); const yMax = Math.max(...vals, ticks[ticks.length - 1]);
  const sx = (v) => m.l + (v - x0) / ((x1 - x0) || 1) * (W - m.l - m.r);
  const sy = (v) => m.t + (yMax - v) / ((yMax - yMin) || 1) * (H - m.t - m.b);
  let g = '';
  for (const t of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(t)}" y2="${sy(t)}" class="${t === 0 ? 's-axis' : 's-grid'}"/><text x="${m.l - 6}" y="${sy(t) + 4}" text-anchor="end" font-size="11" class="t-muted">${esc(axisMoney(t))}</text>`;
  const n = narrow ? 3 : 4; const shown = new Set(Array.from({ length: n + 1 }, (_, j) => Math.round(j * (pts.length - 1) / n)));
  pts.forEach((q, i) => { if (shown.has(i) && q.tick) g += `<text x="${sx(q.x)}" y="${H - m.b + 16}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}" font-size="11" class="t-muted">${esc(q.tick)}</text>`; });
  if (o.xTitle) g += `<text x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle" font-size="11" class="t-muted">${esc(o.xTitle)}</text>`;
  if (o.now != null) g += `<line x1="${sx(o.now)}" x2="${sx(o.now)}" y1="${m.t}" y2="${H - m.b}" class="s-gold" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${sx(o.now) + (sx(o.now) > W - 60 ? -5 : 5)}" y="${m.t + 4}" text-anchor="${sx(o.now) > W - 60 ? 'end' : 'start'}" font-size="11" class="t-ink">Now</text>`;
  const path = (k) => pts.map((q, i) => `${i ? 'L' : 'M'}${sx(q.x).toFixed(1)},${sy(q[k]).toFixed(1)}`).join(' ');
  if (hasB) g += `<path d="${path('b')}" fill="none" class="s-before" stroke-width="2"/>`;
  g += `<path d="${path('r')}" fill="none" class="s-after" stroke-width="2.6"/>`;
  for (const q of pts) g += `<circle cx="${sx(q.x).toFixed(1)}" cy="${sy(q.r).toFixed(1)}" r="2.6" class="f-after"/>`;
  let be = null;
  for (let i = 1; i < pts.length; i++) { const p0 = pts[i - 1]; const p1 = pts[i]; if ((p0.r < 0) !== (p1.r < 0)) { be = p0.x + (0 - p0.r) * (p1.x - p0.x) / (p1.r - p0.r); break; } }
  if (be != null && o.fmtX) { const right = sx(be) + 110 <= W - m.r; g += `<circle cx="${sx(be)}" cy="${sy(0)}" r="4.5" class="f-after"/><text x="${right ? sx(be) + 8 : sx(be) - 8}" y="${sy(0) + 15}" text-anchor="${right ? 'start' : 'end'}" font-size="11" class="t-ink">Breakeven ${esc(o.fmtX(be))}</text>`; }
  const desc = `Value ${hasB ? 'before and after' : 'after'} risks${o.xTitle ? ` against ${o.xTitle.toLowerCase()}` : ''}: ${pts.map((q) => `${q.move || q.tick}: ${money(q.r)}`).join('; ')}.`;
  return `<div class="legend">${hasB ? '<span><i class="sw sw-before"></i>Before risks</span>' : ''}<span><i class="sw sw-after"></i>After risks</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(desc)}">${g}</svg>`;
}

const liveInputs = (a) => SENS_INPUTS.filter((s) => !(s.skip && s.skip(state.dep)) && Math.abs(s.now(a)) > 1e-9);   // a zero input cannot move
// An input's figure when it is scaled by f.
const inputAt = (s, f, a) => (s.k === 'price' || s.k === 'drate' ? s.now(a) * f : s.now({ derived: depositDerived(state.dep, { ...state.whatIf, scale: { [s.k]: f } }) }));
const fmtRaw = (v) => (v == null ? '–' : num1(v, dpFor(v)));
function inputSens(move) {
  const a = assetById('custom'); const base = wiValue({});
  const rows = liveInputs(a).map((s) => {
    const vLo = wiValue({ scale: { [s.k]: 1 - move } }); const vHi = wiValue({ scale: { [s.k]: 1 + move } });
    return { k: s.k, item: `in:${s.k}`, label: s.label, unit: s.unit, now: s.now(a), lo: inputAt(s, 1 - move, a), hi: inputAt(s, 1 + move, a), vLo, vHi, dlo: vLo - base, dhi: vHi - base };
  });
  const vDelay = wiValue({ delay: 1 });
  rows.push({ k: 'delay', item: 'wi:delay', label: 'Years to construction (+1)', unit: 'years', now: a.derived.decision, lo: null, hi: a.derived.decision + 1, vLo: null, vHi: vDelay, dlo: null, dhi: vDelay - base, one: true });
  for (const r of rows) r.mag = Math.max(Math.abs(r.dlo || 0), Math.abs(r.dhi));

function sensItems() {

    ...liveInputs(a).map((s) => ({ id: `in:${s.k}`, group: 'Inputs', label: s.label })),

function sensSeries(id) {
  const [kind, k] = id.split(':'); const a = assetById('custom');
  if (kind === 'wi') {
    const w = WHATIF.find((x) => x.k === k); const pts = [];
    for (let i = 0; w.min + i * w.step <= w.max + 1e-9; i++) {
      const v = +(w.min + i * w.step).toFixed(4); const wi = { ...state.whatIf, [k]: v }; const f = wiFigure(k, wi);
      pts.push({ x: v, tick: f.end, move: wiText(w, v), raw: f.fig, r: valueWith(wi), b: valueWith(wi, true) });
    }
    return { label: w.label, now: state.whatIf[k] || 0, xTitle: w.label, fmtX: (x) => signed(Math.round(x * 10) / 10, w.unit), pts };
  }
  if (kind === 'in') {
    const s = SENS_INPUTS.find((x) => x.k === k);
    const pts = [-50, -40, -30, -20, -10, 0, 10, 20, 30, 40, 50].map((p) => { const f = 1 + p / 100; const raw = fmtRaw(inputAt(s, f, a));
      return { x: p, tick: raw, move: p ? signed(p, '%') : 'Now', raw: `${raw} ${s.unit}`, r: wiValue({ scale: { [k]: f } }), b: wiValue({ scale: { [k]: f } }, true) }; });
    return { label: s.label, now: 0, xTitle: `${s.label} (${s.unit})`, fmtX: (x) => signed(Math.round(x), '%'), pts };
  }
  const d = DIALS.find((x) => x.id === k); const pts = [];

  }
  return { label: d.name, now: levelNum(state.levels.custom[k]), xTitle: `${d.name} setting`, pts };
}

function undoLoad() {
  const u = state.undo; if (!u) return;

function rebuildCustom() {
  const old = assetById('custom');

  for (const d of DIALS) { const v = o.levels && o.levels[d.id]; if (LEVELS.includes(v) || (typeof v === 'number' && v >= 0 && v <= 2)) state.levels.custom[d.id] = v; }
  for (const w of WHATIF) { const v = Number(o.whatIf && o.whatIf[w.k]); if (isFinite(v) && v >= w.min && v <= w.max) state.whatIf[w.k] = v; }
  if (LITHIUM_DECKS[o.deck]) state.deckBy.spodumene = o.deck;

  if (['risk', 'base'].includes(o.tableMode)) state.tableMode = o.tableMode;

/* ---------- Kept helpers: value ladder (used by the checks), charts, cash-flow table ---------- */
function valueLadder(asset, an) {
  const b = an.base; const prod = b.years.filter((y) => !y.release && y.ore > 0);
  const K = COMMODITY[commodityOf(asset)]; const pr = asset.processing; const ref = DECKS[commodityOf(asset)].spot.flat;
  const contained = sum(prod, (y) => K.containedRef(y.milled, y.grade));
  const recovered = sum(prod, (y) => K.containedRef(y.milled, y.grade) * y.recovery);
  const payable = sum(prod, (y) => K.refUnits(y.oz, pr));
  const L = {
    ref, contained, recovered, payable,
    inSitu: contained * ref,
    metLoss: -(contained - recovered) * ref,
    payLoss: -(recovered - payable) * ref,
    revenue: sum(b.years, (y) => y.revenue),
    byproduct: sum(b.years, (y) => y.byproduct || 0),
    logistics: -sum(b.years, (y) => y.logistics || 0),
    other: -sum(b.years, (y) => y.other || 0),
    freight: -sum(b.years, (y) => y.freight || 0),
    stream: -sum(b.years, (y) => y.stream),
    royalties: -sum(b.years, (y) => y.royalties),
    site: -sum(b.years, (y) => y.site),
    overhead: -sum(b.years, (y) => y.corporate + y.exploration),
    capex: -sum(b.years, (y) => y.capex),
    closure: -sum(b.years, (y) => y.closure),
    tax: -sum(b.years, (y) => y.tax),
    wc: -sum(b.years, (y) => y.dWC),
    cash: sum(b.years, (y) => y.fcf),
    npv: b.npv, attr: b.npvAttr, risk: an.risk.npvAttr
  };
  const realisation = pr.realisation != null ? pr.realisation : 1;
  L.realLoss = realisation > 0 ? L.revenue - L.revenue / realisation : 0;   // what selling below the benchmark costs
  L.deckGap = L.revenue - L.realLoss - payable * ref;
  L.discount = L.npv - L.cash;
  L.partners = L.attr - L.npv;
  L.dials = L.risk - L.attr;
  return L;
}

function tornadoSVG(T, width, opts = {}) {
  const W = Math.max(300, width); const narrow = W < 520;
  const labelW = opts.labelW || (narrow ? 134 : 176); const rowH = 30; const barH = 14; const top = 6; const axisH = 22;
  const H = top + T.cases.length * rowH + axisH;
  const max = Math.max(1, ...T.cases.map((c) => c.mag)) * (narrow ? 1.7 : 1.45);
  const x0 = labelW + 6; const x1 = W - 4; const mid = (x0 + x1) / 2;
  const sx = (d) => mid + d / max * (x1 - x0) / 2;
  const short = (s) => narrow ? s.replace('US$', '') : s;
  let g = `<line x1="${mid}" x2="${mid}" y1="${top}" y2="${top + T.cases.length * rowH}" class="s-axis" stroke-width="1.5"/>`;
  g += `<text x="${mid}" y="${H - 6}" text-anchor="middle" font-size="11" class="t-muted">Base ${esc(short(money(T.base)))}</text>`;
  T.cases.forEach((c, i) => {
    const yMid = top + i * rowH + rowH / 2; const yb = yMid - barH / 2;
    g += `<text x="0" y="${yMid + 4}" font-size="12.5" class="t-ink">${esc(c.label)}</text>`;
    for (const d of [c.dlo, c.dhi]) {
      if (d == null) continue;
      const xa = Math.min(sx(0), sx(d)); const w = Math.max(1.5, Math.abs(sx(d) - sx(0)));
      g += `<rect x="${xa}" y="${yb}" width="${w}" height="${barH}" rx="2" class="${d < 0 ? 'f-loss' : 'f-gain'}"/>`;
      g += `<text x="${d < 0 ? xa - 4 : xa + w + 4}" y="${yMid + 4}" text-anchor="${d < 0 ? 'end' : 'start'}" font-size="11.5" class="t-ink">${esc(short(money(d, { plus: true })))}</text>`;
    }
  });
  const desc = 'Change in owner’s NPV from one input at a time: ' + T.cases.map((c) => `${c.label}: ${c.dlo != null ? money(c.dlo, { plus: true }) : ''}${c.dlo != null && c.dhi != null ? ' / ' : ''}${c.dhi != null ? money(c.dhi, { plus: true }) : ''}`).join('; ') + '.';
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(desc)}">${g}</svg>`;
}

function axisMoney(v) {
  if (Math.abs(v) < 1) return '$0';
  const m = v / 1e6; const a = Math.abs(m);
  const s = a >= 1000 ? (a / 1000).toFixed(1) + 'B' : (a >= 10 ? Math.round(a) : a.toFixed(1)) + 'M';
  return (m < 0 ? MINUS : '') + '$' + s;
}

function niceTicks(lo, hi, n) {
  const span = hi - lo; if (!(span > 0)) return [lo];
  const raw = span / n; const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.abs(v) < 1e-9 ? 0 : v);
  return out;
}

function cashTable(a, r) {
  const ys = r.years;
  const cols = ys.map((y) => `<th scope="col">${y.year}${y.release ? '<br><span class="muted">WC release</span>' : ''}</th>`).join('');

      ${row('EBITDA', flow('ebitda'), 'strong', tot('ebitda'))}
      ${row('Capex', neg('capex'), '', tot('capex', -1))}
      ${row('Tax depreciation (not cash)', flow('depreciation'), 'muted', tot('depreciation'))}
      ${row('Tax', neg('tax'), '', tot('tax', -1))}
      ${row('Change in working capital', neg('dWC'), '', tot('dWC', -1))}
      ${row('Closure', neg('closure'), '', tot('closure', -1))}
      ${row('Free cash flow (100%)', flow('fcf'), 'strong sep', tot('fcf'))}
      ${row('Owner’s share', (y) => pct(y.ownerShare, 1))}
      ${row(`Discount factor at ${pct(r.rate, 2)}`, (y) => y.df.toFixed(4))}

}

    add('Funding takes value from deposits and none from operating mines', fH < fL && Math.abs(tH - tL) < 1, `Your project: High ${money(fH)} vs Low ${money(fL)}; Tongon unchanged (${money(tH)})`);
    const low = { ...ctlC, enabled: new Set(), flatPrice: 500 };
    const withFlex = runModel(C, low); const noFlex = runModel(C, { ...low, flex: false });
    add('A mine that loses cash closes rather than mining at a loss', withFlex.npvAttr >= noFlex.npvAttr && !!withFlex.flex,
      `At US$500/t: ${money(withFlex.npvAttr)} with the option to close (${withFlex.flex ? 'closes ' + withFlex.flex.closedFrom : 'no stop'}), ${money(noFlex.npvAttr)} without`);
    add('After risks ≤ before risks', anC.risk.npvAttr <= anC.base.npvAttr + 1, `${money(anC.risk.npvAttr)} ≤ ${money(anC.base.npvAttr)}`);
    const pc = sensSeries('in:price').pts; const mono = pc.every((q, i) => i === 0 || (q.r >= pc[i - 1].r - 1 && q.b >= pc[i - 1].b - 1));
    add('Value rises with the price', mono, `${money(pc[0].r)} at −50% to ${money(pc[pc.length - 1].r)} at +50%`);
    const ds = [0, 1, 2, 3].map((k) => wiValue({ delay: k }));
    add('Each year of delay costs value', ds.every((x, i) => i === 0 || x <= ds[i - 1] + 1), ds.map((x) => money(x)).join(' → '));
    const v0 = wiValue({});
    const dirs = [['capex +20% lowers it', wiValue({ capex: 20 }) < v0], ['operating cost +20% lowers it', wiValue({ opex: 20 }) < v0], ['recovery +5 points raises it', wiValue({ recovery: 5 }) > v0],
      ['grade +10% raises it', wiValue({ grade: 10 }) > v0], ['discount rate +2 points lowers it', wiValue({ rate: 2 }) < v0]];
    add('Each scenario slider moves value the right way', dirs.every((x) => x[1]), dirs.map(([n, ok]) => `${n}: ${ok ? 'yes' : 'NO'}`).join('; '));
    const C0 = depositAsset(state.dep, 'custom', { wi: { ...state.whatIf, price: 0 } }); const ctl0 = ctlFor(C0);
    const viaTweak = runModel(C0, { ...ctl0, deck: baseDeckFor(C0), rate: curRateFor(C0), enabled: ALL_DIALS(), tweak: { gold: 1.1 } }).npvAttr;
    const viaWhatIf = valueWith({ ...state.whatIf, price: 10 });
    add('The price scenario matches the engine’s price lever', Math.abs(viaTweak - viaWhatIf) < 1, `+10%: ${money(viaWhatIf)} vs ${money(viaTweak)}`);
    const lv0 = { ...state.levels.custom }; const unsteady = [];
    for (const dl of DIALS) {
      const vals = [0, 0.5, 1, 1.5, 2].map((x) => runModel(C, { ...ctlC, levels: { ...lv0, [dl.id]: x }, enabled: ALL_DIALS() }).npvAttr);
      if (vals.some((v, i) => i > 0 && v > vals[i - 1] + 1)) unsteady.push(dl.short);
    }
    add('Each risk takes more value as its slider moves from Low to High', unsteady.length === 0, unsteady.length ? `Not steady: ${unsteady.join(', ')}` : '10 risks, 5 steps each');
    const allAt = (lv) => runModel(C, { ...ctlC, levels: Object.fromEntries(DIALS.map((dl) => [dl.id, lv])), enabled: ALL_DIALS() }).npvAttr;
    add('A whole step gives exactly the stated setting', allAt('M') === allAt(1) && allAt('H') === allAt(2), `All at Medium: ${money(allAt(1))}; all at High: ${money(allAt(2))}`);
    const half = fxAt(DIALS.find((dl) => dl.id === 'capex'), 1.5); const halfF = fxAt(DIALS.find((dl) => dl.id === 'fiscal'), 1.5);
    add('A step between settings blends them in a straight line', Math.abs(half.capex - 0.25) < 1e-12 && Math.abs(half.depositDelay - 0.75) < 1e-12 && Math.abs(halfF.royaltyProb - 0.375) < 1e-12 && halfF.royaltyPts === 2,
      `Capex halfway from Medium to High: +${pct(half.capex, 1)}, ${half.depositDelay * 12} months late; fiscal: ${pct(halfF.royaltyProb, 1)} chance of +${halfF.royaltyPts} pts`);
    const IS = inputSens(0.1); const more = new Set(['price', 'recovery', 'grade', 'byproduct']);   // more of these is worth more
    const wrong = IS.rows.filter((r) => !r.one && !['tonnes', 'rate'].includes(r.k) && (more.has(r.k) ? r.vHi < r.vLo - 1 : r.vHi > r.vLo + 1)).map((r) => r.label);
    add('Every input moves value the right way', wrong.length === 0, wrong.length ? `Wrong way: ${wrong.join(', ')}` : `${IS.rows.length} inputs, ±10% each; biggest: ${IS.rows[0].label}`);
    const capT = typical('capex_per_annual_t_ore');
    add('Typical capex excludes the existing-plant case and is escalated to the valuation date', !capT.points.some((p) => p[0] === 'S11n') && capT.points.some((p) => /CPI/.test(p[3])), `Median US$${capT.median.toFixed(1)} per t/yr across ${capT.n} own-plant studies`);
  }
  group = 'Risk amounts, value ladder and robustness';
  for (const a of ASSETS) {
    const an = ANALYSIS[a.id]; if (an.pending) continue;
    const name = a.id === 'custom' ? `Your project (${a.name})` : a.name;
    const s = sum(an.bridge, (x) => x.delta); const d = an.risk.npvAttr - an.base.npvAttr;
    add(`${name}: risk amounts add up to the gap between before and after risks`, Math.abs(s - d) < 0.1e6, `${money(s)} vs ${money(d)} (diff ${(Math.abs(s - d) / 1e6).toFixed(6)}M)`);
    const L = valueLadder(a, an);
    const g1 = L.inSitu + L.metLoss + L.payLoss + L.deckGap + L.realLoss - L.revenue;
    const g2 = L.revenue + L.byproduct + L.stream + L.royalties + L.site + L.overhead + L.logistics + L.freight + L.other + L.capex + L.closure + L.tax + L.wc - L.cash;
    const g3 = L.cash + L.discount + L.partners + L.dials - L.risk;
    const worstL = Math.max(Math.abs(g1), Math.abs(g2), Math.abs(g3));
    add(`${name}: value ladder adds up from in-situ value to value after risks`, worstL < 1e3, `${money(L.inSitu)} in-situ → ${money(L.revenue)} revenue → ${money(L.cash)} cash flow → ${money(L.risk)}; largest gap US$${worstL.toFixed(2)}`);
  }
  // No NaN and no negative production across decks, risk settings and plan options
  let runs = 0; let bad = [];
  for (const a of ASSETS) {
    const sets = { defaults: state.levels[a.id], allL: {}, allM: {}, allH: {} };
    for (const d of DIALS) { sets.allL[d.id] = 'L'; sets.allM[d.id] = 'M'; sets.allH[d.id] = 'H'; }
    const exts = a.schedule.kind === 'fixed' ? [0, 1] : [0, 2, a.schedule.extension.maxYears];
    for (const deck of Object.values(PRICE_DECKS)) for (const [nm, lv] of Object.entries(sets)) for (const ext of exts) for (const en of [new Set(), ALL_DIALS()]) {
      const res = runModel(a, { deck, rate: 0.05, levels: lv, enabled: en, ext }); runs++;
      const nums = [res.npv, res.npvAttr, res.prod1, res.lomOz, res.life].concat(res.prod1 > 0 ? [res.aisc1] : []);   // a mine closed before it produces has no AISC
      for (const y of res.years) nums.push(y.oz, y.fcf, y.tax, y.revenue, y.site, y.capex, y.df, y.milled, y.ore);
      if (nums.some((x) => !isFinite(x))) bad.push(`${a.name}/${deck.id}/${nm}/ext${ext}: non-finite value`);
      if (res.years.some((y) => y.oz < 0 || y.ore < 0 || y.milled < 0)) bad.push(`${a.name}/${deck.id}/${nm}/ext${ext}: negative production`);
    }
  }
  add('No NaN and no negative production', bad.length === 0, `${runs} model runs${bad.length ? '; ' + bad.slice(0, 3).join('; ') : ''}`);
  // Live update: a risk or what-if change redraws the value and the charts
  const snap = () => $('#valuebar').textContent + '|' + $('#tinker').textContent;
  renderAll(true); const before = snap();
  const oldLv = state.levels.custom.recovery; state.levels.custom.recovery = oldLv === 'H' ? 'L' : 'H';
  renderAll(true); const afterLv = snap();
  state.levels.custom.recovery = oldLv; renderAll(true);
  add('A risk change updates the value and the sensitivities', before !== afterLv && snap() === before, 'Recovery risk moved and moved back');
  const oldP = state.whatIf.price; state.whatIf.price = oldP + 10; rebuildCustom(); renderAll(true); const afterP = snap();
  state.whatIf.price = oldP; rebuildCustom(); renderAll(true);
  add('A scenario move updates the value and the sensitivities', before !== afterP && snap() === before, 'Price +10% and back');
  const overflow = document.documentElement.scrollWidth - document.documentElement.clientWidth;
  add('No horizontal page scroll at this width', overflow <= 1, `viewport ${window.innerWidth}px, overflow ${overflow}px.${window.innerWidth > 420 ? ' Narrow the window to 375px to test the phone layout.' : ''}`);
  return out;
}

function checksHTML() {
  const res = runChecks(); const pass = res.filter((r) => r.ok).length;
  const log = res.map((r) => `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}  →  ${r.detail}`).join('\n');
  try { console.log('Mining Risk Explorer checks\n' + log); } catch (e) { /* console unavailable */ }
  const groups = [...new Set(res.map((r) => r.group))];
  return `<p><b>${pass} of ${res.length} checks pass.</b> The two gold mines, Tongon and Tropicana, are test cases only: the engine must rebuild their spreadsheet and published figures before it values a spodumene project, and they play no part in your valuation. Spreadsheet cases must match to US$0.01M. The brief’s targets allow 1% of the target or half the last digit it is stated to, whichever is larger.</p>
    ${groups.map((g) => `<h3>${esc(g)}</h3><ul class="checks-list">${res.filter((r) => r.group === g).map((r) => `<li><span class="res ${r.ok ? 'res-pass' : 'res-fail'}">${r.ok ? 'PASS' : 'FAIL'}</span><span><b>${esc(r.name)}</b><br><span class="muted">${esc(r.detail)}</span></span></li>`).join('')}</ul>`).join('')}
    <details class="more"><summary>Plain-text log</summary><pre class="log">${esc(log)}</pre></details>`;
}

/* =====================================================================
   7. WIRING
   ===================================================================== */
// Keep the sticky bar's height in a CSS variable, so a focused field never hides behind it.
const syncBar = () => document.documentElement.style.setProperty('--bar-h', $('#topbar').offsetHeight + 'px');

function renderAll(silent) {
  const active = document.activeElement && document.activeElement.id ? document.activeElement.id : null;
  const a = assetById('custom'); UCTX = 'spodumene';
  ANALYSIS.custom = a.derived.resMt > 0 ? analyse(a, ctlFor(a)) : { pending: true };
  if (!ANALYSIS.custom.pending) ANALYSIS.custom.be = breakevenPrice(a, ctlFor(a));
  inputsValue = null;
  hidePop(); INFO.clear();
  renderTop(); renderInputs(); renderTinker(); drawCharts();
  syncBar(); saveSettings();
  if (active && !silent) { const el = document.getElementById(active); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
}

// The "i" popover sits right after the row it explains, so the keyboard reaches its buttons next.
let popBtn = null;
function showPop(btn) {
  const pop = $('#pop'); pop.innerHTML = INFO.get(btn.dataset.info) || '';
  const host = btn.closest('.c-f, .c-sl, .c-kpi, .c-ph') || btn.parentElement;
  host.after(pop); pop.hidden = false;
  const vw = document.documentElement.clientWidth; const w = vw < 480 ? vw - 32 : 320;
  pop.style.width = w + 'px';
  const r = btn.getBoundingClientRect(); const pr = (pop.offsetParent || document.body).getBoundingClientRect();
  const left = Math.max(16, Math.min(r.left - 8, vw - w - 16));
  pop.style.left = (left - pr.left) + 'px'; pop.style.top = (r.bottom + 6 - pr.top) + 'px';
  if (popBtn) popBtn.setAttribute('aria-expanded', 'false');
  popBtn = btn; btn.setAttribute('aria-expanded', 'true');
}
function hidePop() {
  const pop = $('#pop'); if (!pop) return;
  if (popBtn) popBtn.setAttribute('aria-expanded', 'false');
  popBtn = null; pop.hidden = true;
  if (pop.parentElement !== document.body) document.body.appendChild(pop);   // keep it out of the panels that get redrawn
}

// While a what-if slider moves, update the value bar only; the page redraws when it settles.
function quickUpdate() {
  const i = ASSETS.findIndex((x) => x.id === 'custom'); ASSETS[i] = depositAsset(state.dep, 'custom', { wi: state.whatIf });
  const a = ASSETS[i]; if (!(a.derived.resMt > 0)) return;
  const ctl = ctlFor(a);
  setKpis(a, runModel(a, { ...ctl, enabled: ALL_DIALS() }), runModel(a, { ...ctl, enabled: new Set() }), breakevenPrice(a, ctl));
  for (const w of WHATIF) { const el = document.getElementById(`wi-${w.k}-f`); if (el) el.textContent = wiFigure(w.k, state.whatIf, a).fig; }
  syncBar();
}

// Inputs apply as you type (after a short pause), and at once on Enter or when you leave the field.
function applyField(t) {
  const ds = t.dataset;
  if (ds.dep) { onDepInput(t); return; }
  if (ds.depDeck) { state.deckBy.spodumene = t.value; renderAll(); return; }
  if (ds.depRate) { const v = Number(t.value); if (t.value !== '' && isFinite(v)) { state.rateBy.spodumene = Math.max(0, Math.min(0.2, v / 100)); renderAll(); } return; }
  if (ds.depLt) { const v = t.value === '' ? null : Number(t.value); if (v == null || (isFinite(v) && v > 0)) { state.lt.spodumene = v; renderAll(); } }
}
let typeTimer = null;
document.addEventListener('input', (e) => {
  const t = e.target; const ds = t.dataset || {};
  if (ds.role === 'level-slider') {   // the figure follows the thumb; the model reruns when it settles
    const x = Number(t.value); const f = riskFigure(DIALS.find((d) => d.id === ds.dial), x, assetById('custom'));
    t.classList.remove('L', 'M', 'H'); t.classList.add(LEVELS[Math.round(x)]); t.setAttribute('aria-valuetext', `${levelName(x)}: ${f.fig} ${f.note}`);
    const b = document.getElementById(`rk-${ds.dial}-f`); if (b) b.textContent = f.fig;
    const n = document.getElementById(`rk-${ds.dial}-n`); if (n) n.textContent = f.note;
  } else if (ds.role === 'wi') {
    const w = WHATIF.find((x) => x.k === ds.k); const v = Number(t.value); state.whatIf[ds.k] = v;
    const n = document.getElementById(`wi-${ds.k}-n`); if (n) n.textContent = v ? wiText(w, v) : '';
    quickUpdate(); t.setAttribute('aria-valuetext', `${wiText(w, v)}: ${wiFigure(w.k, state.whatIf, assetById('custom')).fig}`);
  } else if (t.tagName === 'INPUT' && (ds.dep || ds.depRate || ds.depLt)) {
    clearTimeout(typeTimer); typeTimer = setTimeout(() => applyField(t), 450);
  }
});
document.addEventListener('change', (e) => {
  const t = e.target; const ds = t.dataset || {}; const role = ds.role;
  if (role === 'level-slider') { state.levels.custom[ds.dial] = Number(t.value); renderAll(); return; }
  if (role === 'sheet-view') { openSensSheet(t.value); return; }
  if (role === 'sheet-move') { openSensSheet('all', Number(t.value)); return; }
  if (role === 'sheet-item') { openSensSheet('one', state.sheet.move, t.value); return; }
  if (role === 'wi') { state.whatIf[ds.k] = Number(t.value); rebuildCustom(); renderAll(); return; }
  if (role === 'tablemode') { state.tableMode = t.value; renderAll(); return; }
  if (role === 'preset') { if (t.value) loadPreset(t.value); return; }
  if (ds.dep || ds.depDeck || ds.depRate || ds.depLt) { clearTimeout(typeTimer); applyField(t); }
});
document.addEventListener('toggle', (e) => {
  const d = e.target; if (!d.dataset || !d.dataset.openId) return;
  if (d.open) state.open.add(d.dataset.openId); else state.open.delete(d.dataset.openId);
}, true);
document.addEventListener('click', (e) => {
  const el = e.target.closest('button, a');
  if (!$('#pop').hidden && !e.target.closest('#pop') && el !== popBtn) hidePop();
  if (!el) return;
  if (el.dataset.info) { if (popBtn === el) hidePop(); else showPop(el); return; }
  if (el.hasAttribute('data-wi-reset')) { for (const k of Object.keys(state.whatIf)) state.whatIf[k] = 0; rebuildCustom(); renderAll(true); return; }
  if (el.hasAttribute('data-undo-load')) { undoLoad(); return; }
  if (el.hasAttribute('data-sens-sheet')) { openSensSheet(); return; }
  if (el.dataset.export) { exportFile(el.dataset.export); return; }
  if (el.dataset.sensItem) { openSensSheet('one', state.sheet.move, el.dataset.sensItem); return; }
  if (el.dataset.depTyp) { state.undo = null; hideToast(); setPath(state.dep, el.dataset.depTyp, null); rebuildCustom(); renderAll(true); return; }
  if (el.dataset.depSrc) { hidePop(); evidenceSheet(el.dataset.depSrc); return; }
  if (el.hasAttribute('data-reset-all')) { const a = assetById('custom'); for (const d of DIALS) state.levels.custom[d.id] = a.dialDefaults[d.id].level; renderAll(true); return; }
  if (el.dataset.open === 'data') { openSheet('Data', dataHTML()); return; }
  if (el.dataset.open === 'checks') { openSheet('Checks', checksHTML()); return; }
  if (el.id === 'sheet-close') closeSheet();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && popBtn) { const b = popBtn; hidePop(); b.focus(); }
});
// A popover opened from the sticky bar would drift as the page scrolls, so it closes.
window.addEventListener('scroll', () => { if (popBtn && popBtn.closest('#topbar')) hidePop(); }, { passive: true });
// Phone toolbars resize the window as the page scrolls: only a change of width redraws the charts.
let resizeTimer = null; let lastWidth = window.innerWidth;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { syncBar(); if (window.innerWidth === lastWidth) return; lastWidth = window.innerWidth; hidePop(); drawCharts(); drawSheetChart(); }, 120);
});
$('#sheet').addEventListener('click', (e) => { if (e.target === $('#sheet')) closeSheet(); });

(function start() {
  initDeposits();
  loadSettings(); rebuildCustom();
  renderAll(true);
  initExport();
})();
</script>
