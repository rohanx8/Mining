<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mining Risk Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Price a new spodumene mine: enter what you know, typical values from published studies fill the rest, standard risk settings take their share, and sliders show what moves the value.">
<style>
:root {
  /* Layout: an instrument panel. A sticky control bar holds the shared price deck and discount rate; one job per screen; tabs sit at the bottom on phones and in the bar on wide screens. */
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #eaeef2;
  --ink: #111519;
  --ink-2: #434d58;
  --muted: #66707b;
  --line: #d9dfe5;
  --line-strong: #b6c0ca;
  --accent: #8a5d00;        /* assay gold, safe for text */
  --accent-fill: #d99a14;   /* gold price line, tab indicator */
  --accent-soft: #f6ebcf;
  --gain: #2a78d6;
  --loss: #e34948;
  --total: #5d6874;
  --aisc: #2a78d6;
  --riskcost: #eb6834;
  --ok-ink: #0a6b0a;  --ok-bg: #e2f2e2;
  --der-ink: #1d5fae; --der-bg: #e1ecfa;
  --asm-ink: #7f4c00; --asm-bg: #fbecca;
  --bad-ink: #b3261e; --bad-bg: #fbe3e1;
  --focus: #2a78d6;
  --shadow: 0 1px 2px rgba(17, 21, 25, .06), 0 6px 18px rgba(17, 21, 25, .06);
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1114; --surface: #161a1f; --surface-2: #1f252b; --ink: #eef1f4; --ink-2: #b9c1ca; --muted: #8d97a1;
    --line: #2a3138; --line-strong: #3d4650; --accent: #eabb4b; --accent-fill: #d9a12a; --accent-soft: #3a2f17;
    --gain: #3987e5; --loss: #e66767; --total: #8f9aa6; --aisc: #3987e5; --riskcost: #d95926;
    --ok-ink: #6fd56f; --ok-bg: #15301a; --der-ink: #8fbcf2; --der-bg: #16263a; --asm-ink: #f2c564; --asm-bg: #362912;
    --bad-ink: #ff9e95; --bad-bg: #3b1a18; --focus: #6aa8f0; --shadow: 0 1px 2px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1114; --surface: #161a1f; --surface-2: #1f252b; --ink: #eef1f4; --ink-2: #b9c1ca; --muted: #8d97a1;
  --line: #2a3138; --line-strong: #3d4650; --accent: #eabb4b; --accent-fill: #d9a12a; --accent-soft: #3a2f17;
  --gain: #3987e5; --loss: #e66767; --total: #8f9aa6; --aisc: #3987e5; --riskcost: #d95926;
  --ok-ink: #6fd56f; --ok-bg: #15301a; --der-ink: #8fbcf2; --der-bg: #16263a; --asm-ink: #f2c564; --asm-bg: #362912;
  --bad-ink: #ff9e95; --bad-bg: #3b1a18; --focus: #6aa8f0; --shadow: 0 1px 2px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--surface);
}
a { color: var(--der-ink); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
h1 { font-size: 1.55rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-num); font-size: .92em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap {
  max-width: 1140px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 750; font-size: 15.5px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { flex: none; }
.brand small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); letter-spacing: 0; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-left: auto; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl-label { font-size: 12px; font-weight: 650; color: var(--muted); }

/* Segmented controls (radio groups) */
fieldset.seg { border: 0; margin: 0; padding: 2px; min-width: 0; display: inline-flex; gap: 2px; background: var(--surface-2); border-radius: 9px; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.seg label {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 34px; padding: 4px 11px; border-radius: 7px; cursor: pointer;
  font-size: 13px; font-weight: 650; color: var(--ink-2); line-height: 1.15; text-align: center;
}
.seg label .def { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.seg input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-strong), 0 1px 2px rgba(0,0,0,.06); }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 1px; }
.seg input:disabled + label { cursor: not-allowed; opacity: .5; }
.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 9px; padding: 2px; }
.stepper button { width: 34px; height: 34px; border: 0; background: transparent; border-radius: 7px; font-size: 18px; font-weight: 600; cursor: pointer; color: var(--ink); }
.stepper button:hover { background: var(--surface); }
.stepper output { min-width: 54px; text-align: center; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .ctl { flex-wrap: wrap; row-gap: 4px; min-width: 0; max-width: 100%; }
  #deck-seg { flex-wrap: wrap; max-width: 100%; }
  #deck-seg label { padding: 4px 8px; font-size: 12.5px; }
}

/* Tabs: bottom bar on phones, inline in the top bar on wide screens */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabs a {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 4px 9px; font-size: 12px; font-weight: 650; color: var(--muted); text-decoration: none;
}
.tabs a svg { width: 20px; height: 20px; }
.tabs a[aria-current="page"] { color: var(--ink); }
.tabs a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent-fill); }
main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
  .tabs { position: static; display: flex; gap: 2px; border: 0; padding: 0; background: transparent; order: 2; }
  .tabs a { flex-direction: row; gap: 7px; padding: 8px 12px; border-radius: 8px; font-size: 13.5px; }
  .tabs a svg { width: 17px; height: 17px; }
  .tabs a:hover { background: var(--surface-2); }
  .tabs a[aria-current="page"] { background: var(--surface-2); }
  .tabs a[aria-current="page"]::before { top: auto; bottom: -11px; left: 12px; right: 12px; border-radius: 3px 3px 0 0; }
  .brand { order: 1; }
  .controls { order: 3; }
  main { padding-bottom: 32px; }
}

/* ---------- Screens ---------- */
.screen { padding-block: 20px 8px; display: grid; gap: 22px; }
.screen-head { display: grid; gap: 6px; }
.screen-head p { color: var(--ink-2); max-width: 68ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 12px; }
.panel-head p { color: var(--muted); font-size: 13px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px;
  padding: 6px 13px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface);
  font-size: 13.5px; font-weight: 650; cursor: pointer; color: var(--ink); text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--der-ink); padding-inline: 6px; }
.btn-quiet:hover { background: var(--surface-2); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--der-ink); font-weight: 650; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: inherit; }

/* Pills and flags */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.flag-sourced { background: var(--ok-bg); color: var(--ok-ink); }
.flag-derived { background: var(--der-bg); color: var(--der-ink); }
.flag-assumption { background: var(--asm-bg); color: var(--asm-ink); }
.pill-pending { background: var(--asm-bg); color: var(--asm-ink); }
.pill-level-H { background: var(--bad-bg); color: var(--bad-ink); }
.pill-level-M { background: var(--asm-bg); color: var(--asm-ink); }
.pill-level-L { background: var(--ok-bg); color: var(--ok-ink); }

/* ---------- Pick ---------- */
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.asset-card {
  display: grid; gap: 12px; align-content: start; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
  cursor: pointer; box-shadow: var(--shadow); color: var(--ink);
}
.asset-card:hover { border-color: var(--line-strong); }
.asset-card[aria-current="true"] { border-color: var(--accent-fill); box-shadow: 0 0 0 1px var(--accent-fill), var(--shadow); }
.asset-card span { display: block; }
.ac-top { display: flex !important; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ac-name { font-size: 1.25rem; font-weight: 750; letter-spacing: -.015em; }
.ac-meta { font-size: 13px; color: var(--ink-2); }
.ac-values { display: grid !important; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.ac-values .lbl { font-size: 11.5px; font-weight: 650; color: var(--muted); }
.ac-values .val { font-size: 1.2rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.ac-values .arrow { color: var(--muted); padding-bottom: 4px; }
.ac-change { font-size: 13px; font-weight: 650; }
.ac-foot { display: flex !important; flex-wrap: wrap; gap: 6px; }
.neg { color: var(--bad-ink); }
.pos { color: var(--ok-ink); }

/* ---------- Value ---------- */
.asset-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px 16px; }
.asset-head .meta { color: var(--ink-2); font-size: 13.5px; }
.headline { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 640px) { .headline { grid-template-columns: 1fr auto 1fr; align-items: stretch; } }
.hl-tile {
  display: grid; gap: 4px; align-content: start; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
  cursor: pointer; color: var(--ink);
}
.hl-tile:hover { border-color: var(--line-strong); }
.hl-tile .big { font-size: clamp(1.9rem, 7vw, 2.6rem); font-weight: 780; letter-spacing: -.025em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.hl-tile .sub { font-size: 13px; color: var(--ink-2); }
.hl-tile .trace { font-size: 12px; color: var(--der-ink); font-weight: 650; }
.hl-tile.risk { border-color: var(--line-strong); }
.hl-delta { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 6px; text-align: center; }
.hl-delta .d { font-size: 1.05rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.hl-delta .arrowline { color: var(--muted); font-size: 20px; line-height: 1; }
@media (max-width: 639px) { .hl-delta { flex-direction: row; gap: 8px; justify-content: flex-start; padding: 0 4px; } .hl-delta .arrowline { transform: rotate(90deg); } }
.metrics { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.metric {
  display: grid; gap: 3px; align-content: start; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
  cursor: pointer; color: var(--ink);
}
.metric:hover { border-color: var(--line-strong); }
.metric .k { font-size: 12px; font-weight: 650; color: var(--muted); }
.metric .v { font-size: 1.12rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.metric .s { font-size: 12.5px; color: var(--ink-2); }
.chart { width: 100%; min-width: 0; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.t-ink { fill: var(--ink); }
.t-ink2 { fill: var(--ink-2); }
.t-muted { fill: var(--muted); }
.f-gain { fill: var(--gain); }
.f-loss { fill: var(--loss); }
.f-total { fill: var(--total); }
.f-aisc { fill: var(--aisc); }
.f-risk { fill: var(--riskcost); }
.f-surface { fill: var(--surface); }
.f-final { fill: var(--ink); }
.ladder { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.ladder li { position: relative; display: grid; gap: 1px; padding: 8px 18px 8px 12px; background: var(--surface-2); clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); }
.ladder li:last-child { background: var(--ink); color: var(--surface); }
.ladder li:last-child .k, .ladder li:last-child .p { color: var(--surface); opacity: .85; }
.ladder .k { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.ladder .v { font-size: 1.05rem; font-weight: 780; font-variant-numeric: tabular-nums; }
.ladder .p { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.risk-item .settle { font-size: 13px; color: var(--ink-2); }
.dep-steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.stp { flex: none; display: flex; align-items: center; gap: 7px; padding: 7px 11px 7px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 650; cursor: pointer; }
.stp .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 12px; font-weight: 750; color: var(--ink); }
.stp[aria-current="step"] { border-color: var(--ink); color: var(--ink); }
.stp[aria-current="step"] .n { background: var(--ink); color: var(--surface); }
.fields { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.field { display: grid; gap: 5px; align-content: start; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.flabel { font-size: 13.5px; font-weight: 650; }
.field input, .field select { width: 100%; min-height: 38px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 14px; }
.field input:focus-visible, .field select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.hint { font-size: 12.5px; color: var(--ink-2); }
table.res input, table.res select { width: 100%; min-width: 90px; min-height: 34px; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--ink); font-size: 14px; }
table.res td, table.res th { text-align: left; }
table.res thead th { white-space: normal; }
@media (max-width: 560px) {
  table.res td, table.res th { padding: 6px 5px; }
  table.res input, table.res select { min-width: 62px; padding: 4px 6px; }
}
.derived { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: var(--surface-2); display: grid; gap: 8px; }
.step-nav { margin-top: 14px; }
.ex-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.ex-card { display: grid; gap: 5px; align-content: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); }
.s-grid { stroke: var(--line); }
.s-axis { stroke: var(--line-strong); }
.s-gold { stroke: var(--accent-fill); }
.wf-row { cursor: pointer; }
.wf-row:focus { outline: none; }
.wf-row:focus-visible .wf-hit, .wf-row:hover .wf-hit { fill: var(--surface-2); }
.wf-hit { fill: transparent; }
.risks { display: grid; gap: 10px; }
.risk-item { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.risk-item:first-child { border-top: 0; padding-top: 0; }
.risk-item > :not(.risk-rank) { grid-column: 2; min-width: 0; }
.risk-rank { grid-row: span 5; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 750; font-size: 13.5px; }
.risk-item h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.risk-item .q { font-size: 13.5px; color: var(--ink-2); padding: 8px 10px; background: var(--surface-2); border-radius: 8px; }
.risk-item .q b { color: var(--ink); }
.banner { display: grid; gap: 6px; padding: 14px 16px; border-radius: var(--radius); background: var(--asm-bg); color: var(--ink); border: 1px solid var(--line); }
.banner b { color: var(--asm-ink); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.timeline li:first-child { border-top: 0; }
.timeline .date { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.timeline .src { font-size: 12px; color: var(--muted); }

/* Tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
thead th { font-size: 12px; color: var(--muted); font-weight: 700; background: var(--surface); }
tbody tr:last-child td { border-bottom: 0; }
tr.strong td { font-weight: 750; }
tr.sep td { border-top: 2px solid var(--line-strong); }
td.wrap-cell, th.wrap-cell { white-space: normal; min-width: 150px; text-align: left; }
.cmp th, .cmp td { text-align: left; }
.cmp td.n { text-align: right; }

details.more { border-top: 1px solid var(--line); padding-top: 10px; }
details.more > summary { cursor: pointer; font-weight: 650; color: var(--der-ink); font-size: 13.5px; list-style-position: inside; }
details.more[open] > summary { margin-bottom: 10px; }

/* ---------- Dials ---------- */
.dial-summary {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h, 108px)); z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 8px 14px; box-shadow: var(--shadow);
  margin-bottom: -10px;
}
@media (max-width: 639px) { .dial-summary .vals { font-size: 13.5px; gap: 2px 8px; } .dial-summary .vals b { font-size: 1rem; } }
.dial-summary .vals { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-variant-numeric: tabular-nums; }
.dial-summary .vals b { font-size: 1.1rem; }

/* ---------- Footer & sheet ---------- */

}

}

/* ---------- Simpler layout: one question per tab, Advanced folds, risk sliders ---------- */

.keynums { display: grid; }
.kn { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; width: 100%; padding: 10px 2px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; color: var(--ink); cursor: pointer; }

/* Compare tab */

.cbar-stack .r { background: var(--riskcost); }
/* Value range, value movers */
.v-pay { color: var(--ink); max-width: 66ch; }
.rg { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; }
.rg-h { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.s-before { stroke: var(--total); }

/* ---------- Calculator: one page ---------- */

.c-inputs, .c-tinker { display: grid; gap: 12px; min-width: 0; }

.c-sec-t { font-weight: 750; font-size: 15px; }

.c-i:hover, .c-i[aria-expanded="true"] { color: var(--ink); border-color: var(--ink-2); }

.c-panel { display: grid; gap: 2px; }
.c-ph { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.c-ph h2 { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; }
.c-risk, .c-wi { display: grid; grid-template-columns: 136px minmax(0, 1fr) 96px; align-items: center; gap: 2px 14px; padding: 7px 0; border-top: 1px solid var(--line); }
.c-risk-n, .c-wi label { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13.5px; font-weight: 650; }
.c-risk-s { display: grid; min-width: 0; }
.c-risk-v, .c-wi-v { text-align: right; font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.c-risk-v.neg { color: var(--bad-ink); }
.c-wi-v.on { color: var(--ink); }
input.c-range { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; margin: 0; background: transparent; cursor: pointer; }
input.c-range::-webkit-slider-runnable-track { box-sizing: content-box; height: 4px; border-radius: 3px; border: 1px solid var(--line-strong); background: var(--surface-2); }

input.c-range::-moz-range-thumb { box-sizing: border-box; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong); }
input.c-range:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.c-seg { margin: 2px 0 8px; flex-wrap: wrap; max-width: 100%; }
details.c-cash > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
details.c-cash > summary::-webkit-details-marker { display: none; }
details.c-cash > summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin-right: 4px; transition: transform .15s ease; }
details.c-cash[open] > summary::after { transform: rotate(-135deg); }

@media (max-width: 560px) {

<script>
'use strict';
/* =====================================================================
   1. DATA. Every number on screen comes from these objects or is
      computed from them. Flags: sourced | derived | assumption.
   ===================================================================== */
const G_PER_OZ = 31.1034768;

const MODEL = {
  firstYear: 2026,                 // valuation date 1 Jan 2026; cash flows dated 31 Dec, discounted by actual days ÷ 365 (Excel XNPV, as in the Tongon spreadsheet)
  valuationUTC: Date.UTC(2026, 0, 1),
  defaultRate: 0.05,
  rateStep: 0.005, rateMin: 0, rateMax: 0.20,
  fixedShare: 0.40,                // share of site costs that continue through a stoppage
  fiscalWithinYears: 3,            // a fiscal change "within three years" is equally likely in each of years 1-3
  breakevenMax: 25000
};

const MODEL_ASSUMPTIONS = [
  { label: 'Fixed share of site costs during a stoppage', value: '40%', note: 'A stoppage cuts output and variable costs; fixed costs continue.' },
  { label: 'Stoppages', value: 'p × months ÷ 12', note: 'A p% yearly chance of an n-month stoppage cuts each year’s milled tonnes by p × n/12. Events from different dials add.' },
  { label: 'Timing of a fiscal change “within three years”', value: 'Equal chance in years 1, 2, 3', note: 'Expected royalty rise in year t = probability × 2 points × min(1, t/3). The state-stake rise uses the same timing.' },
  { label: 'State stake rise', value: 'Uncompensated', note: 'The owner’s share falls pro rata (share × (1 − new) ÷ (1 − current)), with no payment from the state.' },
  { label: 'Sustaining capex during stoppages', value: 'Scales with tonnes milled', note: 'Sustaining capex is per tonne milled, so it falls with a stoppage.' },
  { label: 'Depreciation for tax', value: 'Units of production', note: '(Opening tax base + capex) × this year’s tonnes ÷ remaining scheduled tonnes; whatever is left is deducted in the final year.' },
  { label: 'Discounting', value: 'End-year, by actual days', note: 'Cash flows are dated 31 December and discounted from 1 Jan 2026 by actual days ÷ 365, as Excel’s XNPV and XIRR do in the Tongon spreadsheet. Year 1 is 364/365 of a year.' },
  { label: 'Working-capital days', value: 'Receivables 5 · inventory 30 · payables 45', note: 'As in the Tongon spreadsheet. Receivables use revenue after the stream; inventory and payables use site costs. The opening balance equals the year-1 level.' },
  { label: 'Working-capital release', value: 'Year after production ends', note: 'The balance unwinds in the year after the last production year, if that year is inside the asset’s model horizon (Tongon: 2030, the spreadsheet’s last column).' },
  { label: 'AISC definition', value: 'Site + royalties + sustaining + corporate G&A + exploration', note: 'Per payable ounce, as in the Tongon spreadsheet. Excludes streams (shown as a memo there), growth capex and closure.' },
  { label: 'Risk cost per ounce', value: '(Base − risk-adjusted NPV) ÷ owner’s LOM ounces', note: 'Owner’s share of NPV over the owner’s share of base-case life-of-mine payable ounces.' },
  { label: 'Consensus deck after 2030', value: 'Flat at US$4,500/oz', note: 'Goldman Sachs gives 2026 and 2027; flat from 2028 onwards is an assumption.' },

};
const DECKS = { gold: PRICE_DECKS, spodumene: LITHIUM_DECKS };
const UNITS = {
  gold: { u: 'oz', k: 'koz', price: 'US$/oz', product: 'payable gold', priceName: 'gold price', grade: 'g/t', containedName: 'gold in the mine plan', basis: '', perUnit: 'per ounce' },
  spodumene: { u: 't', k: 'kt', price: 'US$/t', product: 'concentrate', priceName: 'spodumene price (SC6)', grade: '% Li₂O', containedName: 'lithia in the mine plan, counted as SC6 concentrate', basis: ' SC6', perUnit: 'per tonne of concentrate' }
};
let UCTX = 'gold';   // units used by the formatters while one asset's content is rendered
const UN = () => UNITS[UCTX];
const cap1 = (t) => t.charAt(0).toUpperCase() + t.slice(1);

const LEVELS = ['L', 'M', 'H'];
const LEVEL_NAME = { L: 'Low', M: 'Medium', H: 'High' };
const LEVEL_SHORT = { L: 'Low', M: 'Med', H: 'High' };

// The dials, in bridge order (discount rate last). Every number here is a starting assumption.
const DIALS = [
  { id: 'resource', name: 'Resource and grade', short: 'Resource', question: 'How sure are we about the tonnes and grade?',
    covers: 'Resource confidence, grade reconciliation, dilution, life extension', method: 'Input range', line: 'Head grade; tonnes and mine life',
    basis: 'Share of the plan from Inferred resource, reconciliation history, years in production',
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Grade −5%, mine life −10%', fx: { grade: -0.05, life: -0.10 } }, H: { text: 'Grade −10%, mine life −25%', fx: { grade: -0.10, life: -0.25 } } } },
  { id: 'recovery', name: 'Recovery', short: 'Recovery', question: 'Will the plant get the metal out?',
    covers: 'Metallurgy, ore variability, throughput', method: 'Input range', line: 'Recovery',
    basis: 'Years of plant data versus bench testwork only; refractory or fresh ore ahead',
    levels: { L: { text: 'Recovery −1 point', fx: { recPts: -1 } }, M: { text: 'Recovery −4 points', fx: { recPts: -4 } }, H: { text: 'Recovery −12 points', fx: { recPts: -12 } } } },
  { id: 'ground', name: 'Ground and mining', short: 'Ground', question: 'How hard is it to mine?',
    covers: 'Geotechnical, water, hardness, hauls, method change', method: 'Input range; stoppage chance at High', line: 'Mining cost; downtime',
    basis: 'Pit depth and wall history, water, haul distances, planned transitions',
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Mining cost +5%', fx: { mining: 0.05 } }, H: { text: 'Mining cost +15%, plus a 5% yearly chance of a two-month stoppage', fx: { mining: 0.15, events: [{ p: 0.05, months: 2 }] } } } },
  { id: 'infra', name: 'Infrastructure', short: 'Infrastructure', question: 'Can it get power, water and supplies reliably?',
    covers: 'Power, water, access', method: 'Input range; stoppage chance at High', line: 'Processing and site G&A cost; downtime',
    basis: 'Grid reliability, diesel dependence, distance to port',
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Processing and G&A +5%', fx: { procGa: 0.05 } }, H: { text: 'Processing and G&A +10%, plus a 2% yearly chance of a one-month outage', fx: { procGa: 0.10, events: [{ p: 0.02, months: 1 }] } } } },
  { id: 'people', name: 'People and operator', short: 'People', question: 'Have they done this before?',
    covers: 'Skills, operator record, labour relations', method: 'Input range; delay for deposits at High', line: 'All site costs; ramp-up for deposits',
    basis: 'Depth of the local mining workforce, expat share, operator history',
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Site costs +5%', fx: { site: 0.05 } }, H: { text: 'Site costs +10%; deposits also ramp up six months slower', fx: { site: 0.10, depositDelay: 0.5 } } } },
  { id: 'capex', name: 'Capex and schedule', short: 'Capex', question: 'Will it be built on budget and on time?', depositsOnly: true,
    covers: 'Overrun, delay, ramp-up', method: 'Input range and a delay', line: 'Initial capex; production timing',
    basis: 'Study stage (PFS or DFS), contingency, contractor record',
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Capex +15%, six months late', fx: { capex: 0.15, depositDelay: 0.5 } }, H: { text: 'Capex +35%, twelve months late', fx: { capex: 0.35, depositDelay: 1 } } } },
  { id: 'funding', name: 'Funding', short: 'Funding', question: 'Can the owner pay for the build?', depositsOnly: true,

    basis: 'Funding committed or in hand, a strategic partner, where the lithium price cycle stands',
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Financing costs of 10% of capex, six months late', fx: { finCost: 0.10, depositDelay: 0.5 } }, H: { text: 'Financing costs of 20% of capex, a year late', fx: { finCost: 0.20, depositDelay: 1 } } } },
  { id: 'fiscal', name: 'Fiscal and legal', short: 'Fiscal', question: 'Will the rules change?',
    covers: 'Royalty, tax, state stake, permits', method: 'Chance of a change', line: 'Royalties; owner’s share',
    basis: 'Recent code changes, stability agreement, licence term',
    levels: { L: { text: 'No change', fx: {} }, M: { text: '25% chance of a two-point royalty rise within three years', fx: { royaltyPts: 2, royaltyProb: 0.25 } }, H: { text: '50% chance of a two-point royalty rise and the state stake going to 30%', fx: { royaltyPts: 2, royaltyProb: 0.5, stateTo: 0.30, stateProb: 0.5 } } } },

  { id: 'political', name: 'Political and security', short: 'Political', question: 'Could the country stop the mine?',

// How each risk destroys value, and what typically retires it. Paraphrased from "What Drives Mining Project Value"
// (sections 1.2 and 2.4); the interaction numbers refer to that framework.
const DIAL_MECHANISMS = {
  resource: { why: 'Grade or continuity below the model means less metal per tonne at the same cost, a reserve downgrade and a shorter life. It is common where drill spacing is wide or dilution is underestimated.',
    retire: 'Infill drilling to Measured and Indicated; grade-control or trial-mining reconciliation against the resource model.' },
  recovery: { why: 'A plant below design recovery, often because of ore variability, loses revenue against costs that are largely fixed.',
    retire: 'Variability testwork across the ore types ahead, pilot-plant runs, and plant data on that ore.' },
  ground: { why: 'Depth, slope angles and groundwater set how much waste is moved, how much ore is diluted or lost, and what mining costs; a wall failure stops production.',
    retire: 'Geotechnical drilling and slope, ground-support and dewatering design to accepted standards, backed by a record of wall performance.' },
  infra: { why: 'Where power, water or transport are not secure, the mine pays to build or back them up, and outages stop the plant.',
    retire: 'Contracted power and water with backup, fuel stocks on site, and more than one supply route.' },
  people: { why: 'Overruns and slow ramp-ups add cost and push cash flow later; the operator’s experience with similar ore and methods drives both.',

  capex: { why: 'Capex estimates often rise from scoping to feasibility, overruns against the feasibility estimate are common, and nameplate is often reached late. Each year of delay costs present value.',

  funding: { why: 'Juniors fund a build with equity, debt and offtake deals. When prices fall, money gets scarce and expensive, and the build waits.',

  fiscal: { why: 'Once capital is sunk, bargaining power moves to the host state, which may raise royalties or tax or take a bigger free carry. A free carry dilutes the owner without funding the project.',

  community: { why: 'Grievance leads to protest or legal challenge, then stoppages and delay, which leave less cash for local benefits and more grievance.',

  political: { why: 'Instability, seizure or forced renegotiation can stop the mine. Investors price this with a higher discount rate.',

};

// Source records, spread into evidence items so each carries {source, url}.

  MCTON:  { source: 'MINING.COM, Barrick sells Tongon mine interests to Atlantic Group for up to $305M (7 Oct 2025)', url: 'https://www.mining.com/barrick-sells-tongon-mine-interests-to-atlantic-group-for-up-to-305m/' },

  GOLDARK:{ source: 'Golden Ark Reserve, gold price forecast round-up (Nov 2026), citing Goldman Sachs', url: 'https://goldenarkreserve.com/insights/gold-price-forecast-november-2026/' },

   ===================================================================== */
const sum = (arr, f = (x) => x) => arr.reduce((s, x) => s + f(x), 0);

function deckPrice(deck, year) {
  return deck.prices[year] != null ? deck.prices[year] : deck.flat;
}

// Calibrate unit costs where they are not public (Tropicana) and resolve everything into one cost object.
function resolveCosts(asset, all) {
  const c = asset.costs;
  if (c.split) {
    return { split: { ...c.split }, sustainingPerT: c.sustainingPerT, growthCapex: { ...(c.growthCapex || {}) }, devCapex: { ...(c.devCapex || {}) },
      corporatePerOz: c.corporatePerOz || 0, explorationPerOz: c.explorationPerOz || 0, haulagePerT: c.haulagePerT || 0, calibration: null };
  }
  const k = c.calibrate;
  const y1 = buildSchedule(asset, 0)[0];
  const tonnes1 = y1.ore * 1e6;
  const oz1 = tonnes1 * y1.grade / G_PER_OZ * asset.processing.recovery * asset.processing.payability;
  const aiscLocal = (k.aiscLowLocal + k.aiscHighLocal) / 2;
  const aiscUS = aiscLocal * k.fx;
  const royRate = sum(asset.fiscal.royalties, (r) => r.rate);
  const royUSperOz = royRate * k.realisedLocal * k.fx;
  const sustLocal = (k.sustainingQuarterLocal.devAndWaste + k.sustainingQuarterLocal.plantEquip) * 4 / k.quarterShare;
  const sustUS = sustLocal * 1e6 * k.fx;
  const corp = c.corporatePerOz || 0;
  const expl = c.explorationPerOz || 0;
  const siteCostPerT = (aiscUS * oz1 - royUSperOz * oz1 - sustUS - (corp + expl) * oz1) / tonnes1;
  const ref = all.find((a) => a.id === k.splitFrom).costs.split;
  const refTot = ref.mining + ref.processing + ref.transport + ref.ga;
  const split = {};
  for (const key of ['mining', 'processing', 'transport', 'ga']) split[key] = siteCostPerT * ref[key] / refTot;
  const growth = { ...(c.growthCapex || {}) };
  if (k.growth) growth[k.growth.year] = (k.growth.lowLocal + k.growth.highLocal) / 2 / k.growth.share * k.fx * 1e6;
  return { split, sustainingPerT: sustUS / tonnes1, growthCapex: growth, devCapex: { ...(c.devCapex || {}) },
    corporatePerOz: corp, explorationPerOz: c.explorationPerOz || 0, haulagePerT: 0,
    calibration: { oz1, tonnes1, aiscLocal, aiscUS, royUSperOz, sustLocal, sustUS, siteCostPerT, fx: k.fx, growthUS: growth[k.growth.year], growthYear: k.growth.year } };
}

// Production schedule before any dial: [{year, ore (Mt), grade (g/t)}]
function buildSchedule(asset, ext, trimYears = 0) {
  const s = asset.schedule;
  let rows = [];
  if (s.kind === 'fixed') {
    rows = s.rows.map((r) => ({ year: r.year, ore: r.ore, grade: r.grade }));
    if (ext && s.extension) rows = rows.concat(s.extension.rows.map((r) => ({ year: r.year, ore: r.ore, grade: r.grade })));
  } else if (s.kind === 'sources') {
    const src = s.sources.map((x) => ({ ...x, left: x.tonnes }));
    const n = Math.max(0, Math.min(ext || 0, s.extension ? s.extension.maxYears : 0));
    if (n > 0) {
      const e = s.extension;
      src.push({ id: 'ugx', left: e.ugRate * n, grade: e.ugGrade, group: 'ug', priority: e.ugPriority });
      src.push({ id: 'fill', left: (s.millRate - e.ugRate) * n, grade: e.fillGrade, priority: e.fillPriority });
    }
    src.sort((a, b) => a.priority - b.priority);
    let year = s.startYear;
    while (src.some((x) => x.left > 1e-9) && rows.length < 80) {
      let mill = s.millRate; const used = {}; let t = 0; let g = 0;
      for (const x of src) {
        if (x.left <= 1e-9 || mill <= 1e-9) continue;
        const cap = x.group ? s.groupCaps[x.group] - (used[x.group] || 0) : Infinity;
        const take = Math.min(x.left, cap, mill);
        if (take <= 1e-12) continue;
        x.left -= take; mill -= take; t += take; g += take * x.grade;
        if (x.group) used[x.group] = (used[x.group] || 0) + take;
      }
      if (t <= 1e-12) break;
      rows.push({ year, ore: t, grade: g / t });
      year++;
    }
  }
  if (trimYears > 0) rows = rows.slice(0, Math.max(0, rows.length - trimYears));
  return rows;
}

// Remove the last share of scheduled tonnes (pro rata in the final year).
function cutLife(rows, frac) {
  if (!(frac > 0)) return rows;
  let remove = sum(rows, (r) => r.ore) * frac;
  const out = rows.map((r) => ({ ...r }));
  for (let i = out.length - 1; i >= 0 && remove > 1e-12; i--) {
    const take = Math.min(out[i].ore, remove);
    out[i].ore -= take; remove -= take;
  }
  return out.filter((r) => r.ore > 1e-9);
}

// Push production later by d years (fractional). Used for deposits only.
function shiftSchedule(rows, d) {
  if (!(d > 0) || !rows.length) return rows;
  const k = Math.floor(d); const f = d - k; const first = rows[0].year; const out = [];
  for (let j = 0; j < rows.length + k + (f > 0 ? 1 : 0); j++) {
    const a = rows[j - k]; const b = rows[j - k - 1];
    let ore = 0; let g = 0;
    if (a) { ore += (1 - f) * a.ore; g += (1 - f) * a.ore * a.grade; }
    if (b && f > 0) { ore += f * b.ore; g += f * b.ore * b.grade; }
    if (ore > 1e-12) out.push({ year: first + j, ore, grade: g / ore });
  }
  return out;
}

// Streamed ounces this year from cumulative-ounce tiers.
function tierOz(tiers, cum, oz) {
  let s = 0; let lo = 0;
  for (const t of tiers) {
    const cap = t.upTo == null ? Infinity : t.upTo;
    const a = Math.max(cum, lo); const b = Math.min(cum + oz, cap);
    if (b > a) s += (b - a) * t.rate;
    lo = cap;
  }
  return s;
}

// Translate dial levels into model adjustments. Only enabled dials count.
function dialParams(asset, levels, enabled) {
  const P = { grade: 0, life: 0, recPts: 0, mining: 0, procGa: 0, site: 0, events: [], capex: 0, finCost: 0, delay: 0,
    royaltyPts: 0, royaltyProb: 0, stateTo: null, stateProb: 0, crpMult: 0 };
  const isDeposit = asset.stage === 'deposit';
  for (const d of DIALS) {
    if (!enabled.has(d.id)) continue;
    if (d.depositsOnly && !isDeposit) continue;
    const fx = d.levels[levels[d.id]].fx;
    for (const [key, v] of Object.entries(fx)) {
      if (key === 'events') P.events.push(...v);
      else if (key === 'depositDelay') { if (isDeposit) P.delay += v; }
      else if (key === 'stateTo') P.stateTo = v;
      else P[key] += v;
    }
  }
  return P;
}

const ramp = (year, within) => Math.min(1, (year - MODEL.firstYear + 1) / within);

// Years from the valuation date to 31 Dec of `year`, by actual days ÷ 365 (Excel XNPV/XIRR convention).
const yearFrac = (year) => (Date.UTC(year, 11, 31) - MODEL.valuationUTC) / 86400000 / 365;

/**
 * Run the DCF for one asset.
 * o = { deck, flatPrice?, rate, levels, enabled:Set, ext, trimYears?, tweak? }
 * tweak = one-at-a-time sensitivity levers, as in the Tongon Sensitivity Engine:
 *   { gold (price ×), grade (×), site (site cost/t ×), haul (+US$/t), royaltyPts (+), stream (false = removed), closure (×) }
 */
// Product adapters. Gold: payable ounces priced per ounce. Spodumene: tonnes of concentrate at its grade,
// priced pro rata to an SC6 (6% Li2O) price, the usual industry convention.
const COMMODITY = {
  gold: {
    units: (milledMt, grade, rec, pr) => milledMt * 1e6 * grade / G_PER_OZ * rec * pr.payability,
    unitPrice: (price) => price,
    containedRef: (milledMt, grade) => milledMt * 1e6 * grade / G_PER_OZ,           // ounces in the ground
    refUnits: (units) => units                                                      // payable ounces, already at reference basis
  },
  spodumene: {
    units: (milledMt, grade, rec, pr) => milledMt * 1e6 * grade / 100 * rec / (pr.concGrade / 100),
    unitPrice: (price, pr) => price * pr.concGrade / 6 * (pr.realisation != null ? pr.realisation : 1),
    containedRef: (milledMt, grade) => milledMt * 1e6 * grade / 100 / 0.06,          // SC6-equivalent tonnes at full recovery
    refUnits: (units, pr) => units * pr.concGrade / 6                                // concentrate tonnes expressed as SC6 tonnes
  }
};
const commodityOf = (a) => (a && a.commodity) || 'gold';

/**
 * Run the DCF for one asset.
 * o = { deck, flatPrice?, rate, levels, enabled:Set, ext, trimYears?, tweak? }
 * tweak = one-at-a-time sensitivity levers, as in the Tongon Sensitivity Engine:
 *   { gold (price ×), grade (×), site (site cost/t ×), haul (+US$/t), royaltyPts (+), stream (false = removed), closure (×) }
 * Deposits add: construction years before production (devCapex by year), logistics and freight per unit,
 * by-product credits, royalties on FOB value, tax losses carried forward and a free carry on distributions.
 */
function runCore(asset, o) {
  const P = dialParams(asset, o.levels, o.enabled);
  const tw = o.tweak || {};
  const K = COMMODITY[commodityOf(asset)];
  const c = asset.resolved; const f = asset.fiscal; const pr = asset.processing;
  const stream = tw.stream === false ? null : asset.stream;
  let rows = buildSchedule(asset, o.ext, o.trimYears || 0);
  if (P.delay > 0) rows = shiftSchedule(rows, P.delay);
  rows = cutLife(rows, -P.life);
  // Closing early: the rest of the ore stays in the ground and closure falls due at the stop.
  if (o.closeFrom != null) {
    rows = rows.filter((r) => r.year < o.closeFrom);
    if (!rows.some((r) => r.ore > 0)) rows.push({ year: o.closeFrom, ore: 0, grade: 0, closeHere: true });
  }
  // Pausing: loss years go into care and maintenance (the fixed share of site costs continues) and their ore is mined later.
  if (o.pause && o.pause.size) {
    const moved = [];
    rows = rows.map((r) => { if (o.pause.has(r.year) && r.ore > 0) { moved.push({ ore: r.ore, grade: r.grade }); return { ...r, ore: 0, cmOre: r.ore }; } return r; });
    let y = rows.length ? rows[rows.length - 1].year : MODEL.firstYear;
    for (const m of moved) rows.push({ year: ++y, ore: m.ore, grade: m.grade });
  }
  // Add construction years (capex, no production) before the first production year, and fill any gaps.
  const capYears = Object.keys(c.devCapex || {}).map(Number).filter((y) => (c.devCapex[y] || 0) !== 0);
  if (capYears.length || c.corporateFixed) {
    const firstY = Math.min(...capYears, rows.length ? rows[0].year : Infinity, c.corporateFixed ? MODEL.firstYear : Infinity);
    const lastY = rows.length ? rows[rows.length - 1].year : Math.max(...capYears);
    const byY = new Map(rows.map((r) => [r.year, r]));
    const full = []; for (let y = firstY; y <= lastY; y++) full.push(byY.get(y) || { year: y, ore: 0, grade: 0 });
    rows = full;
  }
  let lastProd = -1; rows.forEach((r, i) => { if (r.ore > 0) lastProd = i; });
  let firstProdYear = null; for (const r of rows) { if (r.ore > 0) { firstProdYear = r.year; break; } }
  const endYear = lastProd >= 0 ? rows[lastProd].year : (rows.find((r) => r.closeHere) || { year: -Infinity }).year;   // head-office costs run until here
  const stop = sum(P.events, (e) => e.p * e.months / 12);
  const recovery = Math.max(0, pr.recovery + P.recPts / 100);
  const sp = c.split;
  const unitSite = (sp.mining * (1 + P.mining) + sp.processing * (1 + P.procGa) + sp.transport + sp.ga * (1 + P.procGa) + c.haulagePerT * (1 + P.mining)) * (1 + P.site) * (tw.site || 1) + (tw.haul || 0);
  const closureCost = f.closure * (tw.closure || 1);
  const dil = P.stateTo != null && asset.stateStake < P.stateTo ? 1 - (1 - P.stateTo) / (1 - asset.stateStake) : 0;
  const rate = o.rate + P.crpMult * asset.crp.value;
  const carry = asset.freeCarry || 0;
  let remOre = sum(rows, (r) => r.ore); let taxBase = f.taxBase; let cumOz = 0; let wcPrev = null;
  let losses = f.lossCarryForward ? (f.openingLosses || 0) : 0;
  const years = [];
  rows.forEach((r, i) => {
    const last = i === lastProd || !!r.closeHere;
    const deck = o.deck;
    const basePrice = o.flatPrice != null ? o.flatPrice
      : (deck.byProdYear && firstProdYear != null && r.year >= firstProdYear ? (deck.byProdYear[r.year - firstProdYear] != null ? deck.byProdYear[r.year - firstProdYear] : deck.flat) : deckPrice(deck, r.year));
    const price = basePrice * (tw.gold || 1);
    const milled = r.ore * (1 - stop);
    const grade = r.grade * (1 + P.grade) * (tw.grade || 1);
    const oz = r.ore > 0 ? K.units(milled, grade, recovery, pr) : 0;   // payable units: ounces of gold, or tonnes of concentrate
    const sOz = stream ? tierOz(stream.tiers, cumOz, oz) : 0;
    cumOz += oz;
    const revenue = oz * K.unitPrice(price, pr);
    const byproduct = oz * (c.byproductPerUnit || 0);
    const freight = oz * (c.freightPerUnit || 0);
    const logistics = oz * (c.logisticsPerUnit || 0);
    const streamCost = stream ? sOz * price * (1 - stream.holderPayment) : 0;
    const gross = revenue + byproduct;
    const extraPts = (tw.royaltyPts || 0) / 100 + (P.royaltyPts / 100) * P.royaltyProb * ramp(r.year, MODEL.fiscalWithinYears);
    const royalties = sum(f.royalties, (q) => q.rate * (q.base === 'fob' ? gross - freight : gross)) + extraPts * gross;
    const royaltyRate = gross > 0 ? royalties / gross : 0;
    const site = unitSite * 1e6 * (r.ore * MODEL.fixedShare + milled * (1 - MODEL.fixedShare)) + (r.cmOre ? unitSite * 1e6 * r.cmOre * MODEL.fixedShare : 0);
    const corporate = oz * c.corporatePerOz + (c.corporateFixed && r.year <= endYear ? c.corporateFixed : 0);
    const exploration = oz * c.explorationPerOz;
    const other = oz * (c.otherPerUnit || 0);   // carbon, marketing and other costs per unit sold
    const ebitda = gross - streamCost - royalties - site - corporate - exploration - logistics - freight - other;
    const sustaining = c.sustainingPerT * milled * 1e6 + (c.sustainingPerUnit || 0) * oz;
    const growth = c.growthCapex[r.year] || 0;
    const development = (c.devCapex[r.year] || 0) * (1 + P.capex) * (1 + P.finCost);
    const capex = sustaining + growth + development;
    const share = last ? 1 : (remOre > 0 ? r.ore / remOre : 0);
    const depreciation = (taxBase + capex) * Math.min(1, share);
    taxBase = taxBase + capex - depreciation; remOre -= r.ore;
    let taxable = ebitda - depreciation;
    if (f.lossCarryForward) {
      if (taxable < 0) { losses += -taxable; taxable = 0; } else { const use = Math.min(losses, taxable); taxable -= use; losses -= use; }
    }
    const tax = Math.max(0, taxable * f.taxRate);
    const revenueAfterStream = revenue - streamCost;   // receivables basis, as in the Tongon spreadsheet
    const wc = revenueAfterStream * f.wc.receivableDays / 365 + site * f.wc.inventoryDays / 365 - site * f.wc.payableDays / 365;
    const dWC = wcPrev == null ? 0 : wc - wcPrev; wcPrev = wc;
    const closure = last ? closureCost : 0;
    const fcf = ebitda - capex - tax - dWC - closure;
    const ownerShare = asset.ownerShare * (1 - P.stateProb * ramp(r.year, MODEL.fiscalWithinYears) * dil);
    years.push({ year: r.year, ore: r.ore, milled, grade, recovery, oz, price, revenue, byproduct, streamOz: sOz, stream: streamCost, royaltyRate, royalties,
      site, corporate, exploration, other, logistics, freight, ebitda, sustaining, growth, development, capex, depreciation, tax, wc, dWC, closure, fcf, ownerShare });
  });
  if (years.length) {
    const relYear = years[years.length - 1].year + 1;
    if (f.wcReleaseHorizon == null || relYear <= f.wcReleaseHorizon) {
      const z = { year: relYear, release: true, ore: 0, milled: 0, grade: 0, recovery: 0, oz: 0, price: 0, revenue: 0, byproduct: 0, streamOz: 0, stream: 0, royaltyRate: 0,
        royalties: 0, site: 0, corporate: 0, exploration: 0, other: 0, logistics: 0, freight: 0, ebitda: 0, sustaining: 0, growth: 0, development: 0, capex: 0, depreciation: 0, tax: 0,
        wc: 0, dWC: -wcPrev, closure: 0, fcf: wcPrev, ownerShare: years[years.length - 1].ownerShare };
      years.push(z);
    }
  }
  let npv = 0; let npvAttr = 0;
  for (const y of years) {
    y.t = yearFrac(y.year);
    y.df = 1 / Math.pow(1 + rate, y.t);
    // A free carry takes its share of distributions but funds nothing, so the owner bears all spending.
    y.attrFcf = y.fcf >= 0 ? y.fcf * y.ownerShare * (1 - carry) * (1 - (asset.wht || 0)) : y.fcf * y.ownerShare;   // withholding tax on distributions, if set
    y.pv = y.fcf * y.df; y.pvAttr = y.attrFcf * y.df;
    npv += y.pv; npvAttr += y.pvAttr;
  }
  const prodYears = years.filter((y) => !y.release && y.ore > 0);
  const y1 = prodYears[0];
  const lomOz = sum(prodYears, (y) => y.oz);
  const totalOre = sum(prodYears, (y) => y.ore);
  const peakOre = prodYears.length ? Math.max(...prodYears.map((y) => y.ore)) : 0;
  const totalCapex = sum(years, (y) => y.development + y.growth);
  const res = {
    years, rate, npv, npvAttr, lomOz, totalOre, firstProdYear,
    life: peakOre > 0 ? totalOre / peakOre : 0,
    lastYear: prodYears.length ? prodYears[prodYears.length - 1].year : null,
    prod1: y1 ? y1.oz : 0,
    aisc1: y1 && y1.oz > 0 ? (y1.site + y1.royalties + y1.sustaining + y1.corporate + y1.exploration + y1.logistics + y1.other - y1.byproduct) / y1.oz : NaN,
    aiscLom: lomOz > 0 ? sum(prodYears, (y) => y.site + y.royalties + y.sustaining + y.corporate + y.exploration + y.logistics + y.other - y.byproduct) / lomOz : NaN,
    initialCapex: totalCapex,
    params: P, tx: null, flex: null
  };
  res.irr = irr(years.map((y) => ({ t: y.t, cf: y.attrFcf })));
  res.pvAt = (h) => sum(years, (y) => y.attrFcf / Math.pow(1 + h, y.t));   // the most a buyer could pay today for a return of h
  let cum = 0; res.payback = null;
  for (const y of years) { cum += y.attrFcf; if (res.payback == null && cum >= 0 && y.oz > 0) res.payback = y.year; }
  if (asset.transaction) res.tx = transactionMetrics(asset, years, rate);
  return res;
}

// An owner stops mining when it stops paying. If the cash margin (EBITDA less sustaining capex) turns negative and the
// price deck never recovers, the mine closes for good; if it recovers, loss years are paused and their ore mined later.
// The owner takes whichever path is worth more, so the option never lowers value. o.flex === false turns it off.
function runModel(asset, o) {
  const r0 = runCore(asset, o);
  if (o.flex === false || o.closeFrom != null || o.pause) return r0;
  const margin = (y) => y.ebitda - y.sustaining;
  const prod = r0.years.filter((y) => !y.release && y.ore > 0);
  const loss = prod.filter((y) => margin(y) < 0);
  if (!loss.length) return r0;
  const t0 = loss[0].year;
  if (!prod.some((y) => y.year > t0 && margin(y) > 0)) {
    const r1 = runCore(asset, { ...o, closeFrom: t0 }); r1.flex = { closedFrom: t0, paused: [] };
    return r1.npvAttr > r0.npvAttr ? r1 : r0;
  }
  const pause = new Set(loss.filter((y) => margin(y) + y.site * MODEL.fixedShare < 0).map((y) => y.year));   // pausing beats a loss bigger than the fixed costs
  if (!pause.size) return r0;
  const r1 = runCore(asset, { ...o, pause }); r1.flex = { closedFrom: null, paused: [...pause] };
  return r1.npvAttr > r0.npvAttr ? r1 : r0;
}

function contingentByYear(t) {
  const m = {};
  if (!t.contingentYears || !t.contingentYears.length || !t.contingentTotal) return m;
  const per = t.contingentTotal * t.contingentPaidShare / t.contingentYears.length;
  for (const y of t.contingentYears) m[y] = per;
  return m;
}

function transactionMetrics(asset, years, rate) {
  const t = asset.transaction; const cont = contingentByYear(t);
  const flows = [{ t: 0, year: MODEL.firstYear - 1, cf: -t.upfront }];
  const byYear = {};
  for (const y of years) byYear[y.year] = (byYear[y.year] || 0) + y.attrFcf;
  for (const yr of Object.keys(cont)) byYear[yr] = (byYear[yr] || 0);
  for (const yr of Object.keys(byYear).map(Number).sort((a, b) => a - b)) {
    flows.push({ t: yearFrac(yr), year: yr, cf: byYear[yr] - (cont[yr] || 0) });
  }
  const npvAt = (r) => sum(flows, (x) => x.cf / Math.pow(1 + r, x.t));
  let cum = 0; let payback = null;
  for (const x of flows) { cum += x.cf; if (payback == null && x.t > 0 && cum >= 0) payback = x.year; }
  return { flows, npv: npvAt(rate), irr: irr(flows), upfront: t.upfront, contingent: cont, payback };
}

// IRR: scan upward from -50% for the first sign change, then bisect. Flows that end with a small
// negative (a working-capital unwind) can have a second, meaningless root far below -50%.
function irr(flows) {
  const f = (r) => sum(flows, (x) => x.cf / Math.pow(1 + r, x.t));
  let lo = -0.5; let flo = f(lo); let hi = null;
  for (let r = lo + 0.01; r <= 10.0001; r += (r < 1 ? 0.01 : 0.1)) {
    const fr = f(r);
    if (isFinite(fr) && isFinite(flo) && flo * fr <= 0) { hi = r; break; }
    lo = r; flo = fr;
  }
  if (hi == null) return null;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2; const fm = f(mid);
    if (Math.abs(fm) < 1e-6) return mid;
    if (fm * flo > 0) { lo = mid; flo = fm; } else { hi = mid; }
  }
  return (lo + hi) / 2;
}

// Flat gold price at which the owner's NPV is zero.
function breakeven(asset, o) {
  const at = (p) => runModel(asset, { ...o, flatPrice: p }).npvAttr;
  let lo = 0; let hi = MODEL.breakevenMax;
  if (at(hi) < 0) return null;
  if (at(lo) > 0) return 0;
  for (let i = 0; i < 48; i++) { const mid = (lo + hi) / 2; if (at(mid) > 0) hi = mid; else lo = mid; }
  return (lo + hi) / 2;
}

const ALL_DIALS = () => new Set(DIALS.map((d) => d.id));

// Everything the screens need for one asset under one set of controls.
function analyse(asset, ctl) {
  if (asset.dataStatus === 'pending') return { pending: true };
  const common = { deck: ctl.deck, rate: ctl.rate, levels: ctl.levels, ext: ctl.ext, flex: ctl.flex };
  const base = runModel(asset, { ...common, enabled: new Set() });
  const risk = runModel(asset, { ...common, enabled: ALL_DIALS() });
  const bridge = []; const on = new Set(); let prev = base;
  for (const d of DIALS) {
    on.add(d.id);
    const cur = on.size === DIALS.length ? risk : runModel(asset, { ...common, enabled: new Set(on) });
    const applies = !(d.depositsOnly && asset.stage !== 'deposit');
    bridge.push({ dial: d, level: ctl.levels[d.id], delta: cur.npvAttr - prev.npvAttr, applies, after: cur.npvAttr });
    prev = cur;
  }
  const attrOz = base.lomOz * asset.ownerShare;
  return {
    base, risk, bridge,
    beBase: breakeven(asset, { ...common, enabled: new Set() }),
    beRisk: breakeven(asset, { ...common, enabled: ALL_DIALS() }),
    attrOz,
    riskCostPerOz: attrOz > 0 ? (base.npvAttr - risk.npvAttr) / attrOz : NaN
  };
}

// Everything the model needs, derived from the inputs. Pure: inputs in, numbers out.
function depositDerived(d, wi = {}) {   // wi: what-if moves (percent or points), all zero for your inputs as entered
  const juris = jurisOf(d.juris);
  const cats = [['mea', d.mea], ['ind', d.ind], ['inf', d.inf]].filter(([k, c]) => c && c.mt > 0 && (k !== 'inf' || d.includeInferred));
  const resMt = sum(cats, ([, c]) => c.mt);
  const resGrade = resMt > 0 ? sum(cats, ([, c]) => c.mt * c.g) / resMt : 0;
  const infMt = d.includeInferred && d.inf ? d.inf.mt : 0;
  const share = (d.planShare != null ? d.planShare : typical('plan_share_of_resource').median) / 100;
  const dil = (d.dilution != null ? d.dilution : typical('dilution_pct').median) / 100;
  const planMt = d.planMt != null ? d.planMt : resMt * share * (1 + dil);
  const planGrade = (d.planGrade != null ? d.planGrade : resGrade / (1 + dil)) * (1 + (wi.grade || 0) / 100);
  const inferredShare = d.inferredShare != null ? d.inferredShare / 100 : (resMt > 0 ? infMt / resMt : 0);
  const taylorLife = planMt > 0 ? 0.2 * Math.pow(planMt * 1e6, 0.25) : 0;
  const rate = d.rate != null ? d.rate : (taylorLife > 0 ? planMt / taylorLife : 0);
  const strip = d.method === 'ug' ? 0 : (d.strip != null ? d.strip : typical('strip_ratio_op').median);
  const mOp = d.miningOp != null ? d.miningOp : typical('mining_cost_op_per_t_material').median;
  const mUg = d.miningUg != null ? d.miningUg : typical('mining_cost_ug_per_t_ore').median;
  const ug = d.method === 'ug' ? 1 : d.method === 'op' ? 0 : (d.ugShare != null ? d.ugShare / 100 : 0.3);
  const ox = 1 + (wi.opex || 0) / 100;
  const miningPerTOre = ((1 - ug) * mOp * (1 + strip) + ug * mUg) * ox;
  // Blank inputs take the typical value from the studies.
  const flot = d.route === 'flot';
  const recovery = Math.max(1, Math.min(100, (d.recovery != null ? d.recovery : typical(flot ? 'recovery_flotation' : 'recovery_dms').median) + (wi.recovery || 0)));
  const processing = (d.processing != null ? d.processing : typical(flot ? 'processing_cost_flotation' : 'processing_cost_dms').median) * ox;
  const ga = (d.ga != null ? d.ga : typical('site_ga_per_t_ore').median) * ox;
  const sustaining = d.sustaining != null ? d.sustaining : typical('sustaining_capex_per_t_conc').median;
  const freight = d.freight != null ? d.freight : typical('ocean_freight').median;
  const concGrade = d.concGrade || 6;
  const legs = (d.legs || []).filter((l) => l && l.km > 0);
  const legRate = (l) => l.rate != null ? l.rate : (l.mode === 'truck' ? typical('road_haul_per_t_km').median : 0);
  const missingRates = legs.filter((l) => l.rate == null && l.mode !== 'truck').map((l) => l.mode);
  const logisticsPerT = sum(legs, (l) => l.km * legRate(l)) + (d.port || 0);
  const oreHaulPerT = d.plantMode === 'existing' ? (d.oreHaulKm || 0) * (d.oreHaulRate != null ? d.oreHaulRate : typical('road_haul_per_t_km').median) : 0;
  const intensity = typical('capex_per_annual_t_ore').median;
  const capexTypical = rate * 1e6 * intensity / 1e6 * (d.plantMode === 'existing' ? typical('existing_plant_capex_ratio').median / 100 : 1);
  const capexM = ((d.capex != null ? d.capex : capexTypical) + (d.infraCapex || 0)) * (1 + (wi.capex || 0) / 100);
  const decision = (d.decisionYears != null ? d.decisionYears : ({ granted: 0, progress: 1, none: 2 }[d.permits] ?? 1)) + (wi.delay || 0);
  const build = d.buildYears || 2;
  const startBuild = MODEL.firstYear + decision;
  const devCapex = {}; (BUILD_PHASING[build] || BUILD_PHASING[2]).forEach((f, i) => { devCapex[startBuild + i] = capexM * 1e6 * f; });
  const firstProd = startBuild + Math.floor(build);
  const ramp = Array.isArray(d.ramp) ? d.ramp : (RAMPS[d.ramp] || []);
  let rows = []; let left = planMt; let y = firstProd; let i = 0;
  while (left > 1e-9 && rows.length < 60) { const f = i < ramp.length ? ramp[i] : 1; const ore = Math.min(left, rate * f); rows.push({ year: y, ore, grade: planGrade }); left -= ore; y++; i++; }
  if (build % 1) rows = shiftSchedule(rows, build % 1);   // a half-year build starts production mid-year
  let royalties = d.royalty != null ? [{ name: d.royaltyName || 'Royalty (your input)', rate: d.royalty / 100, base: d.royaltyBase || 'gross' }] : (juris.royalties || []);
  if (d.privateRoyalty) royalties = royalties.concat([{ name: 'Private royalty on the tenement', rate: d.privateRoyalty / 100, base: 'gross' }]);
  const realisation = (d.realisation != null ? d.realisation : typical('realisation_discount_pct').median) / 100;   // price received below the SC6 benchmark
  const corporateM = d.corporate != null ? d.corporate : typical('corporate_overhead_usd_m').median;                 // head office, US$M a year
  const wcDays = d.wcDays != null ? d.wcDays : 30;                                                                   // receivables, days of revenue (assumption)
  const tax = d.tax != null ? d.tax / 100 : (juris.tax != null ? juris.tax : 0.30);
  const carry = d.freeCarry != null ? d.freeCarry / 100 : juris.carry || 0;
  const cr = countryRow(juris.country);
  const conc = planMt * 1e6 * planGrade / 100 * (recovery / 100) / (concGrade / 100);
  const priceSC6 = (d.deckOverride && d.deckOverride.flat) || LITHIUM_DECKS[d.deck || 'req'].flat;
  return { juris, resMt, resGrade, infMt, planMt, planGrade, inferredShare, taylorLife, rate, life: rate > 0 ? planMt / rate : 0, strip, ug, miningPerTOre,
    recovery, processing, ga, sustaining, freight, concGrade, logisticsPerT, oreHaulPerT, missingRates, capexTypical, capexM, decision, build, firstProd, devCapex, rows, royalties, tax, carry, realisation, corporateM, wcDays,
    crp: cr ? cr[2] : 0, crpBasis: cr ? cr[1] : 'not in Damodaran’s table', concLom: conc, concPerYear: rate * 1e6 * planGrade / 100 * (recovery / 100) / (concGrade / 100),
    logisticsShare: priceSC6 > 0 ? (logisticsPerT + freight) / (priceSC6 * concGrade / 6) : NaN };
}

// Starting risk levels for a deposit, set by stated rules from its inputs. Thresholds are starting assumptions to calibrate.
// An input that is not known starts at Medium; capex taken from the typical value starts at High.
function depositDialDefaults(d, D) {
  const pick = (lv, reason, q) => ({ level: lv, reason, sources: ['RPFRAME'], question: q });
  const STD = 'Standard starting point; move it if you know more.';
  const out = {};
  const inf = D.inferredShare;
  out.resource = pick(inf < 0.05 ? 'L' : inf < 0.2 ? 'M' : 'H', `${pct(inf, 0)} of the mine plan is Inferred (Low below 5%, High above 20%).`,
    'How much of the plan is Measured and Indicated, and what does infill drilling at the planned spacing show?');
  const tw = d.testwork;
  out.recovery = pick(!tw ? 'M' : tw === 'pilot' ? 'L' : tw === 'bench' ? 'M' : 'H', !tw ? STD : `Testwork: ${{ pilot: 'pilot plant or variability programme', bench: 'bench-scale only', none: 'none yet' }[tw]}.`,
    'What recovery does variability testwork show across the ore types, and has a pilot plant confirmed it?');
  out.ground = pick(d.method !== 'op' || D.strip > 12 ? 'M' : 'L', d.method === 'op' ? `Open pit, strip ratio ${D.strip.toFixed(1)}:1 (Medium above 12:1).` : 'Underground mining planned.',
    'What do geotechnical drilling and slope or ground-support designs show, and how much water must be handled?');
  const longHaul = sum(d.legs || [], (l) => (l && l.km) || 0) > 800;
  out.infra = pick(longHaul ? 'H' : !d.power || d.power === 'diesel' ? 'M' : 'L', longHaul ? 'Port more than 800 km away.' : !d.power ? STD : d.power === 'diesel' ? 'Diesel power on site.' : `${cap1(d.power)} power; port under 800 km away.`,
    'Who supplies power and water, on what terms, and what happens to the plant if the haul route or power is cut?');
  out.people = pick(!d.operator ? 'M' : d.operator === 'similar' ? 'L' : d.operator === 'other' ? 'M' : 'H', !d.operator ? STD : { similar: 'The team has built and run a similar mine.', other: 'The team has built a mine, but not a spodumene operation.', none: 'The team has not built a mine before.' }[d.operator],
    'Who will build and run the mine, and what is their record on similar projects?');
  const basis = d.capexBasis;
  out.capex = pick(!basis ? (d.capex == null ? 'H' : 'M') : basis === 'fs' ? 'L' : basis === 'pfs' ? 'M' : 'H',
    !basis ? (d.capex == null ? 'Capex is the typical value from studies, not an estimate for this deposit.' : STD) : `Capex from ${{ own: 'your own estimate or the typical value', scoping: 'a scoping study', pfs: 'a pre-feasibility study', fs: 'a feasibility study' }[basis]}.`,
    'How mature is the capex estimate, how much contingency does it carry, and what has the contractor delivered before?');
  out.fiscal = pick(D.crp >= 0.08 ? 'H' : D.crp >= 0.03 ? 'M' : 'L', `${D.juris.country}’s country risk premium is ${pct(D.crp, 2)} (Low below 3%, High above 8%).`,
    'Is there a stability agreement fixing royalty, tax and the state’s stake, and for how long?');
  const act = LI_STATE_ACTIONS[D.juris.country];
  if (act) out.fiscal = pick('H', `${D.juris.country} ${act.text}.`,
    'Is there a stability agreement fixing royalty, tax and the state’s stake, and would it survive a change of government?');
  out.community = pick(!d.permits ? 'M' : d.permits === 'granted' ? 'L' : d.permits === 'none' ? 'H' : 'M', !d.permits ? STD : `Permits ${{ granted: 'granted', progress: 'in progress', none: 'not yet applied for' }[d.permits]}.`,
    'Which permits are outstanding, what land access and community agreements are needed, and is anyone opposing the project?');
  out.political = pick('M', `Full country risk premium (${pct(D.crp, 2)}).`, 'What treaty protection or political-risk insurance is available?');
  out.capex.applies = true;
  const fu = d.funding || 'unknown';
  out.funding = pick(fu === 'committed' ? 'L' : fu === 'none' ? 'H' : 'M',
    { committed: 'Funding is in place.', unknown: 'Funding not yet known.', none: 'No funding route yet.' }[fu],
    'Who will fund the build, on what terms, and what happens if it overruns or prices fall before financial close?');
  out.funding.applies = true;
  return out;
}

function depositEvidence(d, D, study) {
  const T = (k, label) => { const t = typical(k); return { label: `${label} (typical across ${t.n} studies)`, value: `${t.median} ${t.unit} (range ${t.low}–${t.high})`, unit: '', source: t.points.map((p) => `${p[0]} p${p[2]}`).join(', '), url: '', flag: 'derived', note: t.note } };
  const ev = [];
  if (study && study.evidence) for (const e of study.evidence) ev.push({ input: true, ...e });
  ev.push(
    { input: true, label: 'Mine plan', value: `${D.planMt.toFixed(1)} Mt at ${D.planGrade.toFixed(2)}% Li₂O`, unit: '', source: d.planMt != null ? 'Your input' : `${pct(d.planShare != null ? d.planShare / 100 : typical('plan_share_of_resource').median / 100, 0)} of resource, plus ${pct((d.dilution != null ? d.dilution : typical('dilution_pct').median) / 100, 1)} dilution`, url: '', flag: d.planMt != null ? 'sourced' : 'derived' },
    { input: true, label: 'Production rate', value: `${D.rate.toFixed(2)} Mtpa`, unit: '', ...(d.rate != null ? { source: 'Your input' } : LI_STUDIES.TAYLOR), url: '', flag: d.rate != null ? 'sourced' : 'derived', note: d.rate != null ? '' : `Taylor’s rule gives a ${D.taylorLife.toFixed(1)}-year life for ${D.planMt.toFixed(1)} Mt.` },
    { input: true, label: 'Mining cost per tonne of ore', value: `US$${D.miningPerTOre.toFixed(2)}`, unit: '/t', source: 'Open pit cost per tonne moved × (1 + strip), blended with underground', url: '', flag: 'derived' },
    { input: true, label: 'Haulage to port', value: `US$${D.logisticsPerT.toFixed(2)}`, unit: 'per t concentrate', source: 'Σ distance × rate by mode, plus port charges', url: '', flag: 'derived', note: D.missingRates.length ? `No rate entered for: ${D.missingRates.join(', ')} (counted as zero).` : '' },
    { input: true, label: 'Initial capex', value: `US$${D.capexM.toFixed(0)}M`, unit: '', source: d.capex != null ? 'Your input' : `Typical capex per tonne of annual capacity × ${D.rate.toFixed(2)} Mtpa${d.plantMode === 'existing' ? ' × 41% for an existing plant (Manna–Nova vs Manna DFS)' : ''}`, url: '', flag: d.capex != null ? 'sourced' : 'derived' },
    { input: true, label: 'Royalties', value: D.royalties.map((r) => `${pct(r.rate, 1)} ${r.name} (${r.base === 'fob' ? 'on FOB value' : 'on gross revenue'})`).join('; ') || 'none entered', unit: '', source: d.royalty != null ? 'Your input' : (D.juris.src ? `${LI_STUDIES[D.juris.src].source}, p${D.juris.page}` : 'Not set'), url: '', flag: d.royalty != null || D.juris.src ? 'sourced' : 'assumption', note: D.juris.note },
    { input: true, label: 'Price received below the SC6 benchmark', value: pct(D.realisation, 1), unit: '', source: d.realisation === 0 ? 'None, as in the study' : d.realisation != null ? 'Your input' : `Typical: ${typical('realisation_discount_pct').points.map((p) => `${p[0]} p${p[2]}`).join(', ')}`, url: '', flag: d.realisation != null ? 'sourced' : 'derived', note: typical('realisation_discount_pct').note },
    { input: true, label: 'Head-office overhead', value: `US$${D.corporateM.toFixed(1)}M a year`, unit: '', source: d.corporate === 0 ? 'None: the study values the project before head-office costs' : d.corporate != null ? 'Your input' : 'Typical: Liontown, Sep Q 2026, Appendix 5B item 1.2(e), p18', url: '', flag: d.corporate != null ? 'sourced' : 'derived', note: 'Runs from 2026 until the mine stops.' },
    { input: true, label: 'Working capital', value: D.wcDays > 0 ? `${D.wcDays} days of revenue in receivables; inventory 30 and payables 45 days of site costs` : 'None', unit: '', source: d.wcDays === 0 ? 'None: the study’s terms were not extracted' : d.wcDays != null ? 'Your input' : 'Assumption: concentrate is paid on provisional and final invoices; inventory and payables as in the Tongon spreadsheet', url: '', flag: d.wcDays != null ? 'sourced' : 'assumption' },
    { input: true, label: 'Income tax', value: pct(D.tax, 1), unit: '', source: d.tax != null ? 'Your input' : `${S.DAM.source} (${D.juris.country})`, url: '', flag: 'sourced' },
    { input: true, label: 'Construction and start', value: `${D.decision} year(s) to a decision, ${D.build}-year build, first production ${D.firstProd}`, unit: '', source: d.decisionYears != null ? 'Your input' : 'Years to decision set from permit status (granted 0, in progress 1, none 2): an assumption', url: '', flag: d.decisionYears != null ? 'sourced' : 'assumption' },
    T('recovery_dms', 'Recovery, DMS'), T('recovery_flotation', 'Recovery, flotation'), T('capex_per_annual_t_ore', 'Capex intensity'), T('road_haul_per_t_km', 'Road haulage rate'), T('ocean_freight', 'Ocean freight')
  );
  const dialEv = [
    { dial: 'resource', label: 'Inferred share of the mine plan', value: pct(D.inferredShare, 0), unit: '', source: 'Deposit inputs', url: '', flag: 'derived', note: 'Studies: Ewoyaa 6%, Manna 18%, Shaakichiuwaanaan PEA 25%, Finniss 2021 2%, Rose 0%.' },
    { dial: 'recovery', label: 'Recovery used', value: `${num1(D.recovery, 1)}%`, unit: '', source: 'Processing inputs', url: '', flag: 'sourced', note: `Typical DMS ${typical('recovery_dms').median}%, flotation ${typical('recovery_flotation').median}%. Kathleen Valley ran at 60–63% in ramp-up (Liontown, Sep Q 2026).` },

    { dial: 'infra', label: 'Haulage to port as a share of concentrate value', value: pct(D.logisticsShare, 0), unit: '', source: 'Haulage inputs', url: '', flag: 'derived', note: 'Ewoyaa about 2% (110 km road), Finniss about 2% (88 km), Shaakichiuwaanaan about 16% (834 km road plus rail).' },
    { dial: 'capex', label: 'Capex contingency in studies', value: `${typical('contingency_pct').median}% median (range ${typical('contingency_pct').low.toFixed(1)}–${typical('contingency_pct').high.toFixed(1)}%)`, unit: '', source: typical('contingency_pct').points.map((p) => `${p[0]} p${p[2]}`).join(', '), url: '', flag: 'derived', note: 'PEA about 21%; feasibility studies 7–10%. Finniss: capex doubled and haulage per tonne nearly tripled between its 2021 DFS and 2025 restart study.' },
    { dial: 'capex', label: 'Capex growth from scoping to feasibility (Shaakichiuwaanaan)', value: 'Total development capex CA$1,374M → CA$1,978M (+44%); Phase 1 CA$870M → CA$1,349M (+55%)', unit: '', source: 'Shaakichiuwaanaan PEA (Aug 2024) pp.2, 12; feasibility study (Oct 2025) pp.2, 7', url: '', flag: 'derived', note: 'Contingency fell from 24% to 11% as the estimate matured, yet the total still rose 44% (scope changed too). One case: a scoping-level number can grow by more than the High setting’s +35%.' },
    { dial: 'political', label: 'Country risk premium', value: pct(D.crp, 2), unit: '', source: `${S.DAM.source}: ${D.juris.country}, ${D.crpBasis}`, url: S.DAM.url, flag: 'sourced' }
  ];
  return ev.concat(dialEv);
}

function depositAsset(d, id, opts = {}) {

  const methodLabel = { op: 'Open pit', ug: 'Underground', opug: 'Open pit, then underground' }[d.method] || 'Open pit';
  const deckOverride = d.deckOverride ? { id: 'studydeck', label: 'Study deck', prices: {}, flat: d.deckOverride.flat, byProdYear: d.deckOverride.byProdYear, desc: d.deckOverride.desc, source: d.deckOverride.source, url: '', flag: 'sourced' } : null;
  return {
    id, name: d.name, country: D.juris.country, region: D.juris.label, commodity: 'spodumene', stage: 'deposit', metal: 'Lithium (spodumene)', method: methodLabel,
    owners: [{ name: opts.ownerName || 'You', share: d.ownership }], ownerShare: d.ownership, stateStake: D.carry, freeCarry: D.carry,
    ownerLabel: `${pct(d.ownership, 0)} owner${D.carry ? `, ${pct(D.carry, 0)} state free carry` : ''}`,

    processing: { recovery: D.recovery / 100, concGrade: D.concGrade, payability: 1, realisation: 1 - D.realisation },
    resolved: { split: { mining: D.miningPerTOre, processing: D.processing, transport: D.oreHaulPerT, ga: D.ga }, sustainingPerT: 0, sustainingPerUnit: D.sustaining,
      growthCapex: {}, devCapex: D.devCapex, corporatePerOz: 0, corporateFixed: D.corporateM * 1e6, explorationPerOz: 0, haulagePerT: 0, logisticsPerUnit: D.logisticsPerT, otherPerUnit: d.otherPerT || 0,
      freightPerUnit: D.freight, byproductPerUnit: d.byproduct || 0, calibration: null },

      wc: D.wcDays > 0 ? { receivableDays: D.wcDays, inventoryDays: 30, payableDays: 45 } : { receivableDays: 0, inventoryDays: 0, payableDays: 0 }, wcReleaseHorizon: null, lossCarryForward: true, openingLosses: (d.openingLosses || 0) * 1e6 },
    wht: (d.wht || 0) / 100,

    crp: { value: D.crp, label: `${D.juris.country} (${D.crpBasis})`, ...S.DAM, flag: 'sourced', note: `${D.juris.country}’s row in Damodaran’s January 2026 file.` },
    dialDefaults: depositDialDefaults(d, D),
    evidence: depositEvidence(d, D, opts.study),
    events: opts.study && opts.study.events ? opts.study.events : [],
    deposit: d, derived: D, study: opts.study || null, deckOverride
  };
}

// The deposit the user is screening. It starts as a copy of the Manna example, clearly labelled, until the user changes it.
const DEP_STORE = 'mre-deposit-v1';
// An example loaded into the steps becomes your own deposit: the owner-level costs the study left out return to their typical values.
function toMyDeposit(d, name) { return { ...JSON.parse(JSON.stringify(d)), name, deckOverride: null, corporate: null, wcDays: null, realisation: null }; }
function loadDep() {
  try { const t = localStorage.getItem(DEP_STORE); if (t) return JSON.parse(t); } catch (e) { /* storage unavailable */ }

  else if (f.type === 'bool') control = `<select id="${id}" data-dep="${key}" data-type="bool">${OPT.yesno.map(([o, tx]) => `<option value="${o}" ${(v ? 'yes' : 'no') === o ? 'selected' : ''}>${tx}</option>`).join('')}</select>`;
  else if (f.type === 'sel') {
    const cur = Array.isArray(v) ? 'custom' : String(v);
    const odd = cur !== 'custom' && !f.opts.some(([o]) => o === cur);   // a study value that is not one of the options, e.g. SC5.8
    control = `<select id="${id}" data-dep="${key}" data-type="${f.num ? 'numsel' : 'sel'}">${f.opts.map(([o, tx]) => `<option value="${o}" ${cur === o ? 'selected' : ''}>${tx}</option>`).join('')}${cur === 'custom' ? '<option value="custom" selected>From the study</option>' : ''}${odd ? `<option value="${esc(cur)}" selected>${esc(f.oddLabel ? f.oddLabel(cur) : cur)}</option>` : ''}</select>`;
  } else if (f.type === 'juris') {
    control = `<select id="${id}" data-dep="juris" data-type="sel"><optgroup label="Presets from studies">${LI_JURIS.map((j) => `<option value="${j.id}" ${v === j.id ? 'selected' : ''}>${esc(j.label)}</option>`).join('')}</optgroup>
      <optgroup label="Other countries">${COUNTRY_RISK.map((r) => `<option value="${esc(r[0])}" ${v === r[0] ? 'selected' : ''}>${esc(r[0])}</option>`).join('')}</optgroup></select>`;
  } else if (f.type === 'deck') control = `<select id="${id}" data-dep-deck="1">${Object.values(LITHIUM_DECKS).map((k) => `<option value="${k.id}" ${state.deckBy.spodumene === k.id ? 'selected' : ''}>${esc(k.label)}</option>`).join('')}</select>`;
  else if (f.type === 'rate') control = `<input id="${id}" data-dep-rate="1" type="number" step="0.5" min="0" max="20" inputmode="decimal" value="${(state.rateBy.spodumene * 100).toFixed(1)}">`;
  else if (f.type === 'lt') { const own = LITHIUM_DECKS[state.deckBy.spodumene] || LITHIUM_DECKS.req; control = `<input id="${id}" data-dep-lt="1" type="number" step="any" min="0" inputmode="decimal" value="${state.lt.spodumene ?? ''}" placeholder="${Math.round(own.flat)}">`; }
  else if (f.type === 'pct') control = `<input id="${id}" data-dep="${key}" data-type="pct" type="number" step="any" min="0" max="100" inputmode="decimal" value="${v != null ? +(v * 100).toFixed(4) : ''}">`;
  else control = `<input id="${id}" data-dep="${key}" data-type="num" type="number" step="any" inputmode="decimal" value="${v ?? ''}" placeholder="${esc(String(blankValue(key, d, D, t)))}">`;
  return `<div class="c-f" id="row-${key}"><label for="${id}">${esc(f.label)}${fieldInfo(key, f, d, t, v)}</label><div class="c-in">${control}${f.unit ? `<span class="u">${esc(f.unit)}</span>` : ''}</div></div>`;
}
