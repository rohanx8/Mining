<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mining Risk Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Price a new spodumene mine: enter what you know, typical values from published studies fill the rest, standard risk settings take their share, and sliders show what moves the value.">
<style>
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #eaeef2;
  --ink: #111519;
  --ink-2: #434d58;
  --muted: #66707b;
  --line: #d9dfe5;
  --line-strong: #b6c0ca;
  --accent-fill: #d99a14;   /* gold: the "now" line, the logo */
  --accent-soft: #f6ebcf;
  --gain: #2a78d6;
  --loss: #e34948;
  --total: #5d6874;
  --ok-ink: #0a6b0a;  --ok-bg: #e2f2e2;
  --der-ink: #1d5fae; --der-bg: #e1ecfa;
  --asm-ink: #7f4c00; --asm-bg: #fbecca;
  --bad-ink: #b3261e; --bad-bg: #fbe3e1;
  --focus: #2a78d6;
  --shadow: 0 1px 2px rgba(17, 21, 25, .06), 0 6px 18px rgba(17, 21, 25, .06);
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1114; --surface: #161a1f; --surface-2: #1f252b; --ink: #eef1f4; --ink-2: #b9c1ca; --muted: #8d97a1;
    --line: #2a3138; --line-strong: #3d4650; --accent-fill: #d9a12a; --accent-soft: #3a2f17;
    --gain: #3987e5; --loss: #e66767; --total: #8f9aa6;
    --ok-ink: #6fd56f; --ok-bg: #15301a; --der-ink: #8fbcf2; --der-bg: #16263a; --asm-ink: #f2c564; --asm-bg: #362912;
    --bad-ink: #ff9e95; --bad-bg: #3b1a18; --focus: #6aa8f0; --shadow: 0 1px 2px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1114; --surface: #161a1f; --surface-2: #1f252b; --ink: #eef1f4; --ink-2: #b9c1ca; --muted: #8d97a1;
  --line: #2a3138; --line-strong: #3d4650; --accent-fill: #d9a12a; --accent-soft: #3a2f17;
  --gain: #3987e5; --loss: #e66767; --total: #8f9aa6;
  --ok-ink: #6fd56f; --ok-bg: #15301a; --der-ink: #8fbcf2; --der-bg: #16263a; --asm-ink: #f2c564; --asm-bg: #362912;
  --bad-ink: #ff9e95; --bad-bg: #3b1a18; --focus: #6aa8f0; --shadow: 0 1px 2px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

/* ---------- Base ---------- */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--bar-h, 132px) + 12px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
a { color: var(--der-ink); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.neg { color: var(--bad-ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 6px 13px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13.5px; font-weight: 650; cursor: pointer; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.link-btn { border: 0; background: none; padding: 0; color: var(--der-ink); font-weight: 650; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: inherit; }
.pill { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.flag-sourced { background: var(--ok-bg); color: var(--ok-ink); }
.flag-derived { background: var(--der-bg); color: var(--der-ink); }

/* ---------- Top bar and value bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.c-top { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; font-weight: 750; font-size: 15.5px; letter-spacing: -.01em; }
.brand svg { flex: none; }
.brand > span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.brand small { display: block; overflow: hidden; text-overflow: ellipsis; font-weight: 500; font-size: 11.5px; color: var(--muted); letter-spacing: 0; }
select.c-start { margin-left: auto; flex: none; min-height: 36px; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 650; cursor: pointer; }
.c-valuebar { border-top: 1px solid var(--line); }
.c-vb { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 26px; padding-block: 8px 10px; }
.c-kpi { display: grid; min-width: 0; }
.c-kpi .k { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650; color: var(--muted); }
.c-kpi b { font-size: 1.08rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.c-kpi-main b { font-size: 1.65rem; letter-spacing: -.02em; line-height: 1.1; }
.c-delta { font-size: 12px; font-weight: 700; color: var(--ok-ink); font-variant-numeric: tabular-nums; }
.c-delta.neg { color: var(--bad-ink); }
.c-delta:empty { display: none; }

/* ---------- Layout ---------- */
main.c-main { display: grid; gap: 16px; padding-block: 16px 24px; }
@media (min-width: 980px) { main.c-main { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; } }
.c-inputs, .c-tinker { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.c-ph { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.c-ph h2, details.c-cash > summary h2 { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; }
.c-foot { padding-block: 0 28px; font-size: 12.5px; color: var(--muted); }

/* ---------- Folding groups: the inputs and the cash flow ---------- */
details.c-sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
details.c-sec > summary, details.c-cash > summary { list-style: none; cursor: pointer; }
details.c-sec > summary::-webkit-details-marker, details.c-cash > summary::-webkit-details-marker { display: none; }
details.c-sec > summary::after, details.c-cash > summary::after { content: ""; flex: none; width: 7px; height: 7px; margin-right: 4px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); align-self: center; transition: transform .15s ease; }
details.c-sec[open] > summary::after, details.c-cash[open] > summary::after { transform: rotate(-135deg); }
details.c-sec > summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 4px 12px; padding: 12px 14px; }
details.c-cash > summary { display: flex; align-items: center; justify-content: space-between; }
details.c-cash[open] > summary { margin-bottom: 10px; }
.c-sec-t { font-weight: 750; font-size: 15px; }
.c-sec-s { font-size: 12.5px; color: var(--muted); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-sec-b { padding: 0 14px 10px; }

/* ---------- Input rows: label, then the box and its unit ---------- */
.c-f { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 220px); align-items: center; gap: 4px 12px; padding: 6px 0; border-top: 1px solid var(--line); }
.c-f.wide { grid-template-columns: minmax(0, 1fr); }
.c-fl { font-size: 13.5px; line-height: 1.35; }
.c-fl .c-i { margin-left: 6px; vertical-align: -3px; }
.c-in { display: grid; grid-template-columns: minmax(0, 1fr) 62px; align-items: center; gap: 6px; }
.c-in > select, .c-in > input[type="text"] { grid-column: 1 / -1; }
.c-in input, .c-in select, table.res input, table.res select { width: 100%; min-width: 0; min-height: 34px; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--ink); font-size: 14px; }
.c-in input::placeholder, table.res input::placeholder { color: var(--muted); opacity: 1; }
.u { font-size: 11.5px; line-height: 1.2; color: var(--muted); }
.c-warn { margin-top: 6px; font-size: 12.5px; color: var(--bad-ink); }
table.res input, table.res select { min-width: 72px; }
table.res td, table.res th { text-align: left; }
table.res thead th { white-space: normal; }

/* ---------- "i" buttons and their popover ---------- */
.c-i { position: relative; flex: none; display: inline-grid; place-items: center; width: 17px; height: 17px; padding: 0; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); font: italic 700 11px/1 Georgia, "Times New Roman", serif; cursor: pointer; }
.c-i::after { content: ""; position: absolute; inset: -7px; }   /* a bigger target than it looks */
.c-i:hover, .c-i[aria-expanded="true"] { color: var(--ink); border-color: var(--ink-2); }
.c-pop { position: absolute; z-index: 90; display: grid; gap: 6px; padding: 10px 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); font-size: 13px; line-height: 1.45; max-height: min(70vh, 460px); overflow-y: auto; }

/* ---------- Risks and what-ifs: a name, a slider, an amount ---------- */
.c-panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.c-sl { display: grid; grid-template-columns: minmax(150px, 200px) minmax(0, 1fr) 84px; align-items: center; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.c-sl-head { border-top: 0; padding: 0 0 2px; font-size: 11.5px; font-weight: 650; color: var(--muted); }
.c-sl-head .c-sl-v { font-size: 11.5px; font-weight: 650; }
.c-sl-t { display: grid; gap: 1px; min-width: 0; }
.c-sl-n { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 650; }
.c-sl-f { font-size: 13px; line-height: 1.3; }
.c-sl-f b { font-weight: 750; font-variant-numeric: tabular-nums; }
.c-sl-f .muted { font-size: 12px; }
.c-track { display: grid; grid-template-columns: 62px minmax(0, 1fr) 62px; align-items: center; gap: 8px; min-width: 0; }
.c-end { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-track > .c-end:first-child { text-align: right; }
.c-mid { text-align: center; }
.c-sl-v { text-align: right; font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.c-sl-v.neg { color: var(--bad-ink); }
.c-sl-v.pos { color: var(--ok-ink); }
.c-chart { position: relative; flex: none; display: inline-grid; place-items: center; width: 20px; height: 18px; padding: 0; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); cursor: pointer; }
.c-chart::after { content: ""; position: absolute; inset: -6px; }   /* a bigger target than it looks */
.c-chart:hover { color: var(--ink); border-color: var(--ink-2); }
input.lvl, input.c-range { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: pointer; }
input.lvl { --c: var(--asm-ink); }
input.lvl.L { --c: var(--ok-ink); }
input.lvl.H { --c: var(--bad-ink); }
input.lvl:disabled { opacity: .4; cursor: not-allowed; }
input.lvl:focus-visible, input.c-range:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
input.lvl::-webkit-slider-runnable-track { box-sizing: content-box; height: 6px; border-radius: 4px; border: 1px solid var(--line-strong); background: linear-gradient(90deg, var(--ok-bg), var(--asm-bg) 50%, var(--bad-bg)); }
input.lvl::-moz-range-track { box-sizing: content-box; height: 6px; border-radius: 4px; border: 1px solid var(--line-strong); background: linear-gradient(90deg, var(--ok-bg), var(--asm-bg) 50%, var(--bad-bg)); }
input.c-range::-webkit-slider-runnable-track { box-sizing: content-box; height: 4px; border-radius: 3px; border: 1px solid var(--line-strong); background: var(--surface-2); }
input.c-range::-moz-range-track { box-sizing: content-box; height: 4px; border-radius: 3px; border: 1px solid var(--line-strong); background: var(--surface-2); }
input.lvl::-webkit-slider-thumb, input.c-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; box-sizing: border-box; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: var(--c, var(--ink)); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong), 0 1px 3px rgba(0, 0, 0, .3); }
input.c-range::-webkit-slider-thumb { margin-top: -9px; }
input.lvl::-moz-range-thumb, input.c-range::-moz-range-thumb { box-sizing: border-box; width: 22px; height: 22px; border-radius: 50%; background: var(--c, var(--ink)); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong), 0 1px 3px rgba(0, 0, 0, .3); }
.c-pick { font-size: 13px; font-weight: 650; }
.c-pick-sel { min-height: 36px; max-width: 100%; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 14px; }
tr.c-now > * { background: var(--accent-soft); font-weight: 700; }
.c-expand { gap: 6px; min-height: 32px; padding: 3px 10px; font-size: 13px; }
.c-dl { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }
.c-dl-k { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.c-kn { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 14px; margin: 6px 0 0; }
.c-kn > div { display: grid; align-content: start; gap: 1px; min-width: 0; padding-top: 8px; border-top: 1px solid var(--line); }
.c-kn dt { font-size: 12px; font-weight: 650; color: var(--muted); }
.c-kn dd { display: grid; gap: 1px; margin: 0; }
.c-kn b { font-size: 1.05rem; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.25; }
.c-kn small { font-size: 11.5px; line-height: 1.3; color: var(--muted); }
.c-kv2 { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.c-deal-range { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin: 2px 0 4px; font-size: 13px; }
.c-deal-range b { font-size: 1.3rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.f-band { fill: var(--accent-soft); }
.f-range { fill: var(--total); opacity: .5; }
.c-sheet-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.c-sheet-bar fieldset.seg { margin: 0; }
.c-st-wrap { max-height: min(62vh, 560px); overflow: auto; }   /* the headings stay in view as the rows scroll */
.c-st-wrap thead th { position: sticky; top: 0; z-index: 2; }
.c-st-wrap thead th:first-child { z-index: 3; }
table.c-st th[scope="row"] { font-weight: 650; }
dialog.sheet.wide { width: min(1100px, calc(100vw - 24px)); }

/* ---------- Segmented control ---------- */
fieldset.seg { border: 0; margin: 2px 0 8px; padding: 2px; min-width: 0; max-width: 100%; display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--surface-2); border-radius: 9px; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.seg label { display: flex; align-items: center; justify-content: center; min-height: 34px; padding: 4px 11px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 650; color: var(--ink-2); line-height: 1.15; text-align: center; }
.seg input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-strong), 0 1px 2px rgba(0, 0, 0, .06); }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------- Charts ---------- */
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw-before { background: var(--total); }
.sw-after { background: var(--ink); }
.t-ink { fill: var(--ink); }
.t-muted { fill: var(--muted); }
.f-gain { fill: var(--gain); }
.f-loss { fill: var(--loss); }
.f-after { fill: var(--ink); }
.s-grid { stroke: var(--line); }
.s-axis { stroke: var(--line-strong); }
.s-gold { stroke: var(--accent-fill); }
.s-before { stroke: var(--total); }
.s-after { stroke: var(--ink); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }   /* row labels stay put while the table scrolls */
thead th { font-size: 12px; color: var(--muted); font-weight: 700; background: var(--surface); }
tbody tr:last-child > * { border-bottom: 0; }
tr.strong td { font-weight: 750; }
tr.sep td { border-top: 2px solid var(--line-strong); }
td.wrap-cell, th.wrap-cell { white-space: normal; min-width: 150px; text-align: left; }
.cmp th, .cmp td { text-align: left; }
.cmp td.n { text-align: right; }
table.mv-grid th[scope="colgroup"] { text-align: center; }
table.mv-grid td.neg { color: var(--bad-ink); }
table.mv-grid td.cur { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 750; }

/* ---------- Sheet (Data, Checks, Sources) ---------- */
dialog.sheet { border: 1px solid var(--line-strong); border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: min(86vh, 900px); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
dialog.sheet::backdrop { background: rgba(10, 14, 18, .45); }
.sheet-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-body { padding: 16px; display: grid; gap: 14px; overflow-wrap: anywhere; }
.sheet-body h3 { margin-top: 4px; }
.c-assume li { margin-bottom: 4px; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; font-size: 13.5px; }
.kv > :nth-child(even) { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.ev-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ev-list li { display: grid; gap: 2px; font-size: 13px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.ev-list li:last-child { border-bottom: 0; padding-bottom: 0; }
.ev-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 8px; align-items: baseline; }
.ev-val { font-weight: 700; }
.ev-src { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.checks-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.checks-list li { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.checks-list .res { font-weight: 800; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; }
.res-pass { background: var(--ok-bg); color: var(--ok-ink); }
.res-fail { background: var(--bad-bg); color: var(--bad-ink); }
details.more { border-top: 1px solid var(--line); padding-top: 10px; }
details.more > summary { cursor: pointer; font-weight: 650; color: var(--der-ink); font-size: 13.5px; list-style-position: inside; }
details.more[open] > summary { margin-bottom: 10px; }

<script>
'use strict';
/* =====================================================================
   1. DATA: model constants, price decks, the ten standard risks, and
      the two gold mines the checks run against.
   ===================================================================== */
const G_PER_OZ = 31.1034768;

const MODEL = {
  firstYear: 2026,                 // valuation date 1 Jan 2026; cash flows dated 31 Dec, discounted by actual days ÷ 365 (Excel XNPV, as in the Tongon spreadsheet)
  valuationUTC: Date.UTC(2026, 0, 1),

};

const PRICE_DECKS = {

  consensus: { id: 'consensus', label: 'Consensus', prices: { 2026: 4150, 2027: 4650, 2028: 4500, 2029: 4500, 2030: 4500 }, flat: 4500, desc: 'US$4,150 (2026), 4,650 (2027), then 4,500 flat', source: 'Goldman Sachs end-2026 and end-2027 forecasts (5 and 14 Nov 2026) via Golden Ark Reserve; US$4,500 from 2028 is an assumption', url: 'https://goldenarkreserve.com/insights/gold-price-forecast-november-2026/', flag: 'assumption' },

};

// Spodumene concentrate, SC6 (6% Li2O), US$/t, CIF China basis unless stated.
const LITHIUM_DECKS = {
  req:      { id: 'req', label: 'Forecast', prices: { 2026: 2411, 2027: 2287, 2028: 2100, 2029: 1813, 2030: 1615, 2031: 1498 }, flat: 1498, desc: 'REQ Sep 2026 real forecast: US$2,411/t (2026) falling to US$1,498/t (2031), then flat', source: 'Department of Industry, Science and Resources, Resources and Energy Quarterly, Sep 2026, Table 14.1 (real 2026 US$); flat after 2031 is an assumption', url: 'https://www.industry.gov.au/publications/resources-and-energy-quarterly', flag: 'sourced' },
  spot:     { id: 'spot', label: 'Spot', prices: {}, flat: 2105, desc: 'US$2,105/t SC6 flat', source: 'Fastmarkets spodumene min 6% Li2O CIF China, Jul–Sep 2026 trading-day average, as reported by Liontown (29 Oct 2026, p2)', url: '', flag: 'sourced' },
  study:    { id: 'study', label: 'Study LT', prices: {}, flat: 1620, desc: 'US$1,620/t SC6 flat', source: 'Long-term price in PLS’s P2000 feasibility study (PLS quarterly report, 28 Oct 2026, p3)', url: '', flag: 'sourced' },
  downside: { id: 'downside', label: 'Downside', prices: {}, flat: 817, desc: 'US$817/t SC6 flat, the 2025 average in real terms', source: 'REQ Sep 2026, Table 14.1: 2025 average, real 2026 US$ (the last trough)', url: '', flag: 'sourced' }
};
const DECKS = { gold: PRICE_DECKS, spodumene: LITHIUM_DECKS };
const UNITS = {
  gold: { u: 'oz', k: 'koz', price: 'US$/oz', product: 'payable gold', priceName: 'gold price', grade: 'g/t', containedName: 'gold in the mine plan', basis: '', perUnit: 'per ounce' },
  spodumene: { u: 't', k: 'kt', price: 'US$/t', product: 'concentrate', priceName: 'spodumene price (SC6)', grade: '% Li₂O', containedName: 'lithia in the mine plan, counted as SC6 concentrate', basis: ' SC6', perUnit: 'per tonne of concentrate' }
};
let UCTX = 'gold';   // units used by the formatters while one asset's content is rendered
const UN = () => UNITS[UCTX];
const cap1 = (t) => t.charAt(0).toUpperCase() + t.slice(1);

const LEVELS = ['L', 'M', 'H'];
const LEVEL_NAME = { L: 'Low', M: 'Medium', H: 'High' };

// The ten standard risks, in the order their amounts are added up (discount rate last). Every number here is a starting assumption.
const DIALS = [
  { id: 'resource', name: 'Resource and grade', short: 'Resource', question: 'How sure are we about the tonnes and grade?',
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Grade −5%, mine life −10%', fx: { grade: -0.05, life: -0.10 } }, H: { text: 'Grade −10%, mine life −25%', fx: { grade: -0.10, life: -0.25 } } } },
  { id: 'recovery', name: 'Recovery', short: 'Recovery', question: 'Will the plant get the metal out?',
    levels: { L: { text: 'Recovery −1 point', fx: { recPts: -1 } }, M: { text: 'Recovery −4 points', fx: { recPts: -4 } }, H: { text: 'Recovery −12 points', fx: { recPts: -12 } } } },
  { id: 'ground', name: 'Ground and mining', short: 'Ground', question: 'How hard is it to mine?',
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Mining cost +5%', fx: { mining: 0.05 } }, H: { text: 'Mining cost +15%, plus a 5% yearly chance of a two-month stoppage', fx: { mining: 0.15, events: [{ p: 0.05, months: 2 }] } } } },
  { id: 'infra', name: 'Infrastructure', short: 'Infrastructure', question: 'Can it get power, water and supplies reliably?',
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Processing and G&A +5%', fx: { procGa: 0.05 } }, H: { text: 'Processing and G&A +10%, plus a 2% yearly chance of a one-month outage', fx: { procGa: 0.10, events: [{ p: 0.02, months: 1 }] } } } },
  { id: 'people', name: 'People and operator', short: 'People', question: 'Have they done this before?',
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Site costs +5%', fx: { site: 0.05 } }, H: { text: 'Site costs +10%; deposits also ramp up six months slower', fx: { site: 0.10, depositDelay: 0.5 } } } },
  { id: 'capex', name: 'Capex and schedule', short: 'Capex', question: 'Will it be built on budget and on time?', depositsOnly: true,
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Capex +15%, six months late', fx: { capex: 0.15, depositDelay: 0.5 } }, H: { text: 'Capex +35%, twelve months late', fx: { capex: 0.35, depositDelay: 1 } } } },
  { id: 'funding', name: 'Funding', short: 'Funding', question: 'Can the owner pay for the build?', depositsOnly: true,
    levels: { L: { text: 'No change', fx: {} }, M: { text: 'Financing costs of 10% of capex, six months late', fx: { finCost: 0.10, depositDelay: 0.5 } }, H: { text: 'Financing costs of 20% of capex, a year late', fx: { finCost: 0.20, depositDelay: 1 } } } },
  { id: 'fiscal', name: 'Fiscal and legal', short: 'Fiscal', question: 'Will the rules change?',
    levels: { L: { text: 'No change', fx: {} }, M: { text: '25% chance of a two-point royalty rise within three years', fx: { royaltyPts: 2, royaltyProb: 0.25 } }, H: { text: '50% chance of a two-point royalty rise and the state stake going to 30%', fx: { royaltyPts: 2, royaltyProb: 0.5, stateTo: 0.30, stateProb: 0.5 } } } },
  { id: 'community', name: 'Community and environment', short: 'Community', question: 'Will people and regulators let it run?',
    levels: { L: { text: 'No change', fx: {} }, M: { text: '3% yearly chance of a one-month blockade', fx: { events: [{ p: 0.03, months: 1 }] } }, H: { text: '10% yearly chance of a three-month blockade; deposits also get a one-year permit delay', fx: { events: [{ p: 0.10, months: 3 }], depositDelay: 1 } } } },
  { id: 'political', name: 'Political and security', short: 'Political', question: 'Could the country stop the mine?',
    levels: { L: { text: 'Half the country risk premium', fx: { crpMult: 0.5 } }, M: { text: 'The full country risk premium', fx: { crpMult: 1 } }, H: { text: '1.5× the country risk premium', fx: { crpMult: 1.5 } } } }
];

// A risk can sit anywhere from Low (0) to High (2) in quarter steps. A step between two stated settings blends them
// in a straight line. For a chance of an event, the chance blends and the size of the event stays, so the expected
// effect is a straight line too. Nothing beyond the stated Low, Medium and High settings is invented.
const LEVEL_NUM = { L: 0, M: 1, H: 2 };
const levelNum = (v) => (typeof v === 'number' && isFinite(v) ? Math.max(0, Math.min(2, v)) : (LEVEL_NUM[v] ?? 1));
const levelName = (x) => (x === 0 ? 'Low' : x === 1 ? 'Medium' : x === 2 ? 'High' : x < 1 ? 'Low to Medium' : 'Medium to High');
function fxAt(dial, x) {
  if (Number.isInteger(x)) return dial.levels[LEVELS[x]].fx;
  const i = Math.floor(x); const t = x - i;
  const a = dial.levels[LEVELS[i]].fx; const b = dial.levels[LEVELS[i + 1]].fx;
  const out = {};
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) {
    if (k === 'events') out.events = [...(a.events || []).map((e) => ({ ...e, p: e.p * (1 - t) })), ...(b.events || []).map((e) => ({ ...e, p: e.p * t }))];
    else if (k === 'royaltyPts' || k === 'stateTo') out[k] = b[k] ?? a[k];   // the size of the change; its chance blends
    else out[k] = (a[k] || 0) * (1 - t) + (b[k] || 0) * t;
  }
  return out;
}

// Source records, spread into evidence items so each carries {source, url}.
// Two operating gold mines, kept as test cases for the engine (the Checks): Tongon reconciles to its spreadsheet,
// Tropicana to its guidance. Their sources and assumptions are listed in the README.
const startAt = (lv) => Object.fromEntries(Object.entries(lv).map(([k, v]) => [k, { level: v }]));
const ASSETS = [
  {
    id: 'tropicana', name: 'Tropicana', stage: 'operating', ownerShare: 1.0, stateStake: 0,
    schedule: {
      kind: 'sources', startYear: 2026, millRate: 9.3, groupCaps: { ug: 2.0, op: 4.3 },
      sources: [
        { id: 'ug', tonnes: 9.3, grade: 2.9, group: 'ug', priority: 1 },
        { id: 'op', tonnes: 14.4, grade: 1.7, group: 'op', priority: 2 },
        { id: 'sp', tonnes: 15.1, grade: 0.5, priority: 4 }
      ],
      extension: { maxYears: 5, ugRate: 2.0, ugGrade: 2.4, fillGrade: 0.5, ugPriority: 3, fillPriority: 5 }
    },
    processing: { recovery: 0.896, payability: 0.999 },
    costs: {
      calibrate: {
        aiscLowLocal: 2630, aiscHighLocal: 2950, fx: 0.70, realisedLocal: 6088,
        sustainingQuarterLocal: { devAndWaste: 17, plantEquip: 6 }, quarterShare: 0.30,
        growth: { year: 2026, lowLocal: 15, highLocal: 25, share: 0.30 },
        splitFrom: 'tongon'
      },
      corporatePerOz: 0, explorationPerOz: 0
    },
    fiscal: {
      royalties: [{ name: 'WA state gold royalty', rate: 0.025 }],
      taxRate: 0.30, taxBase: 500e6, closure: 100e6,
      wc: { receivableDays: 5, inventoryDays: 30, payableDays: 45 }, wcReleaseHorizon: null
    },
    stream: null, transaction: null,
    crp: { value: 0 },
    dialDefaults: startAt({ resource: 'L', recovery: 'L', ground: 'M', infra: 'L', people: 'L', capex: 'L', fiscal: 'L', community: 'L', political: 'L' })
  },
  {
    id: 'tongon', name: 'Tongon', stage: 'operating', ownerShare: 0.897, stateStake: 0.10,
    schedule: {
      kind: 'fixed',
      rows: [{ year: 2026, ore: 4.0, grade: 1.20 }, { year: 2027, ore: 4.0, grade: 1.17 }, { year: 2028, ore: 4.0, grade: 1.13 }, { year: 2029, ore: 4.0, grade: 1.10 }],
      extension: { rows: [{ year: 2030, ore: 4.0, grade: 1.05 }] }
    },
    processing: { recovery: 0.82, payability: 0.999 },
    costs: {
      split: { mining: 23.00, processing: 21.50, transport: 0.50, ga: 14.50 },
      corporatePerOz: 15, explorationPerOz: 25, sustainingPerT: 7.50, growthCapex: {}, devCapex: {}
    },
    fiscal: {
      royalties: [{ name: 'Ad valorem royalty', rate: 0.08 }, { name: 'Local development fund', rate: 0.005 }],
      taxRate: 0.25, taxBase: 150e6, closure: 40e6,
      wc: { receivableDays: 5, inventoryDays: 30, payableDays: 45 }, wcReleaseHorizon: 2030
    },
    stream: { holderPayment: 0.005, tiers: [{ upTo: 400000, rate: 0.0358 }, { upTo: 600000, rate: 0.0293 }, { upTo: null, rate: 0.0081 }] },
    transaction: { upfront: 192e6, contingentTotal: 113e6, contingentPaidShare: 0.5, contingentYears: [2026, 2027, 2028] },
    crp: { value: 0.038953 },
    dialDefaults: startAt({ resource: 'M', recovery: 'M', ground: 'M', infra: 'L', people: 'M', capex: 'L', fiscal: 'M', community: 'M', political: 'M' })
  }
];

/* =====================================================================
   2. ENGINE. Pure functions: inputs in, outputs out. No DOM access.
   ===================================================================== */
const sum = (arr, f = (x) => x) => arr.reduce((s, x) => s + f(x), 0);

function deckPrice(deck, year) {
  return deck.prices[year] != null ? deck.prices[year] : deck.flat;
}

// Calibrate unit costs where they are not public (Tropicana) and resolve everything into one cost object.
function resolveCosts(asset, all) {
  const c = asset.costs;
  if (c.split) {
    return { split: { ...c.split }, sustainingPerT: c.sustainingPerT, growthCapex: { ...(c.growthCapex || {}) }, devCapex: { ...(c.devCapex || {}) },
      corporatePerOz: c.corporatePerOz || 0, explorationPerOz: c.explorationPerOz || 0, haulagePerT: c.haulagePerT || 0, calibration: null };
  }
  const k = c.calibrate;
  const y1 = buildSchedule(asset, 0)[0];
  const tonnes1 = y1.ore * 1e6;
  const oz1 = tonnes1 * y1.grade / G_PER_OZ * asset.processing.recovery * asset.processing.payability;
  const aiscLocal = (k.aiscLowLocal + k.aiscHighLocal) / 2;
  const aiscUS = aiscLocal * k.fx;
  const royRate = sum(asset.fiscal.royalties, (r) => r.rate);
  const royUSperOz = royRate * k.realisedLocal * k.fx;
  const sustLocal = (k.sustainingQuarterLocal.devAndWaste + k.sustainingQuarterLocal.plantEquip) * 4 / k.quarterShare;
  const sustUS = sustLocal * 1e6 * k.fx;
  const corp = c.corporatePerOz || 0;
  const expl = c.explorationPerOz || 0;
  const siteCostPerT = (aiscUS * oz1 - royUSperOz * oz1 - sustUS - (corp + expl) * oz1) / tonnes1;
  const ref = all.find((a) => a.id === k.splitFrom).costs.split;
  const refTot = ref.mining + ref.processing + ref.transport + ref.ga;
  const split = {};
  for (const key of ['mining', 'processing', 'transport', 'ga']) split[key] = siteCostPerT * ref[key] / refTot;
  const growth = { ...(c.growthCapex || {}) };
  if (k.growth) growth[k.growth.year] = (k.growth.lowLocal + k.growth.highLocal) / 2 / k.growth.share * k.fx * 1e6;
  return { split, sustainingPerT: sustUS / tonnes1, growthCapex: growth, devCapex: { ...(c.devCapex || {}) },
    corporatePerOz: corp, explorationPerOz: c.explorationPerOz || 0, haulagePerT: 0,
    calibration: { oz1, tonnes1, aiscLocal, aiscUS, royUSperOz, sustLocal, sustUS, siteCostPerT, fx: k.fx, growthUS: growth[k.growth.year], growthYear: k.growth.year } };
}

// Production schedule before any dial: [{year, ore (Mt), grade (g/t)}]
function buildSchedule(asset, ext, trimYears = 0) {
  const s = asset.schedule;
  let rows = [];
  if (s.kind === 'fixed') {
    rows = s.rows.map((r) => ({ year: r.year, ore: r.ore, grade: r.grade }));
    if (ext && s.extension) rows = rows.concat(s.extension.rows.map((r) => ({ year: r.year, ore: r.ore, grade: r.grade })));
  } else if (s.kind === 'sources') {
    const src = s.sources.map((x) => ({ ...x, left: x.tonnes }));
    const n = Math.max(0, Math.min(ext || 0, s.extension ? s.extension.maxYears : 0));
    if (n > 0) {
      const e = s.extension;
      src.push({ id: 'ugx', left: e.ugRate * n, grade: e.ugGrade, group: 'ug', priority: e.ugPriority });
      src.push({ id: 'fill', left: (s.millRate - e.ugRate) * n, grade: e.fillGrade, priority: e.fillPriority });
    }
    src.sort((a, b) => a.priority - b.priority);
    let year = s.startYear;
    while (src.some((x) => x.left > 1e-9) && rows.length < 80) {
      let mill = s.millRate; const used = {}; let t = 0; let g = 0;
      for (const x of src) {
        if (x.left <= 1e-9 || mill <= 1e-9) continue;
        const cap = x.group ? s.groupCaps[x.group] - (used[x.group] || 0) : Infinity;
        const take = Math.min(x.left, cap, mill);
        if (take <= 1e-12) continue;
        x.left -= take; mill -= take; t += take; g += take * x.grade;
        if (x.group) used[x.group] = (used[x.group] || 0) + take;
      }
      if (t <= 1e-12) break;
      rows.push({ year, ore: t, grade: g / t });
      year++;
    }
  }
  if (trimYears > 0) rows = rows.slice(0, Math.max(0, rows.length - trimYears));
  return rows;
}

// Remove the last share of scheduled tonnes (pro rata in the final year).
function cutLife(rows, frac) {
  if (!(frac > 0)) return rows;
  let remove = sum(rows, (r) => r.ore) * frac;
  const out = rows.map((r) => ({ ...r }));
  for (let i = out.length - 1; i >= 0 && remove > 1e-12; i--) {
    const take = Math.min(out[i].ore, remove);
    out[i].ore -= take; remove -= take;
  }
  return out.filter((r) => r.ore > 1e-9);
}

// Push production later by d years (fractional). Used for deposits only.
function shiftSchedule(rows, d) {
  if (!(d > 0) || !rows.length) return rows;
  const k = Math.floor(d); const f = d - k; const first = rows[0].year; const out = [];
  for (let j = 0; j < rows.length + k + (f > 0 ? 1 : 0); j++) {
    const a = rows[j - k]; const b = rows[j - k - 1];
    let ore = 0; let g = 0;
    if (a) { ore += (1 - f) * a.ore; g += (1 - f) * a.ore * a.grade; }
    if (b && f > 0) { ore += f * b.ore; g += f * b.ore * b.grade; }
    if (ore > 1e-12) out.push({ year: first + j, ore, grade: g / ore });
  }
  return out;
}

// Streamed ounces this year from cumulative-ounce tiers.
function tierOz(tiers, cum, oz) {
  let s = 0; let lo = 0;
  for (const t of tiers) {
    const cap = t.upTo == null ? Infinity : t.upTo;
    const a = Math.max(cum, lo); const b = Math.min(cum + oz, cap);
    if (b > a) s += (b - a) * t.rate;
    lo = cap;
  }
  return s;
}

// Turn risk levels into model adjustments. Only the enabled risks count.
function dialParams(asset, levels, enabled) {
  const P = { grade: 0, life: 0, recPts: 0, mining: 0, procGa: 0, site: 0, events: [], capex: 0, finCost: 0, delay: 0,
    royaltyPts: 0, royaltyProb: 0, stateTo: null, stateProb: 0, crpMult: 0 };
  const isDeposit = asset.stage === 'deposit';
  for (const d of DIALS) {
    if (!enabled.has(d.id)) continue;
    if (d.depositsOnly && !isDeposit) continue;
    const fx = fxAt(d, levelNum(levels[d.id]));
    for (const [key, v] of Object.entries(fx)) {
      if (key === 'events') P.events.push(...v);
      else if (key === 'depositDelay') { if (isDeposit) P.delay += v; }
      else if (key === 'stateTo') P.stateTo = v;
      else P[key] += v;
    }
  }
  return P;
}

const ramp = (year, within) => Math.min(1, (year - MODEL.firstYear + 1) / within);

// Years from the valuation date to 31 Dec of `year`, by actual days ÷ 365 (Excel XNPV/XIRR convention).
const yearFrac = (year) => (Date.UTC(year, 11, 31) - MODEL.valuationUTC) / 86400000 / 365;

/**
 * Run the DCF for one asset.
 * o = { deck, flatPrice?, rate, levels, enabled:Set, ext, trimYears?, tweak? }
 * tweak = one-at-a-time sensitivity levers, as in the Tongon Sensitivity Engine:
 *   { gold (price ×), grade (×), site (site cost/t ×), haul (+US$/t), royaltyPts (+), stream (false = removed), closure (×) }
 */
// Product adapters. Gold: payable ounces priced per ounce. Spodumene: tonnes of concentrate at its grade,
// priced pro rata to an SC6 (6% Li2O) price, the usual industry convention.
const COMMODITY = {
  gold: {
    units: (milledMt, grade, rec, pr) => milledMt * 1e6 * grade / G_PER_OZ * rec * pr.payability,
    unitPrice: (price) => price,
    containedRef: (milledMt, grade) => milledMt * 1e6 * grade / G_PER_OZ,           // ounces in the ground
    refUnits: (units) => units                                                      // payable ounces, already at reference basis
  },
  spodumene: {
    units: (milledMt, grade, rec, pr) => milledMt * 1e6 * grade / 100 * rec / (pr.concGrade / 100),
    unitPrice: (price, pr) => price * pr.concGrade / 6 * (pr.realisation != null ? pr.realisation : 1),
    containedRef: (milledMt, grade) => milledMt * 1e6 * grade / 100 / 0.06,          // SC6-equivalent tonnes at full recovery
    refUnits: (units, pr) => units * pr.concGrade / 6                                // concentrate tonnes expressed as SC6 tonnes
  }
};
const commodityOf = (a) => (a && a.commodity) || 'gold';

/**
 * Run the DCF for one asset.
 * o = { deck, flatPrice?, rate, levels, enabled:Set, ext, trimYears?, tweak? }
 * tweak = one-at-a-time sensitivity levers, as in the Tongon Sensitivity Engine:
 *   { gold (price ×), grade (×), site (site cost/t ×), haul (+US$/t), royaltyPts (+), stream (false = removed), closure (×) }
 * Deposits add: construction years before production (devCapex by year), logistics and freight per unit,
 * by-product credits, royalties on FOB value, tax losses carried forward and a free carry on distributions.
 */
// A royalty can slide with the benchmark price: bands [{ upTo, rate }], the last with upTo null.
const royaltyRate = (q, price) => (q.bands ? q.bands.find((b) => b.upTo == null || price <= b.upTo).rate : q.rate);

function runCore(asset, o) {
  const P = dialParams(asset, o.levels, o.enabled);
  const tw = o.tweak || {};
  const K = COMMODITY[commodityOf(asset)];
  const c = asset.resolved; const f = asset.fiscal; const pr = asset.processing;
  const stream = tw.stream === false ? null : asset.stream;
  let rows = buildSchedule(asset, o.ext, o.trimYears || 0);
  if (P.delay > 0) rows = shiftSchedule(rows, P.delay);
  rows = cutLife(rows, -P.life);
  // Closing early: the rest of the ore stays in the ground and closure falls due at the stop.
  if (o.closeFrom != null) {
    rows = rows.filter((r) => r.year < o.closeFrom);
    if (!rows.some((r) => r.ore > 0)) rows.push({ year: o.closeFrom, ore: 0, grade: 0, closeHere: true });
  }
  // Pausing: loss years go into care and maintenance (the fixed share of site costs continues) and their ore is mined later.
  if (o.pause && o.pause.size) {
    const moved = [];
    rows = rows.map((r) => { if (o.pause.has(r.year) && r.ore > 0) { moved.push({ ore: r.ore, grade: r.grade }); return { ...r, ore: 0, cmOre: r.ore }; } return r; });
    let y = rows.length ? rows[rows.length - 1].year : MODEL.firstYear;
    for (const m of moved) rows.push({ year: ++y, ore: m.ore, grade: m.grade });
  }
  // Add construction years (capex, no production) before the first production year, and fill any gaps.
  const capYears = Object.keys(c.devCapex || {}).map(Number).filter((y) => (c.devCapex[y] || 0) !== 0);
  if (capYears.length || c.corporateFixed) {
    const firstY = Math.min(...capYears, rows.length ? rows[0].year : Infinity, c.corporateFixed ? MODEL.firstYear : Infinity);
    const lastY = rows.length ? rows[rows.length - 1].year : Math.max(...capYears);
    const byY = new Map(rows.map((r) => [r.year, r]));
    const full = []; for (let y = firstY; y <= lastY; y++) full.push(byY.get(y) || { year: y, ore: 0, grade: 0 });
    rows = full;
  }
  let lastProd = -1; rows.forEach((r, i) => { if (r.ore > 0) lastProd = i; });
  let firstProdYear = null; for (const r of rows) { if (r.ore > 0) { firstProdYear = r.year; break; } }
  const endYear = lastProd >= 0 ? rows[lastProd].year : (rows.find((r) => r.closeHere) || { year: -Infinity }).year;   // head-office costs run until here
  const stop = sum(P.events, (e) => e.p * e.months / 12);
  const recovery = Math.max(0, pr.recovery + P.recPts / 100);
  const sp = c.split;
  const unitSite = (sp.mining * (1 + P.mining) + sp.processing * (1 + P.procGa) + sp.transport + sp.ga * (1 + P.procGa) + c.haulagePerT * (1 + P.mining)) * (1 + P.site) * (tw.site || 1) + (tw.haul || 0);
  const closureCost = f.closure * (tw.closure || 1);
  const dil = P.stateTo != null && asset.stateStake < P.stateTo ? 1 - (1 - P.stateTo) / (1 - asset.stateStake) : 0;
  const rate = o.rate + P.crpMult * asset.crp.value;
  const carry = asset.freeCarry || 0;
  let remOre = sum(rows, (r) => r.ore); let taxBase = f.taxBase; let cumOz = 0; let wcPrev = null;
  let losses = f.lossCarryForward ? (f.openingLosses || 0) : 0;
  const years = [];
  rows.forEach((r, i) => {
    const last = i === lastProd || !!r.closeHere;
    const deck = o.deck;
    const basePrice = o.flatPrice != null ? o.flatPrice
      : (deck.byProdYear && firstProdYear != null && r.year >= firstProdYear ? (deck.byProdYear[r.year - firstProdYear] != null ? deck.byProdYear[r.year - firstProdYear] : deck.flat) : deckPrice(deck, r.year));
    const price = basePrice * (tw.gold || 1);
    const milled = r.ore * (1 - stop);
    const grade = r.grade * (1 + P.grade) * (tw.grade || 1);
    const oz = r.ore > 0 ? K.units(milled, grade, recovery, pr) : 0;   // payable units: ounces of gold, or tonnes of concentrate
    const sOz = stream ? tierOz(stream.tiers, cumOz, oz) : 0;
    cumOz += oz;
    const revenue = oz * K.unitPrice(price, pr);
    const byproduct = oz * (c.byproductPerUnit || 0);
    const freight = oz * (c.freightPerUnit || 0);
    const logistics = oz * (c.logisticsPerUnit || 0);
    const streamCost = stream ? sOz * price * (1 - stream.holderPayment) : 0;
    const gross = revenue + byproduct;
    const extraPts = (tw.royaltyPts || 0) / 100 + (P.royaltyPts / 100) * P.royaltyProb * ramp(r.year, MODEL.fiscalWithinYears);
    const royalties = sum(f.royalties, (q) => royaltyRate(q, price) * (q.base === 'fob' ? gross - freight : gross)) + extraPts * gross;
    const royaltyShare = gross > 0 ? royalties / gross : 0;
    const site = unitSite * 1e6 * (r.ore * MODEL.fixedShare + milled * (1 - MODEL.fixedShare)) + (r.cmOre ? unitSite * 1e6 * r.cmOre * MODEL.fixedShare : 0);
    const corporate = oz * c.corporatePerOz + (c.corporateFixed && r.year <= endYear ? c.corporateFixed : 0);
    const exploration = oz * c.explorationPerOz;
    const other = oz * (c.otherPerUnit || 0);   // carbon, marketing and other costs per unit sold
    const ebitda = gross - streamCost - royalties - site - corporate - exploration - logistics - freight - other;
    const sustaining = c.sustainingPerT * milled * 1e6 + (c.sustainingPerUnit || 0) * oz;
    const growth = c.growthCapex[r.year] || 0;
    const development = (c.devCapex[r.year] || 0) * (1 + P.capex) * (1 + P.finCost);
    const capex = sustaining + growth + development;
    const share = last ? 1 : (remOre > 0 ? r.ore / remOre : 0);
    const depreciation = (taxBase + capex) * Math.min(1, share);
    taxBase = taxBase + capex - depreciation; remOre -= r.ore;
    let taxable = ebitda - depreciation;
    if (f.lossCarryForward) {
      if (taxable < 0) { losses += -taxable; taxable = 0; } else { const use = Math.min(losses, taxable); taxable -= use; losses -= use; }
    }
    const tax = Math.max(0, taxable * f.taxRate);
    const revenueAfterStream = revenue - streamCost;   // receivables basis, as in the Tongon spreadsheet
    const wc = revenueAfterStream * f.wc.receivableDays / 365 + site * f.wc.inventoryDays / 365 - site * f.wc.payableDays / 365;
    const dWC = wcPrev == null ? 0 : wc - wcPrev; wcPrev = wc;
    const closure = last ? closureCost : 0;
    const fcf = ebitda - capex - tax - dWC - closure;
    const ownerShare = asset.ownerShare * (1 - P.stateProb * ramp(r.year, MODEL.fiscalWithinYears) * dil);
    years.push({ year: r.year, ore: r.ore, milled, grade, recovery, oz, price, revenue, byproduct, streamOz: sOz, stream: streamCost, royaltyRate: royaltyShare, royalties,
      site, corporate, exploration, other, logistics, freight, ebitda, sustaining, growth, development, capex, depreciation, tax, wc, dWC, closure, fcf, ownerShare });
  });
  if (years.length) {
    const relYear = years[years.length - 1].year + 1;
    if (f.wcReleaseHorizon == null || relYear <= f.wcReleaseHorizon) {
      const z = { year: relYear, release: true, ore: 0, milled: 0, grade: 0, recovery: 0, oz: 0, price: 0, revenue: 0, byproduct: 0, streamOz: 0, stream: 0, royaltyRate: 0,
        royalties: 0, site: 0, corporate: 0, exploration: 0, other: 0, logistics: 0, freight: 0, ebitda: 0, sustaining: 0, growth: 0, development: 0, capex: 0, depreciation: 0, tax: 0,
        wc: 0, dWC: -wcPrev, closure: 0, fcf: wcPrev, ownerShare: years[years.length - 1].ownerShare };
      years.push(z);
    }
  }
  let npv = 0; let npvAttr = 0;
  for (const y of years) {
    y.t = yearFrac(y.year);
    y.df = 1 / Math.pow(1 + rate, y.t);
    // A free carry takes its share of distributions but funds nothing, so the owner bears all spending.
    y.attrFcf = y.fcf >= 0 ? y.fcf * y.ownerShare * (1 - carry) * (1 - (asset.wht || 0)) : y.fcf * y.ownerShare;   // withholding tax on distributions, if set
    y.pv = y.fcf * y.df; y.pvAttr = y.attrFcf * y.df;
    npv += y.pv; npvAttr += y.pvAttr;
  }
  const prodYears = years.filter((y) => !y.release && y.ore > 0);
  const y1 = prodYears[0];
  const lomOz = sum(prodYears, (y) => y.oz);
  const totalOre = sum(prodYears, (y) => y.ore);
  const peakOre = prodYears.length ? Math.max(...prodYears.map((y) => y.ore)) : 0;
  const res = {
    years, rate, npv, npvAttr, lomOz, totalOre, firstProdYear,
    life: peakOre > 0 ? totalOre / peakOre : 0,
    prod1: y1 ? y1.oz : 0,
    aisc1: y1 && y1.oz > 0 ? (y1.site + y1.royalties + y1.sustaining + y1.corporate + y1.exploration + y1.logistics + y1.other - y1.byproduct) / y1.oz : NaN,
    tx: null, flex: null
  };
  res.irr = irr(years.map((y) => ({ t: y.t, cf: y.attrFcf })));
  res.pvAt = (h) => sum(years, (y) => y.attrFcf / Math.pow(1 + h, y.t));   // the most a buyer could pay today for a return of h
  if (asset.transaction) res.tx = transactionMetrics(asset, years, rate);
  return res;
}

// An owner stops mining when it stops paying. If the cash margin (EBITDA less sustaining capex) turns negative and the
// price deck never recovers, the mine closes for good; if it recovers, loss years are paused and their ore mined later.
// The owner takes whichever path is worth more, so the option never lowers value. o.flex === false turns it off.
function runModel(asset, o) {
  const r0 = runCore(asset, o);
  if (o.flex === false || o.closeFrom != null || o.pause) return r0;
  const margin = (y) => y.ebitda - y.sustaining;
  const prod = r0.years.filter((y) => !y.release && y.ore > 0);
  const loss = prod.filter((y) => margin(y) < 0);
  if (!loss.length) return r0;
  const t0 = loss[0].year;
  if (!prod.some((y) => y.year > t0 && margin(y) > 0)) {
    const r1 = runCore(asset, { ...o, closeFrom: t0 }); r1.flex = { closedFrom: t0, paused: [] };
    return r1.npvAttr > r0.npvAttr ? r1 : r0;
  }
  const pause = new Set(loss.filter((y) => margin(y) + y.site * MODEL.fixedShare < 0).map((y) => y.year));   // pausing beats a loss bigger than the fixed costs
  if (!pause.size) return r0;
  const r1 = runCore(asset, { ...o, pause }); r1.flex = { closedFrom: null, paused: [...pause] };
  return r1.npvAttr > r0.npvAttr ? r1 : r0;
}

function contingentByYear(t) {
  const m = {};
  if (!t.contingentYears || !t.contingentYears.length || !t.contingentTotal) return m;
  const per = t.contingentTotal * t.contingentPaidShare / t.contingentYears.length;
  for (const y of t.contingentYears) m[y] = per;
  return m;
}

function transactionMetrics(asset, years, rate) {
  const t = asset.transaction; const cont = contingentByYear(t);
  const flows = [{ t: 0, year: MODEL.firstYear - 1, cf: -t.upfront }];
  const byYear = {};
  for (const y of years) byYear[y.year] = (byYear[y.year] || 0) + y.attrFcf;
  for (const yr of Object.keys(cont)) byYear[yr] = (byYear[yr] || 0);
  for (const yr of Object.keys(byYear).map(Number).sort((a, b) => a - b)) {
    flows.push({ t: yearFrac(yr), year: yr, cf: byYear[yr] - (cont[yr] || 0) });
  }
  const npvAt = (r) => sum(flows, (x) => x.cf / Math.pow(1 + r, x.t));
  let cum = 0; let payback = null;
  for (const x of flows) { cum += x.cf; if (payback == null && x.t > 0 && cum >= 0) payback = x.year; }
  return { flows, npv: npvAt(rate), irr: irr(flows), upfront: t.upfront, contingent: cont, payback };
}

// IRR: scan upward from -50% for the first sign change, then bisect. Flows that end with a small
// negative (a working-capital unwind) can have a second, meaningless root far below -50%.
function irr(flows) {
  const f = (r) => sum(flows, (x) => x.cf / Math.pow(1 + r, x.t));
  let lo = -0.5; let flo = f(lo); let hi = null;
  for (let r = lo + 0.01; r <= 10.0001; r += (r < 1 ? 0.01 : 0.1)) {
    const fr = f(r);
    if (isFinite(fr) && isFinite(flo) && flo * fr <= 0) { hi = r; break; }
    lo = r; flo = fr;
  }
  if (hi == null) return null;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2; const fm = f(mid);
    if (Math.abs(fm) < 1e-6) return mid;
    if (fm * flo > 0) { lo = mid; flo = fm; } else { hi = mid; }
  }
  return (lo + hi) / 2;
}

const ALL_DIALS = () => new Set(DIALS.map((d) => d.id));
// The flat benchmark price (real) at which the owner's NPV after risks is zero; null if it is not reached by hi.
function breakevenPrice(asset, ctl, hi = 10000) {
  const at = (p) => runModel(asset, { ...ctl, enabled: ALL_DIALS(), flatPrice: p }).npvAttr;
  if (at(hi) < 0) return null;
  let lo = 0; if (at(lo) >= 0) return 0;
  for (let i = 0; i < 20; i++) { const mid = (lo + hi) / 2; if (at(mid) >= 0) hi = mid; else lo = mid; }
  return hi;
}

// Value before and after risks, and what each risk takes, for one asset under one set of controls.
function analyse(asset, ctl) {
  const common = { deck: ctl.deck, rate: ctl.rate, levels: ctl.levels, ext: ctl.ext };
  const base = runModel(asset, { ...common, enabled: new Set() });
  const risk = runModel(asset, { ...common, enabled: ALL_DIALS() });
  const bridge = []; const on = new Set(); let prev = base;
  for (const d of DIALS) {
    on.add(d.id);
    const cur = on.size === DIALS.length ? risk : runModel(asset, { ...common, enabled: new Set(on) });
    const applies = !(d.depositsOnly && asset.stage !== 'deposit');
    bridge.push({ dial: d, level: ctl.levels[d.id], delta: cur.npvAttr - prev.npvAttr, applies, after: cur.npvAttr });
    prev = cur;
  }
  return { base, risk, bridge };
}

// Everything the model needs, derived from the inputs. Pure: inputs in, numbers out.
// wi holds the what-if moves (percent or points), all zero for your inputs as entered, and wi.scale multiplies single
// inputs for the sensitivity of each input. A blank input takes the typical value from the studies before it is scaled.
function depositDerived(d, wi = {}) {
  const sc = (k) => (wi.scale && wi.scale[k]) || 1;
  const juris = jurisOf(d.juris);
  const cats = [['mea', d.mea], ['ind', d.ind], ['inf', d.inf]].filter(([k, c]) => c && c.mt > 0 && (k !== 'inf' || d.includeInferred));
  const resMt = sum(cats, ([, c]) => c.mt);
  const resGrade = resMt > 0 ? sum(cats, ([, c]) => c.mt * c.g) / resMt : 0;
  const infMt = d.includeInferred && d.inf ? d.inf.mt : 0;
  const share = (d.planShare != null ? d.planShare : typical('plan_share_of_resource').median) / 100;
  const dil = (d.dilution != null ? d.dilution : typical('dilution_pct').median) / 100;
  const planMt = (d.planMt != null ? d.planMt : resMt * share * (1 + dil)) * sc('tonnes');
  const planGrade = (d.planGrade != null ? d.planGrade : resGrade / (1 + dil)) * (1 + (wi.grade || 0) / 100) * sc('grade');
  const inferredShare = d.inferredShare != null ? d.inferredShare / 100 : (resMt > 0 ? infMt / resMt : 0);
  const taylorLife = planMt > 0 ? 0.2 * Math.pow(planMt * 1e6, 0.25) : 0;
  const rate = (d.rate != null ? d.rate : (taylorLife > 0 ? planMt / taylorLife : 0)) * sc('rate');
  const strip = d.method === 'ug' ? 0 : (d.strip != null ? d.strip : typical('strip_ratio_op').median) * sc('strip');
  const mOp = (d.miningOp != null ? d.miningOp : typical('mining_cost_op_per_t_material').median) * sc('miningOp');
  const mUg = (d.miningUg != null ? d.miningUg : typical('mining_cost_ug_per_t_ore').median) * sc('miningUg');
  const ug = d.method === 'ug' ? 1 : d.method === 'op' ? 0 : (d.ugShare != null ? d.ugShare / 100 : 0.3);
  const ox = 1 + (wi.opex || 0) / 100;
  const miningPerTOre = ((1 - ug) * mOp * (1 + strip) + ug * mUg) * ox;
  // Blank inputs take the typical value from the studies.
  const flot = d.route === 'flot';
  const recovery = Math.max(1, Math.min(100, (d.recovery != null ? d.recovery : typical(flot ? 'recovery_flotation' : 'recovery_dms').median) * sc('recovery') + (wi.recovery || 0)));
  const processing = (d.processing != null ? d.processing : typical(flot ? 'processing_cost_flotation' : 'processing_cost_dms').median) * ox * sc('processing');
  const ga = (d.ga != null ? d.ga : typical('site_ga_per_t_ore').median) * ox * sc('ga');
  const sustaining = (d.sustaining != null ? d.sustaining : typical('sustaining_capex_per_t_conc').median) * sc('sustaining');
  const freight = (d.freight != null ? d.freight : typical('ocean_freight').median) * sc('freight');
  const concGrade = d.concGrade || 6;
  const legs = (d.legs || []).filter((l) => l && l.km > 0);
  const legRate = (l) => l.rate != null ? l.rate : (l.mode === 'truck' ? typical('road_haul_per_t_km').median : 0);
  const missingRates = legs.filter((l) => l.rate == null && l.mode !== 'truck').map((l) => l.mode);
  const logisticsPerT = (sum(legs, (l) => l.km * legRate(l)) + (d.port || 0)) * sc('logistics');
  const oreHaulPerT = d.plantMode === 'existing' ? (d.oreHaulKm || 0) * (d.oreHaulRate != null ? d.oreHaulRate : typical('road_haul_per_t_km').median) : 0;
  const intensity = typical('capex_per_annual_t_ore').median;
  const capexTypical = rate * 1e6 * intensity / 1e6 * (d.plantMode === 'existing' ? typical('existing_plant_capex_ratio').median / 100 : 1);
  const capexM = ((d.capex != null ? d.capex : capexTypical) + (d.infraCapex || 0)) * (1 + (wi.capex || 0) / 100) * sc('capex');
  const decision = (d.decisionYears != null ? d.decisionYears : ({ granted: 0, progress: 1, none: 2 }[d.permits] ?? 1)) + (wi.delay || 0);
  const build = d.buildYears || 2;
  const startBuild = MODEL.firstYear + decision;
  const devCapex = {}; (BUILD_PHASING[build] || BUILD_PHASING[2]).forEach((f, i) => { devCapex[startBuild + i] = capexM * 1e6 * f; });
  const firstProd = startBuild + Math.floor(build);
  const ramp = Array.isArray(d.ramp) ? d.ramp : (RAMPS[d.ramp] || []);
  let rows = []; let left = planMt; let y = firstProd; let i = 0;

const SECTIONS = [

// What a blank field means, shown in grey.
function blankValue(key, d, D, t) {
  if (t) return num1(t.median, dpFor(t.median));
  const J = jurisOf(d.juris);
  const m = { capex: Math.round(D.capexTypical), rate: num1(D.rate), planMt: num1(D.planMt, 1), planGrade: num1(D.planGrade), inferredShare: num1(D.inferredShare * 100, 0), ugShare: 30,
    dealFx: num1(FX_DEFAULT[CCY_SYM[d.dealCcy] ? d.dealCcy : 'USD'], 4), fundDebtPct: FUND_DEBT, raiseDiscPct: RAISE_DISC, sharePrice: '', sharesM: '',
    decisionYears: D.decision, wcDays: 30, royalty: num1(sum(J.royalties || [], (r) => r.rate) * 100, 2), tax: num1(D.tax * 100, 1), freeCarry: num1((J.carry || 0) * 100, 0) };
  return key in m ? m[key] : 0;
}

function fieldInfo(key, f, d, t, v) {
  const parts = [];
  if (f.help) parts.push(`<p>${esc(f.help)}</p>`);
  if (key === 'juris') { const J = jurisOf(d.juris); if (J.note) parts.push(`<p>${esc(J.note)}</p>`); }
  if (key === 'deck') parts.push(`<p>${Object.values(LITHIUM_DECKS).map((k) => `<b>${esc(k.label)}:</b> ${esc(k.desc)}`).join('<br>')}</p>`);
  if (key === 'capex') { const c = typical('capex_per_annual_t_ore'); parts.push(`<p><b>Typical:</b> US$${num1(c.median, 1)} per tonne of yearly ore capacity (${c.n} studies, ${num1(c.low, 0)}–${num1(c.high, 0)}). Remote greenfield sites sit at the top.</p><p><button type="button" class="link-btn" data-dep-src="capex">Sources</button></p>`); }
  if (t) parts.push(`<p><b>Typical:</b> ${num1(t.median, dpFor(t.median))} ${esc(t.unit)} (${t.n} ${t.n === 1 ? 'study' : 'studies'}${t.n > 1 ? `, ${num1(t.low)}–${num1(t.high)}` : ''}). Leave blank to use it.</p>
    <p>${v != null && Math.abs(v - t.median) > 1e-9 ? `<button type="button" class="link-btn" data-dep-typ="${key}">Use typical</button> · ` : ''}<button type="button" class="link-btn" data-dep-src="${key}">Sources</button></p>`);
  return parts.length ? info(`i-${key}`, parts.join(''), `About ${f.label}`) : '';
}

function fieldRow(key, d, D) {
  if (key === 'RESOURCE') return resourceRow(d);
  if (key === 'LEGS') return legsRow(d, D);
  const f = F[key]; if (!f || (f.show && !f.show(d))) return '';
  const id = `dep-${key}`; const v = getPath(d, key); const t = f.typical ? f.typical(d) : null;
  const number = (attrs, value, ph) => `<input id="${id}" ${attrs} type="number" min="0" inputmode="decimal" value="${value}"${ph != null ? ` placeholder="${esc(String(ph))}"` : ''}>`;
  let control;
  if (f.type === 'text') control = `<input id="${id}" data-dep="${key}" data-type="text" type="text" value="${esc(v || '')}">`;
  else if (f.type === 'bool') control = `<select id="${id}" data-dep="${key}" data-type="bool">${options(OPT.yesno, v ? 'yes' : 'no')}</select>`;
  else if (f.type === 'sel') {
    const cur = Array.isArray(v) ? 'custom' : String(v);
    const extra = cur === 'custom' ? [['custom', 'From the study']] : f.opts.some(([o]) => o === cur) ? [] : [[cur, f.oddLabel ? f.oddLabel(cur) : cur]];   // a study value outside the options, e.g. SC5.8
    control = `<select id="${id}" data-dep="${key}" data-type="${f.num ? 'numsel' : 'sel'}">${options(f.opts.concat(extra), cur)}</select>`;
  } else if (f.type === 'juris') {
    control = `<select id="${id}" data-dep="juris" data-type="sel"><optgroup label="Presets from studies">${options(LI_JURIS.map((j) => [j.id, j.label]), v)}</optgroup><optgroup label="Other countries">${options(COUNTRY_RISK.map((r) => [r[0], r[0]]), v)}</optgroup></select>`;
  } else if (f.type === 'deck') control = `<select id="${id}" data-dep-deck="1">${options(Object.values(LITHIUM_DECKS).map((k) => [k.id, k.label]), state.deckBy.spodumene)}</select>`;
  else if (f.type === 'rate') control = number('data-dep-rate="1" step="0.5" max="20"', (state.rateBy.spodumene * 100).toFixed(1));
  else if (f.type === 'lt') control = number('data-dep-lt="1" step="any"', state.lt.spodumene ?? '', Math.round(LITHIUM_DECKS[state.deckBy.spodumene].flat));
  else if (f.type === 'pct') control = number(`data-dep="${key}" data-type="pct" step="any" max="100"`, v != null ? +(v * 100).toFixed(4) : '');
  else control = number(`data-dep="${key}" data-type="num" step="any"`, v ?? '', blankValue(key, d, D, t));
  const unit = control.startsWith('<input') && f.type !== 'text' ? `<span class="u">${esc(f.unit || '')}</span>` : '';
  return `<div class="c-f" id="row-${key}"><div class="c-fl"><label for="${id}">${esc(f.label)}</label>${fieldInfo(key, f, d, t, v)}</div><div class="c-in">${control}${unit}</div></div>`;
}

function resourceRow(d) {
  const cell = (k, part, lbl) => `<td><input id="dep-${k}-${part}" data-dep="${k}.${part}" data-type="num" type="number" step="any" min="0" inputmode="decimal" value="${getPath(d, `${k}.${part}`) || ''}" aria-label="${lbl}"></td>`;
  const row = (k, name) => `<tr><th scope="row">${name}</th>${cell(k, 'mt', `${name} tonnes, Mt`)}${cell(k, 'g', `${name} grade, % Li₂O`)}</tr>`;
  return `<div class="c-f wide"><div class="c-fl">Resource${info('i-resource', '<p>From the resource statement. Only Measured and Indicated can become reserves.</p>', 'About the resource')}</div>
    <div class="table-wrap"><table class="res"><thead><tr><th scope="col"></th><th scope="col">Mt</th><th scope="col">% Li₂O</th></tr></thead><tbody>${row('mea', 'Measured')}${row('ind', 'Indicated')}${row('inf', 'Inferred')}</tbody></table></div></div>`;
}

function legsRow(d, D) {
  const legs = d.legs && d.legs.length ? d.legs : [{ mode: 'truck', km: 0, rate: null }];
  const tr = typical('road_haul_per_t_km');
  const rows = [0, 1].map((i) => {
    const l = legs[i] || { mode: 'rail', km: 0, rate: null };
    const input = (part, value, lbl, ph = '') => `<td><input id="dep-leg${i}-${part}" data-dep="legs.${i}.${part}" data-type="num" type="number" step="any" min="0" inputmode="decimal" value="${value}"${ph ? ` placeholder="${ph}"` : ''} aria-label="Leg ${i + 1} ${lbl}"></td>`;
    return `<tr><th scope="row">${i + 1}</th><td><select id="dep-leg${i}-mode" data-dep="legs.${i}.mode" data-type="sel" aria-label="Leg ${i + 1} mode">${options(OPT.mode, l.mode)}</select></td>
      ${input('km', l.km || '', 'distance, km')}${input('rate', l.rate ?? '', 'rate, US$ per tonne-km', l.mode === 'truck' ? num1(tr.median, 3) : 'rate')}</tr>`;
  }).join('');
  const many = D.missingRates.length > 1;
  const missing = D.missingRates.length ? `<p class="c-warn">${esc(cap1(D.missingRates.join(' and ')))} ${many ? 'have' : 'has'} no rate, so ${many ? 'they cost' : 'it costs'} nothing. Enter a rate.</p>` : '';
  return `<div class="c-f wide"><div class="c-fl">Concentrate to port${info('i-legs', `<p>Up to two legs. A blank truck rate uses the typical road rate, US$${num1(tr.median, 3)}/t-km (${tr.n} studies). Rail, conveyor and barge need a rate.</p><p><button type="button" class="link-btn" data-dep-src="road">Sources</button></p>`, 'About haulage')}</div>
    <div class="table-wrap"><table class="res"><thead><tr><th scope="col">Leg</th><th scope="col">Mode</th><th scope="col">km</th><th scope="col">US$/t-km</th></tr></thead><tbody>${rows}</tbody></table></div>${missing}</div>`;
}

function renderInputs() {
  const d = state.dep; const D = depositDerived(d);
  morph($('#inputs'), SECTIONS.map((sec) => `<details class="c-sec" data-open-id="sec-${sec.id}" ${state.open.has(`sec-${sec.id}`) ? 'open' : ''}>
      <summary id="sum-${sec.id}"><span class="c-sec-t">${esc(sec.title)}</span><span class="c-sec-s">${esc(D.resMt > 0 || sec.id === 'deposit' ? sec.sum(d, D) : '')}</span></summary>
      <div class="c-sec-b">${sec.keys.map((k) => fieldRow(k, d, D)).join('')}</div></details>`).join(''));
}

// Apply an edited input. Numbers can't go below zero, and percentages stop at 100.
function onDepInput(t) {
  const path = t.dataset.dep; const ty = t.dataset.type; const raw = t.value;
  let v;
  if (ty === 'text') v = raw;
  else if (ty === 'bool') v = raw === 'yes';
  else if (ty === 'sel') v = raw === 'custom' ? getPath(state.dep, path) : raw;
  else if (ty === 'numsel') v = raw === 'custom' ? getPath(state.dep, path) : Number(raw);
  else if (ty === 'pct') v = raw === '' ? null : Math.max(0, Math.min(100, Number(raw))) / 100;
  else { v = raw === '' ? null : Math.max(0, Number(raw)); if (v != null && (F[path] || {}).unit === '%') v = Math.min(v, 100); }
  if (typeof v === 'number' && !isFinite(v)) return;
  if (path === 'juris') { state.dep.royalty = null; state.dep.tax = null; state.dep.freeCarry = null; }
  if (path === 'route') { state.dep.recovery = null; state.dep.processing = null; }   // the typical values for the new route apply
  if (path === 'planMt' && v == null) { state.dep.planGrade = null; state.dep.inferredShare = null; }
  setPath(state.dep, path, v);
  state.undo = null; hideToast();
  rebuildCustom(); renderAll();
}

function evidenceSheet(key) {
  const k = key === 'road' ? 'road_haul_per_t_km' : key === 'capex' ? 'capex_per_annual_t_ore' : null;
  const f = F[key];
  const t = k ? typical(k) : (f && f.typical ? f.typical(state.dep) : null);
  if (!t) return;
  const items = t.points.map((p) => `<li><div class="ev-head"><span>${esc((LI_STUDIES[p[0]] || { source: p[0] }).source)}</span><span class="pill flag-${p[3] ? 'derived' : 'sourced'}">${p[3] ? 'Derived' : 'Sourced'}</span></div><span class="ev-val">${num1(p[1], 3)} ${esc(t.unit)}</span><span class="ev-src">Page ${esc(p[2])}${p[3] ? ` · ${esc(p[3])}` : ''}</span></li>`).join('');
  openSheet(t.label, `<div class="kv"><span>Median</span><span>${num1(t.median, 3)} ${esc(t.unit)}</span><span>Range</span><span>${num1(t.low, 3)}–${num1(t.high, 3)}</span><span>Studies</span><span>${t.n}</span></div>
    ${t.note ? `<p class="small muted">${esc(t.note)}</p>` : ''}<h3>Where it comes from</h3><ul class="ev-list">${items}</ul>
    <p class="small muted">In US$ at each study’s own exchange rate, escalated to November 2025 prices where marked. The calculator uses the median.</p>`);
}

/* ---------- Value bar ---------- */
const whatIfOn = () => Object.values(state.whatIf).some((v) => v);

  const rate = Math.max(0, state.rateBy.spodumene + (wi.rate || 0) / 100) * (sc.drate || 1);

}

    case 'ground': { const c = D.miningPerTOre * (1 + (fx.mining || 0)); return { fig: money1(c, '/t ore'), end: money1(c), note: join('mining', lost ? `${num1(lost * 100, 2)}% output lost` : '') }; }
    case 'infra': { const c = (D.processing + D.ga) * (1 + (fx.procGa || 0)); return { fig: money1(c, '/t ore'), end: money1(c), note: join('processing + G&A', lost ? `${num1(lost * 100, 2)}% output lost` : '') }; }
    case 'people': { const c = site * (1 + (fx.site || 0)); return { fig: money1(c, '/t ore'), end: money1(c), note: join('site costs', late) }; }

/* ---------- Key numbers: the figures analysts compare across projects ---------- */
const LCE_PER_LI2O = 2.473;   // tonnes of lithium carbonate per tonne of Li2O: 2 × 73.89 ÷ 2 ÷ 29.88 (molar masses)
// Output and unit costs are as planned (before risks); breakeven, payback and value per tonne are after risks.
function keyNumbers(a, an) {
  const D = a.derived; const prod = an.base.years.filter((y) => !y.release && y.oz > 0);
  const conc = sum(prod, (y) => y.oz);
  const c1Total = sum(prod, (y) => y.site + y.logistics + y.other - (y.byproduct || 0));
  const c1 = conc > 0 ? c1Total / conc : NaN;
  const aisc = conc > 0 ? (c1Total + sum(prod, (y) => y.royalties + y.sustaining + y.corporate + y.exploration)) / conc : NaN;
  let cum = 0; let payback = null;
  for (const y of an.risk.years) { cum += y.attrFcf; if (payback == null && y.oz > 0 && cum >= 0) payback = y.year; }
  const be = an.be !== undefined ? an.be : breakevenPrice(a, ctlFor(a)); const lt = curDeckFor(a).flat;
  const capex = D.capexM * 1e6 * a.ownerShare; const v = an.risk.npvAttr;
  const lce = D.resMt * 1e6 * D.resGrade / 100 * LCE_PER_LI2O;   // tonnes of LCE in the resource, 100%
  const lceYear = D.concPerYear * D.concGrade / 100 * LCE_PER_LI2O;
  const usd = (x, dp = 0) => `${x < 0 ? MINUS : ''}US$${num1(Math.abs(x), dp)}`;
  return [
    { label: 'Output', value: `${num1(D.concPerYear / 1000, 0)} kt/yr`, sub: `SC${D.concGrade} concentrate; ${num1(lceYear / 1000, 1)} kt LCE`, csv: (D.concPerYear / 1000).toFixed(1), unit: 'kt of concentrate a year at full rate' },
    { label: 'Mine life', value: `${num1(D.life, 1)} years`, sub: `${num1(D.planMt, 1)} Mt at ${num1(D.planGrade, 2)}% Li₂O`, csv: D.life.toFixed(1), unit: 'years at full rate' },
    { label: 'C1 cost', value: `${usd(c1)}/t`, sub: 'FOB: mine, plant, site, haul to ship', csv: c1.toFixed(0), unit: 'US$/t concentrate, FOB, before risks' },
    { label: 'AISC', value: `${usd(aisc)}/t`, sub: 'C1 + royalties, sustaining, head office', csv: aisc.toFixed(0), unit: 'US$/t concentrate, FOB, before risks' },
    { label: 'Breakeven price', value: be == null ? 'over US$10,000' : `${usd(be)}/t`, sub: `SC6 flat, after risks; long term ${usd(lt)}`, csv: be == null ? '' : be.toFixed(0), unit: 'US$/t SC6, flat, real, after risks' },
    { label: 'Payback', value: payback ? String(payback) : 'not reached', sub: payback ? `year ${payback - an.risk.firstProdYear + 1} of output, after risks` : 'after risks', csv: payback || '', unit: 'calendar year, undiscounted, after risks' },
    { label: 'Value ÷ capex', value: `${v < 0 ? MINUS : ''}${num1(Math.abs(v / capex), 2)}×`, sub: 'NPV after risks ÷ initial capex', csv: (v / capex).toFixed(2), unit: 'owner’s share of each' },
    { label: 'Resource', value: `${num1(lce / 1e6, 2)} Mt LCE`, sub: `${usd(v / (lce * a.ownerShare))}/t LCE after risks`, csv: (lce / 1e6).toFixed(3), unit: 'Mt LCE in the resource (100%)' }
  ];
}
const ICON_DOWNLOAD = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 1.5v8M3.8 6.4 7 9.6l3.2-3.2M2 12.5h10"/></svg>';
function keyNumbersHTML(a, an) {
  const tip = `<p><b>Output</b> is concentrate a year at full rate, and its lithium carbonate equivalent (LCE = Li₂O × ${LCE_PER_LI2O}).</p>
    <p><b>C1</b> is mining, processing, site G&amp;A, haulage to the ship and other costs, less by-product credits, per tonne of concentrate, free on board. <b>AISC</b> adds royalties, sustaining capex and head office.</p>

/* ---------- Deal price: equity value, value per share, P/NAV, and the methods side by side ---------- */
function dealInputs(d) {
  const ccy = CCY_SYM[d.dealCcy] ? d.dealCcy : 'USD';
  return { ccy, sym: CCY_SYM[ccy], fx: d.dealFx > 0 ? d.dealFx : FX_DEFAULT[ccy], price: d.sharePrice, shares: d.sharesM,
    cash: d.cashM || 0, debt: d.debtM || 0, other: d.otherM || 0, gear: (d.fundDebtPct ?? FUND_DEBT) / 100, disc: (d.raiseDiscPct ?? RAISE_DISC) / 100 };
}
// Resource the owner holds, in the unit deals are quoted in.
function resourceUnits(a) { const D = a.derived; return D.resMt * 1e6 * D.resGrade / 100 * LCE_PER_LI2O * a.ownerShare; }
function dealValues(a, an) {
  const D = a.derived; const k = dealInputs(state.dep); const usd = (x) => x * 1e6 * k.fx;
  const net = usd(k.cash) - usd(k.debt) + usd(k.other);
  const eqRisk = an.risk.npvAttr + net; const eqBase = an.base.npvAttr + net;
  const gap = Math.max(0, D.capexM * 1e6 * a.ownerShare - usd(k.cash));   // what must be raised to build
  const listed = k.price > 0 && k.shares > 0;
  const shares = listed ? k.shares * 1e6 : null; const priceUsd = listed ? k.price * k.fx : null;
  const mcap = listed ? priceUsd * shares : null;
  const ev = listed ? mcap - net : null;
  const equityRaised = gap * (1 - k.gear); const debtRaised = gap * k.gear;
  const issue = listed ? priceUsd * (1 - k.disc) : null;
  const newShares = listed && issue > 0 ? equityRaised / issue : null;
  const res = resourceUnits(a);
  // DCF after risks across price ±10% and the discount rate ±1 point, the usual football-field band
  const corners = [[-10, 1], [-10, -1], [10, 1], [10, -1]].map(([p, r]) => wiValue({ price: p, rate: r }) + net);
  const methods = [{ k: 'dcf', label: 'DCF after risks', lo: Math.min(...corners), hi: Math.max(...corners), mid: eqRisk, note: 'price ±10%, discount rate ±1 point' }];
  const M = MARKET[commodityOf(a)] || {};
  if (M.pnav) methods.push({ k: 'pnav', label: 'Peers’ P/NAV', lo: an.base.npvAttr * M.pnav.q1 + net, hi: an.base.npvAttr * M.pnav.q3 + net, mid: an.base.npvAttr * M.pnav.median + net,
    note: `${num1(M.pnav.q1, 2)}–${num1(M.pnav.q3, 2)}× value before risks (median ${num1(M.pnav.median, 2)}×, ${M.pnav.n} developers)` });
  if (M.perUnit && res > 0) methods.push({ k: 'deals', label: 'Precedent deals', lo: res * M.perUnit.q1 + net, hi: res * M.perUnit.q3 + net, mid: res * M.perUnit.median + net,
    note: `US$${num1(M.perUnit.q1, 0)}–${num1(M.perUnit.q3, 0)} per ${M.unit} of resource (median US$${num1(M.perUnit.median, 0)}, ${M.perUnit.n} deals)` });
  const med = (xs) => { const s = [...xs].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const range = methods.length > 1 ? { lo: med(methods.map((m) => m.lo)), hi: med(methods.map((m) => m.hi)) } : { lo: methods[0].lo, hi: methods[0].hi };
  return { k, net, eqRisk, eqBase, gap, listed, shares, priceUsd, mcap, ev, equityRaised, debtRaised, issue, newShares, res, methods, range,
    perShare: listed ? eqRisk / shares : null, perShareBase: listed ? eqBase / shares : null,
    funded: listed && newShares != null ? (eqRisk + equityRaised) / (shares + newShares) : null,
    pnavBase: listed && eqBase > 0 ? mcap / eqBase : null, pnavRisk: listed && eqRisk > 0 ? mcap / eqRisk : null,
    evPerUnit: listed && res > 0 ? ev / res : null, upside: listed && eqRisk !== 0 ? (eqRisk / mcap) - 1 : null };
}
let dealChart = null;   // what the football field draws
function dealHTML(a, an) {
  const v = dealValues(a, an); const k = v.k; dealChart = v;
  const sh = (x, sym) => `${x < 0 ? MINUS : ''}${sym}${num1(Math.abs(x), Math.abs(x) < 1 ? 3 : 2)}`;
  const usdSh = (x) => (x == null || !isFinite(x) ? '–' : sh(x, 'US$'));

  const rows = v.methods; const H = top + rows.length * rowH + axisH;

  const x0 = labelW + 8; const x1 = W - 8; const sx = (x) => x0 + (x - x0v) / ((x1v - x0v) || 1) * (x1 - x0);

    g += `<rect x="${xa}" y="${y - 7}" width="${w}" height="14" rx="3" class="f-range"/><line x1="${sx(m.mid)}" x2="${sx(m.mid)}" y1="${y - 10}" y2="${y + 10}" class="s-after" stroke-width="2.5"/>`;
